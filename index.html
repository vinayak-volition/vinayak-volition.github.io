<title>Safety Audit Platform - Pilot v0.3</title>
<style>
:root{--navy:#1f3864;--blue:#2f5597;--ink:#18212f;--mut:#5f6670;--line:#dfe3ea;--bg:#f3f5f9;--card:#fff;--r:12px}

.ib.del{font-size:14px;width:34px;height:34px;color:#c5221f;flex:none}
.who{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:22px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:6px}
.who span{background:#f5b301;color:#1f3864;font-weight:700;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-size:12px}

.lnk{border:0;background:none;color:var(--blue);padding:4px 0;text-decoration:underline;font-size:13px;text-align:left}

.note.warn{background:#fff4d6;border-color:#e0a100}.note.lock{background:#eceef2;border-color:#7a828e}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#e6e8eb;color:#444b55;white-space:nowrap}

.count{background:#e6e8eb;border-radius:20px;font-size:12px;padding:1px 9px;margin-left:4px;color:#444b55}
.acard{cursor:pointer}.acard small{display:block;color:var(--mut)}.ac-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.ref{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.3px}
.site{display:block;font-size:16px}.ac-f{display:flex;align-items:flex-end;gap:14px;margin-top:10px}.sc{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}.sc b{font-size:20px}

.matrix{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;margin:8px 0}.matrix th{font-size:11px;color:var(--mut);font-weight:600;width:auto}.matrix th:first-child{width:38px}.matrix td{height:36px;text-align:center;font-weight:800;border-radius:6px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}

.search{width:100%;margin-bottom:10px}

.sbody{flex:1;min-width:0}.sbody small,.row small{display:block;color:var(--mut)}.chev{color:#9aa3af;font-size:22px}
.sid{flex:none;width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;font-size:17px}.sid.sm{width:28px;height:28px;font-size:13px;border-radius:7px;display:inline-grid}
.srow{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 0;margin:0;align-items:flex-start}.srow:last-child{border-bottom:0}.srow small{color:var(--mut)}
.sr-t{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:3px 0}.sr-t span{font-size:13.5px}
.card .row{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;margin:0}.card .row:last-child{border-bottom:0}.row>div{flex:1;min-width:0}.row.cur{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}
.sechead{display:flex;gap:12px;align-items:center;margin-bottom:6px}.sechead small{display:block;color:var(--mut)}
.qrow{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid #cfd4dc;border-radius:10px;padding:10px 12px;margin-bottom:8px}

.qr-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cam{font-size:12px;color:var(--mut);margin-left:auto}.tag{font-size:11px;color:var(--mut);background:#eef0f3;border-radius:6px;padding:2px 8px}
.clo{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;margin-left:auto;background:#fbe3e1;color:#a3201d}.c-progress{background:#fdf0d5!important;color:#8a5a00!important}.c-done{background:#ddebfa!important;color:#1d4fa3!important}.c-verified{background:#e3f4e8!important;color:#17723a!important}

.stbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}

.stbtns button b{font-size:17px}.stbtns button span{font-size:9.5px;line-height:1.15;color:var(--mut)}
.stbtns button.on{background:var(--c);border-color:var(--c);color:#fff}.stbtns button.on span{color:#fff}.stbtns button:disabled{opacity:.55}.stbtns button.on:disabled{opacity:1}
.slabel{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;font-weight:700;font-size:13.5px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{min-height:46px;border:1.5px solid #c3cad6;background:#fff;border-radius:10px;font-weight:800;font-size:17px;position:relative}
.scale button.def::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#f5b301}
.scale button.on{background:var(--navy);border-color:var(--navy);color:#fff}.scale button:disabled{opacity:.55}.scale button.on:disabled{opacity:1}
.sdesc{font-size:12.5px;color:var(--mut);margin:6px 0 0;min-height:36px}

.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:12.5px;font-weight:600;color:#3b4350;margin-bottom:4px}.fld small{display:block;color:var(--mut);margin-top:3px}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;border:1.5px solid #c3cad6;border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;min-height:44px}
textarea{resize:vertical;line-height:1.4}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
input:disabled,select:disabled,textarea:disabled{background:#f1f3f6;color:#4b5563;opacity:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.checks{display:flex;flex-direction:column;gap:4px}.checks label,.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}input[type=checkbox]{width:20px;height:20px;flex:none}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.photos figcaption{padding:5px;font-size:12px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}.photos figcaption input{min-height:34px!important;padding:5px 7px!important;font-size:13px!important;flex:1 1 60px;min-width:0}
.pref{font-size:10.5px;font-weight:700;color:var(--blue)}
.slot{aspect-ratio:4/3;border:2px dashed #b8c0cc;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7a828e;cursor:pointer;background:#fafbfc}.slot span{font-size:24px;line-height:1}

.clobtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}.clobtns button{min-height:48px;border:1.5px solid #c3cad6;background:#fff;border-radius:10px;font-size:12.5px;font-weight:600;padding:6px}.clobtns button.on{border-color:currentColor;border-width:2px}
.trail{border-left:3px solid var(--line);padding:2px 0 10px 12px;margin-left:4px}.trail small{color:var(--mut);display:block}.trail p{font-size:13px;margin:2px 0 0;color:#3b4350}

<script id="tpl-data" type="application/json">{"lib":{"name":"Requirement library - NBC 2016 + IS + CEA 2023","version":"Ver3","source":"Fire_Life_Safety_Audit_Checklist_NBC2016_Ver3.xlsx","sections":[{"id":"A","name":"Statutory approvals, documentation and fire safety management"},{"id":"B","name":"Site access, construction and structural fire resistance"},{"id":"C","name":"Compartmentation, openings and passive fire protection"},{"id":"D","name":"Means of egress"},{"id":"E","name":"Escape lighting and exit signage"},{"id":"F","name":"Smoke control, pressurization and air handling"},{"id":"G","name":"Electrical installations (fire safety aspects)"},{"id":"H","name":"Fire detection and alarm"},{"id":"I","name":"Firefighting installations and water supply"},{"id":"J","name":"Fire command centre"},{"id":"K","name":"Additional requirements for high rise buildings"},{"id":"L","name":"Gas supply, kitchens, boilers and hazardous areas"},{"id":"M","name":"Car parking"},{"id":"N","name":"Atrium"},{"id":"O","name":"Housekeeping and general fire prevention"},{"id":"P","name":"Electrical safety – CEA (Measures relating to Safety and Electric Supply) Regulations, 2023"}],"items":[{"id":"A-01","sec":"A","req":"Actual use of every floor matches the occupancy group and subdivision for which the building was approved.","ref":"[NBC 2016, Part 4, Cl. 3.1.1, 3.1.14]","type":"Mandatory (shall)","app":"All","guide":"Compare the occupancy certificate and approved plans with actual use, floor by floor. Record the group/subdivision (A-1 to J) per Cl. 3.1.2 to 3.1.10. A certificate of occupancy is necessary before any change in the character of occupancy.","method":"D, V","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"A-02","sec":"A","req":"Where occupancy has changed to a different group or subdivision, the building complies with the requirements for the new group.","ref":"[NBC 2016, Part 4, Cl. 3.1.12, 3.1.13]","type":"Mandatory (shall)","app":"Where occupancy has changed","guide":"Identify changes of use since approval (e.g. storage converted to office, parking converted to shops). Compliance with the new group is not required only where the new occupancy is less hazardous (Cl. 3.1.13).","method":"D, V","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"A-03","sec":"A","req":"In mixed occupancy, the whole building follows the most restrictive fire protection provisions, and the occupancies are separated by 240 min fire resistance rated construction.","ref":"[NBC 2016, Part 4, Cl. 3.1.11]","type":"Mandatory (shall)","app":"Mixed occupancy","guide":"Life safety provisions apply occupancy-wise; fire protection applies on the most restrictive basis. Check separating walls/floors on drawings and at site, and that egress capacity is not decreased in the direction of travel.","method":"D, V","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"A-04","sec":"A","req":"Additions, alterations, cubicles or partitioning have not lowered the level of fire and life safety; in high rise buildings, such work exceeding 500 m2 floor area has local fire authority approval.","ref":"[NBC 2016, Part 4, Cl. 3.2.7]","type":"Mandatory (shall)","app":"All (approval limb: high rise)","guide":"Compare as-built layout with the last approved plan. Look for added partitions that lengthen travel distance, block exits, obstruct sprinklers/detectors or breach compartment walls. Ask for the fire authority approval letter.","method":"D, V","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"A-05","sec":"A","req":"Valid fire safety approval / No Objection Certificate from the local fire authority is available and its conditions are complied with.","ref":"[State / local fire service legislation (not in project files)]","type":"Good practice (not an NBC clause)","app":"As required by local law","guide":"Not an NBC clause. Requirement, validity period and renewal procedure depend on the State fire service Act and rules, which are not in the project files. Record certificate number, date, validity and open conditions.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"A-06","sec":"A","req":"Fire and life safety audit is carried out once in two years for buildings more than 15 m in height.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-7(a), (c)]","type":"Mandatory (shall)","app":"Height more than 15 m","guide":"Obtain the previous audit report and its date. Check that earlier findings are closed with evidence. E-7(b): the audit should preferably be by a third party auditor with requisite experience (recommendation, not mandatory).","method":"D","sev":2,"rule":["h15"],"area":"DOC","weight":2},{"id":"A-07","sec":"A","req":"A qualified Fire Officer with not less than 3 years' experience is appointed and available on the premises.","ref":"[NBC 2016, Part 4, Cl. 4.10.1]","type":"Mandatory (shall)","app":"Large educational complexes; business 30 m and above; residential 60 m and above; institutional 15 m and above; starred hotels; D-6","guide":"Verify appointment letter, qualification and experience records, and the duty roster. 'Large educational complexes' is not defined in the Code; see the Ambiguities sheet. The authority may also require this for very large buildings below 30 m (Note to Cl. 4.10.2).","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"A-08","sec":"A","req":"The Fire Officer maintains firefighting equipment, prepares and promulgates fire orders and operational plans, trains occupants, and liaises with the city fire brigade.","ref":"[NBC 2016, Part 4, Cl. 4.10.2]","type":"Mandatory (shall)","app":"Where a Fire Officer is required","guide":"Ask for the fire orders, operational plan, training attendance records and evidence of liaison (visit records, joint drills, contact list).","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"A-09","sec":"A","req":"Fire notices/orders covering firefighting and evacuation are prepared and displayed at vantage points, and occupants are trained in their emergency actions.","ref":"[NBC 2016, Part 4, Cl. 4.11]","type":"Mandatory (shall)","app":"All","guide":"Walk each floor and check that notices are present, legible and current. Notices should be displayed prominently in bold lettering (recommendation). Interview a sample of occupants on what to do on hearing the alarm.","method":"D, V","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"A-10","sec":"A","req":"A written Fire Safety Plan in the Annex D format is prepared, approved by the fire authority and distributed to tenants and employees.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-5.1 to D-5.3, D-8, D-9.6]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Check the plan against the D-8 headings: purpose, Fire Safety Director, deputies, wardens, evacuation supervisor, fire party, occupant instructions, drills, command station, signs, prevention programme, building information form, floor plans.","method":"D","sev":3,"rule":["h15"],"area":"DOC","weight":3},{"id":"A-11","sec":"A","req":"The Fire Safety Plan is amended and resubmitted within 30 days of any change in conditions that requires amendment.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-5.4]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Compare the plan revision date with the dates of tenancy changes, layout changes and system modifications.","method":"D","sev":2,"rule":["h15"],"area":"DOC","weight":2},{"id":"A-12","sec":"A","req":"Fire drills are conducted at least once every three months during the first two years of the building, and at least once every six months thereafter.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-3.1; NBC 2016, Part 12, Cl. 15.5, 15.13]","type":"Mandatory (shall)","app":"High rise (15 m and above) (other buildings: Part 12 requires regular drills, interval not stated)","guide":"Check the dates of the last four drills. Part 12 Cl. 15.5 and 15.13 require regular drills for all facilities but give no interval; use the Annex D frequency as the benchmark for buildings below 15 m (auditor benchmark).","method":"D","sev":4,"rule":["h15"],"area":"DOC","weight":4},{"id":"A-13","sec":"A","req":"All occupants participate in fire drills.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-3.2]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Review drill reports for participation by floor/tenant, evacuation time and lessons learnt. Occupants other than building service employees are not required to leave the floor or use the exits during a drill.","method":"D","sev":3,"rule":["h15"],"area":"DOC","weight":3},{"id":"A-14","sec":"A","req":"Written records of drills are kept on the premises for three years and are readily available for fire brigade inspection.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-3.3]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Ask to see three years of drill records.","method":"D","sev":2,"rule":["h15"],"area":"DOC","weight":2},{"id":"A-15","sec":"A","req":"Fire Safety Director, Deputy Fire Safety Director, a Fire Warden for each floor and Deputy Fire Wardens for each tenancy (one per 700 m2 or part thereof) are designated.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-8.3 to D-8.5, D-9.1.5, D-9.3.1]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Check names against current staff. Confirm wardens know the plan, exit locations and alarm operation (D-9.3.2) by interviewing a sample.","method":"D","sev":3,"rule":["h15"],"area":"DOC","weight":3},{"id":"A-16","sec":"A","req":"An organization chart for fire drill and evacuation assignment is posted in a conspicuous place in each tenancy and on each floor, with a copy held by the Fire Safety Director.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-9.3.4]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Check charts at site for currency (names, contact numbers).","method":"V","sev":2,"rule":["h15"],"area":"DOC","weight":2},{"id":"A-17","sec":"A","req":"A Building Evacuation Supervisor is on duty at all times outside normal working hours when the building is occupied and no Fire Safety Director is on duty.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-9.4]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Review night and holiday rosters. Confirm the supervisor can operate the fire command centre.","method":"D","sev":3,"rule":["h15"],"area":"DOC","weight":3},{"id":"A-18","sec":"A","req":"A Fire Party of qualified building service employees is organized, trained and supervised.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-9.1.2, D-9.1.3, D-9.5]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Check the fire party list per shift, training records and practical ability (ask a member to demonstrate hose reel or extinguisher use).","method":"D, T","sev":3,"rule":["h15"],"area":"DOC","weight":3},{"id":"A-19","sec":"A","req":"An updated list of persons with physical disabilities who cannot use stairs unaided is kept, with arrangements for assisted evacuation.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-9.3.5]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Ask each floor warden for the list and the named assistants. Check that evacuation aids, refuge areas or fireman's lift procedures are defined.","method":"D","sev":4,"rule":["h15"],"area":"DOC","weight":4},{"id":"A-20","sec":"A","req":"Every occupant is given a Personal Fire Instruction Card with floor plan, exit routes and instructions.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-9.11]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Sample occupants on different floors. The card should name the assembly point and fire warden.","method":"D, V","sev":2,"rule":["h15"],"area":"DOC","weight":2},{"id":"A-21","sec":"A","req":"A plan exists for periodic formal inspection of each floor area, including exit facilities, fire extinguishers and housekeeping.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-9.7(a)]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"'Periodic' is not quantified. Auditor benchmark: monthly floor inspections with signed checklists. Review the last three months of inspection records.","method":"D","sev":3,"rule":["h15"],"area":"DOC","weight":3},{"id":"A-22","sec":"A","req":"Communication and alarm systems are tested monthly.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-9.7(b)]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Review monthly test records for the fire alarm, public address and talk-back systems.","method":"D","sev":3,"rule":["h15"],"area":"DOC","weight":3},{"id":"A-23","sec":"A","req":"Signs reading 'IN CASE OF FIRE, USE STAIRS UNLESS INSTRUCTED OTHERWISE' are posted at or near every lift landing.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-4.1; NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(g)]","type":"Mandatory (shall)","app":"High rise (15 m and above)","guide":"Lettering at least 12.5 mm block letters in red and white; sign at least 250 mm x 300 mm with stair location diagram; top of sign not above 2 m. Part 8 requires photoluminescent signs with floor plan showing stairways and direction to refuge area.","method":"V, M","sev":2,"rule":["h15"],"area":"DOC","weight":2},{"id":"A-24","sec":"A","req":"Adequate trained people are deployed to man the fire systems, with budgetary support for maintenance.","ref":"[NBC 2016, Part 12, Cl. 15.1]","type":"Mandatory (shall)","app":"All","guide":"'Adequate' is not quantified. Check staffing per shift against the systems installed, training certificates, and the maintenance budget or contracts for fire systems.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"A-25","sec":"A","req":"Planned and unplanned shutdowns of fire installations are risk assessed, notified in writing to the authorities and occupants, and restored with the least possible delay.","ref":"[NBC 2016, Part 12, Cl. 15.12]","type":"Mandatory (shall)","app":"All","guide":"Ask for the impairment procedure and records of the last shutdowns. Check for any system currently isolated (valves shut, zones disabled, pumps in manual) and whether compensating measures are in place.","method":"D, V","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"A-26","sec":"A","req":"Records of inspection, testing and maintenance of fire systems, including hydraulic pressure tests of extinguishers, are maintained.","ref":"[NBC 2016, Part 12, Cl. 15.6, 15.11]","type":"Mandatory (shall)","app":"All","guide":"Review the history sheets and service contractor reports. Cl. 15.7 additionally recommends (should) a log book of all alarms, faults, tests and periods of disconnection.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"A-27","sec":"A","req":"Hot work (welding, cutting, torch operations) and repair work are controlled by a permit system with fire precautions.","ref":"[Good practice; see NBC 2016, Part 4, Annex D, Cl. D-9.8(u)]","type":"Good practice (not an NBC clause)","app":"All","guide":"NBC only requires the building information form to list protective measures for alterations, repairs and torch operations. Check for a hot work permit procedure, fire watch, and removal of combustibles. Sample recent permits.","method":"D, V","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"A-28","sec":"A","req":"Industrial premises protected by an external hydrant system keep a trained fire squad on the premises round the clock (not less than eight trained persons at any time, or six with an automatic pressurised hydrant system), with a posted muster roll, weekly practice drills and wet drills at intervals of not more than a fortnight, recorded in a register.","ref":"[IS 13039 : 2014, Cl. 11.1 to 11.7]","type":"Mandatory (shall)","app":"Medium and large industrial risks within the scope of IS 13039","guide":"Squad leaders to be trained by a government-recognised institution (11.2); squad issued helmets, belts and boots (11.3). During wet drills, hydrants (including those on upper floors), hoses and nozzles are used in rotation so that defects are found and corrected (11.6). The drill register, signed by the fire marshal and works manager, records attendees, dry or wet drill, hydrant numbers used, pump running time and defects (11.7). Keys of all doors available at the main gate (11.9).","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"B-01","sec":"B","req":"The main street on which the building abuts is not less than 12 m wide, with one end joining another street not less than 12 m wide.","ref":"[NBC 2016, Part 3, Cl. 4.6(a)]","type":"Mandatory (shall)","app":"High rise and special buildings","guide":"Measure the clear carriageway width. Under Cl. 4.6(b) the road shall not terminate in a dead end, except for residential buildings up to 30 m height.","method":"D, M","sev":3,"rule":[],"area":"FAB","weight":3},{"id":"B-02","sec":"B","req":"The approach to the building and the open spaces on all sides are not less than 6 m wide with a minimum 9 m turning radius, hard surfaced for fire tenders up to 45 t, motorable, free of obstructions and not used for parking.","ref":"[NBC 2016, Part 3, Cl. 4.6(c)]","type":"Mandatory (shall)","app":"High rise and special buildings","guide":"Walk the full fire tender route. Measure the narrowest point. Look for parked vehicles, landscaping, kiosks, DG sets, barriers and low cables. Check structural design of podium/basement roof slabs on the route for 45 t.","method":"V, M, D","sev":5,"rule":[],"area":"EXT","weight":5},{"id":"B-03","sec":"B","req":"The main entrance to the plot is not less than 6 m wide, the gate folds back against the compound wall, and any built-over entrance has a clearance of at least 4.5 m.","ref":"[NBC 2016, Part 3, Cl. 4.6(d)]","type":"Mandatory (shall)","app":"High rise and special buildings","guide":"Measure clear gate width and height of arches, canopies or boom barriers.","method":"M","sev":4,"rule":[],"area":"EXT","weight":4},{"id":"B-04","sec":"B","req":"Structural and non-structural elements have the fire resistance ratings required by Table 1 for the type of construction, validated and certified.","ref":"[NBC 2016, Part 4, Cl. 3.3.1, 3.3.2, Table 1]","type":"Mandatory (shall)","app":"All","guide":"Obtain the structural fire design basis or certificates. In their absence, Annex C gives guidance on ratings of common constructions. Note where finishes or later alterations have removed fire protection (e.g. exposed steel, cut-outs).","method":"D, V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"B-05","sec":"B","req":"Load bearing steel beams and columns are protected against failure in fire where total covered area is 500 m2 and above.","ref":"[NBC 2016, Part 4, Cl. 3.3.3]","type":"Mandatory (shall)","app":"Steel framed buildings, covered area 500 m2 and above","guide":"Check for fire resistant coating, encasement or board protection and its certification; inspect for damage or missing sections (Annex C, Tables 25 and 26 are referenced by the clause).","method":"D, V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"B-06","sec":"B","req":"False ceilings, including all suspension fixtures, are of non-combustible material.","ref":"[NBC 2016, Part 4, Cl. 3.3.4]","type":"Mandatory (shall)","app":"All","guide":"Identify ceiling material from specifications or test certificates. Look for timber framing, thermocol, plastic or fabric ceilings.","method":"D, V","sev":3,"rule":[],"area":"FAB","weight":3},{"id":"B-07","sec":"B","req":"Construction is of non-combustible materials, and internal walls of staircase enclosures are of brick, reinforced concrete or other construction of minimum 120 min rating.","ref":"[NBC 2016, Part 4, Cl. 3.3.1]","type":"Recommended (should)","app":"All","guide":"Recommendation in Cl. 3.3.1; the 120 min rating for exit enclosures is mandatory through Table 1, Sl. No. (iii).","method":"D, V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"B-08","sec":"B","req":"Any part of the building occupied during construction, repairs, alterations or additions has all means of exit and fire protection measures in place and continuously maintained.","ref":"[NBC 2016, Part 4, Cl. 3.4.3.1]","type":"Mandatory (shall)","app":"Partially occupied buildings / buildings under alteration","guide":"Check that exits serving occupied parts are not blocked by works, hoardings or stored materials, and that fire systems in the occupied part are live.","method":"V","sev":5,"rule":[],"area":"FAB","weight":5},{"id":"B-09","sec":"B","req":"A high rise building under construction has a dry riser of minimum 100 mm with hydrant outlets and fire service inlet, 2 000 litre water drums with two fire buckets on each floor, and a water tank of minimum 20 000 litre.","ref":"[NBC 2016, Part 4, Cl. 3.4.3.2]","type":"Mandatory (shall)","app":"High rise under construction","guide":"Verify physically on the constructed floors.","method":"V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"B-10","sec":"B","req":"Temporary structures and pandals have fire precautions in accordance with good practice and a permit from the Authority.","ref":"[NBC 2016, Part 4, Cl. 3.2.5.1, 3.2.5.3 [IS 8758]]","type":"Mandatory (shall)","app":"Where temporary structures exist","guide":"IS 8758 is not in the project files. Check the permit and its validity; temporary structures are permitted only in Fire Zones 1 and 2 and shall be removed on expiry of the permit (Cl. 3.2.5.2).","method":"D, V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-01","sec":"C","req":"Each floor is compartmented so that no compartment exceeds 750 m2, or the larger limits permitted for sprinklered buildings.","ref":"[NBC 2016, Part 4, Cl. 4.5.2]","type":"Mandatory (shall)","app":"All (limits for low/moderate hazard industrial and storage are set by the local fire department)","guide":"Sprinklered limits: basement car parking 3 000 m2; other basements 2 000 m2; C-1 1 800 m2; C-2 and C-3 1 125 m2; mercantile and assembly 2 000 m2; business 3 000 m2; all others 750 m2. A minimum of two compartments is required unless the floor plate is less than 750 m2.","method":"D, M","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-02","sec":"C","req":"Compartmentation is by fire barriers with a fire resistance rating of 120 min, and penetrations are protected so that integrity is not compromised.","ref":"[NBC 2016, Part 4, Cl. 4.5.1(a), 4.5.2]","type":"Mandatory (shall)","app":"All","guide":"Trace compartment walls above false ceilings and below raised floors. Look for unsealed cable trays, pipes and ducts, and missing wall sections above ceiling level.","method":"V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-03","sec":"C","req":"Doorways or openings in fire resistant walls are limited to 5.6 m2 with maximum height/width of 2.75 m and are protected by fire doors rated not less than 120 min.","ref":"[NBC 2016, Part 4, Cl. 3.4.5.2, 3.4.5.3]","type":"Mandatory (shall)","app":"All","guide":"Applies to Types 1 to 3 construction; Type 4 requires 120 min rated assemblies in openings. Measure sample openings and check door labels.","method":"M, V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-04","sec":"C","req":"Openings in floors are protected by vertical enclosures of not less than 120 min fire resistance.","ref":"[NBC 2016, Part 4, Cl. 3.4.5.2, 3.4.5.6]","type":"Mandatory (shall)","app":"All","guide":"Check stair wells, lift shafts, service risers, floor cut-outs and material hoist openings. Removable covers for machinery openings shall match the floor's strength and fire resistance (Note to Cl. 3.4.5.4).","method":"V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-05","sec":"C","req":"Escalator openings have a smoke barrier of 450 to 600 mm and sprinklers on all sides of the opening on each floor.","ref":"[NBC 2016, Part 4, Cl. 3.4.5.2, Fig. 3]","type":"Mandatory (shall)","app":"Where escalators are provided","guide":"Measure the depth of the smoke barrier (draft curtain) around the opening and confirm the sprinkler ring.","method":"V, M","sev":3,"rule":["esc"],"area":"LFT","weight":3},{"id":"C-06","sec":"C","req":"Service ducts and shafts are enclosed with fire resistance of not less than 120 min; inspection doors of electrical shafts are rated not less than 120 min.","ref":"[NBC 2016, Part 4, Cl. 3.4.5.4]","type":"Mandatory (shall)","app":"All","guide":"Open a sample of shaft doors on several floors. Check door labels, that doors close and latch, and that shafts are not used for storage.","method":"V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-07","sec":"C","req":"The space between electrical cables/conduits and the walls/slabs is filled with fire stop material rated not less than 120 min.","ref":"[NBC 2016, Part 4, Cl. 3.4.5.4, 3.4.6.1]","type":"Mandatory (shall)","app":"All","guide":"Inspect floor crossings inside electrical shafts on a sample of floors (auditor benchmark: at least 10 percent of floors, and every floor with recent cabling work). The clause exempts low voltage services shafts from fire stop sealing.","method":"V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-08","sec":"C","req":"Plumbing shafts in the building core that open inside the building have inspection doors rated not less than 30 min.","ref":"[NBC 2016, Part 4, Cl. 3.4.5.4]","type":"Mandatory (shall)","app":"Where such shafts exist","guide":"Doors opening in wet areas, naturally ventilated areas or on the external wall need no specified rating.","method":"V","sev":2,"rule":[],"area":"FAB","weight":2},{"id":"C-09","sec":"C","req":"Refuse chutes vent at least 1 m above roof level, have a non-combustible enclosure of not less than 120 min, tight fitting 60 min doors, sprinkler protection, are at least 6 m from exits and are not within stair enclosures or service shafts.","ref":"[NBC 2016, Part 4, Cl. 3.4.5.5]","type":"Mandatory (shall)","app":"Where refuse chutes are provided","guide":"Inspect chute hoppers on sample floors for self-closing and condition.","method":"V, M","sev":3,"rule":[],"area":"FAB","weight":3},{"id":"C-10","sec":"C","req":"Fire rated doors and assemblies carry a certificate and label showing manufacturer, door type, serial/batch number, month and year of manufacture and fire resistance rating, and are certified with all hardware.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.1(f)]","type":"Mandatory (shall)","app":"All","guide":"Check labels on the door edge or frame. Look for non-rated replacement hardware, removed closers, cut vision panels, and excessive gaps (auditor benchmark: gaps as per the door's test certificate).","method":"D, V","sev":3,"rule":[],"area":"FAB","weight":3},{"id":"C-11","sec":"C","req":"Fire doors to staircases, lift lobbies and pressurized spaces close automatically and completely and are kept closed.","ref":"[NBC 2016, Part 12, Cl. 15.3; NBC 2016, Part 4, Annex D, Cl. D-9.11]","type":"Mandatory (shall)","app":"All","guide":"Open each sampled door fully and release: it should close and latch unaided. Look for wedges, hooks, tied-back closers and damaged seals. Doors held open are acceptable only on magnetic hold-open devices released by the fire alarm.","method":"T","sev":4,"rule":[],"area":"LFT","weight":4},{"id":"C-12","sec":"C","req":"Glass is not used for enclosures of exits and exit passageways, and glazing assemblies are rated as required by Table 1.","ref":"[NBC 2016, Part 4, Cl. 3.4.10.1]","type":"Mandatory (shall)","app":"All","guide":"Check stair and exit passageway enclosures for glazed walls or panels.","method":"V, D","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-13","sec":"C","req":"In fully sprinklered buildings with fire separation of 9 m or more, the glass facade is tempered glass in a non-combustible assembly, with sprinklers within 600 mm of the facade.","ref":"[NBC 2016, Part 4, Cl. 3.4.10.2(a)]","type":"Mandatory (shall)","app":"Glass facade buildings","guide":"For all other buildings the facade rating follows Table 1 (Note to the clause). Check glass type from facade documents and measure sprinkler distance from the glass.","method":"D, M","sev":3,"rule":["glass"],"area":"FAB","weight":3},{"id":"C-14","sec":"C","req":"All gaps between floor slabs and the facade assembly are sealed at every level with fire resistant sealant of the same rating as the floor slab.","ref":"[NBC 2016, Part 4, Cl. 3.4.10.2(b)]","type":"Mandatory (shall)","app":"Glass facade / curtain wall buildings","guide":"Inspect the slab edge above the false ceiling or behind spandrel panels on sample floors.","method":"V","sev":4,"rule":["glass"],"area":"FAB","weight":4},{"id":"C-15","sec":"C","req":"Openable fire access panels are provided on each floor of a glass facade: not more than 10 m apart, operable between 1.2 m and 1.5 m above floor, not less than 1 000 mm x 1 000 mm, opening outwards and marked.","ref":"[NBC 2016, Part 4, Cl. 3.4.10.2(c)]","type":"Mandatory (shall)","app":"Glass facade buildings","guide":"Marking: 'FIRE OPENABLE PANEL - OPEN IN CASE OF FIRE, DO NOT OBSTRUCT' in letters at least 25 mm high on the internal side. Check that panels are in common areas and corridors, operable and not blocked by furniture.","method":"V, M, T","sev":3,"rule":["glass"],"area":"FAB","weight":3},{"id":"C-16","sec":"C","req":"Interior surface finishes on walls, ceilings and facade conform to the permitted flame spread class for their location.","ref":"[NBC 2016, Part 4, Cl. 3.4.11.2, 3.4.11.3, 3.4.11.4]","type":"Mandatory (shall)","app":"All","guide":"Class 1 may be used anywhere; Class 2 not on walls, facade, staircases and corridors; Class 3 only in living rooms and bedrooms as lining to solid walls; Class 4 shall not be used in kitchens, corridors and staircases. Ask for test certificates (IS 12777 is not in the project files).","method":"D, V","sev":4,"rule":[],"area":"FAB","weight":4},{"id":"C-17","sec":"C","req":"Finishing materials and decor do not generate toxic smoke or fumes.","ref":"[NBC 2016, Part 4, Cl. 3.4.11.1]","type":"Mandatory (shall)","app":"All","guide":"No test method or limit is given in the clause; see the Ambiguities sheet. Record foam plastics, PVC panelling, synthetic drapes and similar materials on escape routes.","method":"D, V","sev":3,"rule":[],"area":"FAB","weight":3},{"id":"C-18","sec":"C","req":"Battery installations are segregated by 120 min fire rated construction and ventilated as per the manufacturer's instructions.","ref":"[NBC 2016, Part 4, Cl. 3.4.8.1]","type":"Mandatory (shall)","app":"Where battery banks / UPS rooms are provided","guide":"Check enclosure, door rating, ventilation and absence of combustible storage.","method":"V","sev":3,"rule":["ups"],"area":"FAB","weight":3},{"id":"D-01","sec":"D","req":"Every exit, exit passageway and exit discharge is continuously maintained free of all obstructions or impediments to full use.","ref":"[NBC 2016, Part 4, Cl. 4.2.3; NBC 2016, Part 12, Cl. 15.2, 15.15]","type":"Mandatory (shall)","app":"All","guide":"Walk every staircase from top to discharge and every exit corridor. Record stored goods, furniture, locked or chained doors, grills, security barriers and construction material, with photographs and locations.","method":"V","sev":5,"rule":[],"area":"EGR","weight":5},{"id":"D-02","sec":"D","req":"The number of exits is sufficient for the occupant load, the width per person and the maximum travel distance.","ref":"[NBC 2016, Part 4, Cl. 4.2.4, 4.4.2.1, Tables 3, 4 and 5]","type":"Mandatory (shall)","app":"All","guide":"Compute for each floor: occupant load (floor area / Table 3 factor, or declared number if higher), required exit width (Table 4), then check travel distance (Table 5). Record the calculation in the report.","method":"D, M","sev":5,"rule":[],"area":"EGR","weight":5},{"id":"D-03","sec":"D","req":"Occupant load on each floor does not exceed the load for which the exits are designed.","ref":"[NBC 2016, Part 4, Cl. 4.3, Table 3]","type":"Mandatory (shall)","app":"All","guide":"Table 3 factors (m2/person, gross): residential 12.5; educational 4; institutional 15 (indoor patients) / 10 (outdoor patients); assembly 0.65 (concentrated, no fixed seats), 1.4 (less concentrated), 1.8 (dining); mercantile 3 (street floor and sales basement), 6 (upper sales floors); business 10; industrial 10; storage 30; hazardous 10. Fixed seating: seats x 1.2. Mezzanine load is added to the floor below.","method":"D, M","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-04","sec":"D","req":"Assembly occupancies and call centres display the limiting occupant load in a conspicuous place near the entrance.","ref":"[NBC 2016, Part 4, Cl. 4.3]","type":"Mandatory (shall)","app":"Assembly occupancies and call centres","guide":"The display should preferably be a metal plate not less than 300 mm x 200 mm with letters not less than 50 mm, giving occupancy, area and occupant load, signed by the manager.","method":"V","sev":2,"rule":[],"area":"EGR","weight":2},{"id":"D-05","sec":"D","req":"The total capacity of the means of egress serving each floor allows egress of the entire population of the floor.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.3, Table 4]","type":"Mandatory (shall)","app":"All","guide":"Width per person (stairways / level components and ramps): Groups A and B 10 / 6.5 mm; Group C 15 / 13 mm; Groups D to H 10 / 6.5 mm; Group J 18 / 10 mm. Unit of exit width is 500 mm; clear widths under 250 mm are not counted. Capacity is governed by the narrowest component.","method":"D, M","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-06","sec":"D","req":"Travel distance from the most remote point to an exit does not exceed Table 5.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.2(a), (b), Table 5]","type":"Mandatory (shall)","app":"All","guide":"Types 1 and 2 construction: 30 m for Groups A to F and H; 45 m for G-1 and G-2; 22.5 m for G-3 and J. Types 3 and 4: 22.5 m for A, B, C; 30 m for D, E, F. Values may be increased by 50 percent in fully sprinklered buildings (Note 1). Measure along the natural unobstructed path, around furniture and partitions.","method":"M","sev":5,"rule":[],"area":"EGR","weight":5},{"id":"D-07","sec":"D","req":"Dead end corridor length in exit access does not exceed 6 m for educational, institutional and assembly occupancies and 15 m for other occupancies.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.2(c)]","type":"Mandatory (shall)","app":"All","guide":"Measure from the end of the corridor to the point where two directions of travel become available.","method":"M","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-08","sec":"D","req":"Exits are placed as remote from each other as possible and give direct access in separate directions from any point.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.2(d)]","type":"Mandatory (shall)","app":"All","guide":"'As remote as possible' is not quantified; see the Ambiguities sheet for a suggested benchmark.","method":"D, V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-09","sec":"D","req":"The building has a minimum of two staircases.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.1]","type":"Mandatory (shall)","app":"All buildings covered by Cl. 1.2","guide":"The actual number is to satisfy Cl. 4.4.2.1. Check that both staircases are usable and independently accessible from every floor.","method":"V","sev":5,"rule":[],"area":"EGR","weight":5},{"id":"D-10","sec":"D","req":"No alteration has reduced the number, width or protection of exits below that required.","ref":"[NBC 2016, Part 4, Cl. 4.2.6]","type":"Mandatory (shall)","app":"All","guide":"Compare against approved plans. Typical findings: exit doors sealed for security, stair width reduced by ducts or cupboards, exit lobbies converted to stores.","method":"D, V","sev":5,"rule":[],"area":"EGR","weight":5},{"id":"D-11","sec":"D","req":"Exits can be reached without passing through another occupied unit or passage in others' control.","ref":"[NBC 2016, Part 4, Cl. 4.2.8]","type":"Mandatory (shall)","app":"All","guide":"Check multi-tenant floors and subdivided units for exits accessible only through a neighbour's premises.","method":"V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-12","sec":"D","req":"Lifts, escalators, moving walks, turnstiles and revolving doors are not counted as exits or in egress capacity.","ref":"[NBC 2016, Part 4, Cl. 4.2.2, 4.2.14]","type":"Mandatory (shall)","app":"All","guide":"Verify in the egress calculation and evacuation plan.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"D-13","sec":"D","req":"The capacity of the means of egress is not reduced along the path of egress travel until the exit discharge.","ref":"[NBC 2016, Part 4, Cl. 4.2.13]","type":"Mandatory (shall)","app":"All","guide":"Check for narrowing of stairs, doors or passageways downstream, especially at ground level discharge.","method":"M, V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-14","sec":"D","req":"Exits and exit passageways have a clear ceiling height of at least 2.4 m and exit doors a height of at least 2.0 m.","ref":"[NBC 2016, Part 4, Cl. 4.2.11]","type":"Mandatory (shall)","app":"All","guide":"Measure at the lowest point, including under ducts, beams and signage.","method":"M","sev":2,"rule":[],"area":"EGR","weight":2},{"id":"D-15","sec":"D","req":"Changes in elevation of more than 300 mm in exits use ramps or sloped surfaces with handrails and contrasting floor finish.","ref":"[NBC 2016, Part 4, Cl. 4.2.12]","type":"Mandatory (shall)","app":"All","guide":"Check thresholds and level changes along exit routes.","method":"V, M","sev":2,"rule":[],"area":"EGR","weight":2},{"id":"D-16","sec":"D","req":"Walking surfaces in exit access are nominally level and slip resistant, with slope not exceeding 1 in 20 in the direction of travel and 1 in 48 across it.","ref":"[NBC 2016, Part 4, Cl. 4.2.18]","type":"Mandatory (shall)","app":"All","guide":"Steeper slopes are acceptable only where ramp requirements are met.","method":"V, M","sev":2,"rule":[],"area":"EGR","weight":2},{"id":"D-17","sec":"D","req":"Turnstiles and similar devices do not obstruct required means of egress; alternative door openings of required exit width are available within 3 m and the devices disengage in an emergency.","ref":"[NBC 2016, Part 4, Cl. 4.2.15, 4.4.2.4.1(h)]","type":"Mandatory (shall)","app":"Where turnstiles / flap barriers are installed","guide":"Test disengagement by fire alarm signal and manually.","method":"V, M, T","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-18","sec":"D","req":"Access controlled exit doors, turnstiles and boom barriers automatically open in emergencies; doors unlock on fire alarm or sprinkler activation and on loss of power, and have a manual 'PUSH TO EXIT' release.","ref":"[NBC 2016, Part 4, Cl. 4.2.16, 4.4.2.4.1(g)]","type":"Mandatory (shall)","app":"Where access control is installed","guide":"Test a sample: simulate alarm, then isolate power to the lock. Doors shall stay unlocked until the system is manually reset. The manual release shall interrupt power to the lock directly, independent of the access control electronics.","method":"T","sev":5,"rule":[],"area":"EGR","weight":5},{"id":"D-19","sec":"D","req":"There are no penetrations into or openings through an exit other than for fire protection piping, pressurization ducts and similar life safety services, and those are protected by passive systems.","ref":"[NBC 2016, Part 4, Cl. 4.2.17]","type":"Mandatory (shall)","app":"All","guide":"Look for cables, drain pipes, AC pipes and other services routed through stair enclosures and exit passageways.","method":"V","sev":3,"rule":[],"area":"EGR","weight":3},{"id":"D-20","sec":"D","req":"At least half of the required exit stairs from upper floors discharge directly to the exterior or through exit passageways.","ref":"[NBC 2016, Part 4, Cl. 4.2.10, 4.4.2.4.3.1]","type":"Mandatory (shall)","app":"All","guide":"The remaining stairs may discharge through a large lobby. Check that discharge points lead to open space or a street and are not blocked.","method":"D, V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-21","sec":"D","req":"Corridors and passageways used for exit access are not narrower than the calculated exit width.","ref":"[NBC 2016, Part 4, Cl. 4.4.1(b), 4.4.2.4.2(a)]","type":"Mandatory (shall)","app":"All","guide":"Measure clear width at the narrowest point, including at door swings and columns.","method":"M","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-22","sec":"D","req":"Tables, chairs and other temporary or permanent structures are kept out of exit access corridors.","ref":"[NBC 2016, Part 4, Cl. 4.4.1(c)]","type":"Mandatory (shall)","app":"All","guide":"The clause says such objects 'shall be avoided'. Record waiting chairs, vending machines, display racks, photocopiers and lockers in corridors.","method":"V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-23","sec":"D","req":"Exit access does not pass through storage rooms, closets or similar spaces.","ref":"[NBC 2016, Part 4, Cl. 4.4.1(f)]","type":"Mandatory (shall)","app":"All","guide":"Follow each exit route from the most remote room.","method":"V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-24","sec":"D","req":"Exit access to the fireman's lift and refuge area is step free and signposted with the international symbol of accessibility.","ref":"[NBC 2016, Part 4, Cl. 4.4.1(e)]","type":"Mandatory (shall)","app":"Where fireman's lift / refuge area is provided","guide":"Check for raised thresholds and steps on the route.","method":"V","sev":3,"rule":["lift"],"area":"LFT","weight":3},{"id":"D-25","sec":"D","req":"Exit doorways are not less than 1 000 mm wide (2 000 mm in assembly buildings) and not less than 2 000 mm high.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.1(b)]","type":"Mandatory (shall)","app":"All","guide":"Measure clear opening width with the door open at 90 degrees.","method":"M","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-26","sec":"D","req":"Doors in exits open in the direction of exit, are not overhead or sliding doors, and do not obstruct the stair landing.","ref":"[NBC 2016, Part 4, Cl. 4.2.9, Fig. 4]","type":"Mandatory (shall)","app":"All","guide":"In Group D and C-1 the exit door shall not open directly onto a flight of stairs. In other occupancies the open door shall not reduce the landing pathway by more than half the stair width.","method":"V, M","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-27","sec":"D","req":"Exit doorways are operable from the side they serve without the use of a key.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.1(c)]","type":"Mandatory (shall)","app":"All","guide":"Try every exit door on the sampled floors from the egress side, including final exit doors at ground and terrace doors. Record padlocks, key-operated locks and break-glass key boxes.","method":"T","sev":5,"rule":[],"area":"EGR","weight":5},{"id":"D-28","sec":"D","req":"Mirrors are not placed on exit doors or in exits.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.1(d)]","type":"Mandatory (shall)","app":"All","guide":"Visual check.","method":"V","sev":2,"rule":[],"area":"EGR","weight":2},{"id":"D-29","sec":"D","req":"Revolving doors forming part of a means of egress collapse to a book-fold position with egress paths not less than 1 000 mm, are not within 3 m of stairs or escalators, and have a hinged door of the same capacity in the same wall within 3 m.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.1(e)]","type":"Mandatory (shall)","app":"Where revolving doors are provided","guide":"Each revolving door is credited with only 50 persons.","method":"V, M, T","sev":3,"rule":[],"area":"LFT","weight":3},{"id":"D-30","sec":"D","req":"Doors in folding partitions are not treated as means of egress.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.1(j)]","type":"Mandatory (shall)","app":"Where folding partitions are used","guide":"Check banquet halls, conference rooms and training rooms.","method":"V","sev":3,"rule":[],"area":"EGR","weight":3},{"id":"D-31","sec":"D","req":"Staircase widths are not less than the minimum for the occupancy.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(e)]","type":"Mandatory (shall)","app":"All","guide":"Minimum width: A-2 1.00 m; A-1, A-3 and A-4 1.25 m; A-5 and A-6 1.50 m; assembly 2.00 m (1.50 m where less than 150 persons); educational 1.50 m; institutional 2.00 m; all other occupancies 1.50 m. Measure clear width between wall and handrail side as built.","method":"M","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-32","sec":"D","req":"Treads are at least 250 mm (residential) or 300 mm (other buildings), risers do not exceed 190 mm (A-2) or 150 mm (other buildings), there are not more than 12 risers per flight, and treads are non-slip.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.1]","type":"Mandatory (shall)","app":"All","guide":"Measure a sample of flights in each staircase. Tread is measured without nosing.","method":"M","sev":3,"rule":[],"area":"EGR","weight":3},{"id":"D-33","sec":"D","req":"Internal staircases are of non-combustible construction with a fire resistance rating of minimum 120 min, and access to them is through fire doors of minimum 120 min rating.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(a), (h)(2)]","type":"Mandatory (shall)","app":"All","guide":"Check enclosure continuity on every floor, door labels, and that doors are self-closing.","method":"V, D","sev":5,"rule":[],"area":"EGR","weight":5},{"id":"D-34","sec":"D","req":"No staircase is arranged around a lift shaft, and lifts do not open into the staircase.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(b), (h)(6)]","type":"Mandatory (shall)","app":"All","guide":"Visual check against plans.","method":"V","sev":4,"rule":[],"area":"LFT","weight":4},{"id":"D-35","sec":"D","req":"No flue, electromechanical equipment, air conditioning unit, gas piping, electrical panel, electrical shaft or air conditioning duct is in, passes through or opens into the stairway.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(d), (h)(5)]","type":"Mandatory (shall)","app":"All","guide":"Inspect each staircase full height, including under-stair spaces and landings.","method":"V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-36","sec":"D","req":"No living space, store or other fire risk opens directly into a staircase, and no combustible material is used for decoration or wall panelling in the staircase.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(h)(3), (h)(7)]","type":"Mandatory (shall)","app":"All","guide":"Record stores under stairs, meter cupboards, security cabins and notice boards with combustible backing.","method":"V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-37","sec":"D","req":"Staircases are not used as part of a supply, return or exhaust air system, and there are no openings in walls or doors separating exits from adjoining areas.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(c)]","type":"Mandatory (shall)","app":"All","guide":"Check for transfer grilles, louvres or undercut doors between the stair and the floor.","method":"V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-38","sec":"D","req":"Handrails are provided on one side of stairs less than 1 500 mm wide and on both sides of stairs 1 500 mm and wider.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(f), (g)]","type":"Mandatory (shall)","app":"All","guide":"The Code is inconsistent on permitted handrail projection: item (f) says not more than 115 mm, item (g) says not more than 90 mm. Use 90 mm as the conservative benchmark and note the inconsistency.","method":"V, M","sev":3,"rule":[],"area":"EGR","weight":3},{"id":"D-39","sec":"D","req":"Headroom under landings and stairs is at least 2.2 m, and beams, columns or other features do not reduce the headroom or width of the staircase.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(h)(1), (h)(8)]","type":"Mandatory (shall)","app":"All","guide":"Measure at the lowest projection.","method":"M","sev":2,"rule":[],"area":"EGR","weight":2},{"id":"D-40","sec":"D","req":"Exit staircases are continuous from the refuge floor or terrace to the level of exit discharge, terminate at that level, and the basement is served by a separate staircase.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(h)(4), (h)(11)]","type":"Mandatory (shall)","app":"All","guide":"Check that the upper-floor stair does not continue down to the basement without separation at the discharge level.","method":"V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-41","sec":"D","req":"A floor indication board (not less than 300 mm x 200 mm) showing staircase number, floor number and direction to exit discharge is fixed inside each staircase near the fire door, and floors are indicated on the wall outside the staircase.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(h)(9), (h)(10), Fig. 9, 3.4.7.4; Annex D, Cl. D-4.2]","type":"Mandatory (shall)","app":"All","guide":"Annex D (high rise) requires floor numerals at least 75 mm high in contrasting colour on the stair side of the door.","method":"V, M","sev":2,"rule":[],"area":"EGR","weight":2},{"id":"D-42","sec":"D","req":"Scissor type staircases and curved stairs are not counted as exits.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.2(h)(12), 4.4.2.4.3.3]","type":"Mandatory (shall)","app":"Where such stairs exist","guide":"Curved stairs may serve exit access only if tread depth is at least 280 mm at 350 mm from the narrow end and the smallest radius is at least twice the stair width.","method":"D, V","sev":3,"rule":[],"area":"EGR","weight":3},{"id":"D-43","sec":"D","req":"External staircases are kept in sound and usable condition, are directly connected to the ground, and have an entrance separate and remote from the internal staircase.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.4(a) to (c)]","type":"Mandatory (shall)","app":"Where external stairs are provided","guide":"Check for corrosion, loose treads, missing balusters, locked gates at ground and storage on landings.","method":"V","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-44","sec":"D","req":"External stairs are of non-combustible construction, doorways leading to them have at least 120 min fire resistance, and wall or window openings within 3 m are protected by assemblies rated at least 60 min.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.4(d), (e), Fig. 10]","type":"Mandatory (shall)","app":"Where external stairs are provided","guide":"Measure the distance to the nearest unprotected opening, including AC outdoor units and exhaust louvres.","method":"V, M","sev":4,"rule":[],"area":"EGR","weight":4},{"id":"D-45","sec":"D","req":"External stairs are inclined at not more than 45 degrees, have straight flights not less than 1 500 mm wide, and handrails on both sides 1 000 to 1 200 mm high with balusters at maximum 150 mm gap.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.4(f) to (h)]","type":"Mandatory (shall)","app":"Where external stairs are provided","guide":"Measure.","method":"M","sev":3,"rule":[],"area":"EGR","weight":3},{"id":"D-46","sec":"D","req":"Spiral staircases are used only for low occupant load in buildings not exceeding 9 m in height and are not less than 1 500 mm in diameter.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.4(j)]","type":"Mandatory (shall)","app":"Where spiral stairs are provided","guide":"'Low occupant load' is not quantified; see the Ambiguities sheet.","method":"V, M","sev":3,"rule":[],"area":"EGR","weight":3},{"id":"D-47","sec":"D","req":"Ramps used for egress have a slope not exceeding 1 in 12, slip resistant surface without perforations, landings at top, bottom, doors and changes of direction (1.5 m x 1.5 m), and handrails on both sides.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.4.3.5]","type":"Mandatory (shall)","app":"Where egress ramps are provided","guide":"These requirements do not apply to basement car parking ramps (Note to the clause).","method":"M, V","sev":3,"rule":[],"area":"EGR","weight":3},{"id":"D-48","sec":"D","req":"Every basement has not less than two independent exits, sized for the actual occupancy of the basement.","ref":"[NBC 2016, Part 4, Cl. 4.2.19(a), (b)]","type":"Mandatory (shall)","app":"Buildings with basements","guide":"A ramp is not counted as an exit for car parking basements below the first basement (Table 5, Note 2).","method":"D, V","sev":5,"rule":["bas"],"area":"EGR","weight":5},{"id":"D-49","sec":"D","req":"Where a basement car park has direct approach from an occupancy above, the door openings to the basement are protected by 120 min fire doors.","ref":"[NBC 2016, Part 4, Cl. 4.2.19]","type":"Mandatory (shall)","app":"Buildings with basement car parking","guide":"Exit discharge doors from the basement are excepted. Check lift lobby and stair doors at basement levels.","method":"V","sev":4,"rule":["bpark"],"area":"EGR","weight":4},{"id":"E-01","sec":"E","req":"Exit access, exits and exit discharge are illuminated continuously at all points, including corridors, stairwells and landings.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.1(a)]","type":"Mandatory (shall)","app":"All","guide":"Walk the routes with normal lighting on; note failed lamps and dark stretches.","method":"V","sev":4,"rule":[],"area":"LGT","weight":4},{"id":"E-02","sec":"E","req":"Emergency lighting is powered from a source independent of the normal lighting supply.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.1(b)]","type":"Mandatory (shall)","app":"All","guide":"Identify the source (generator, central battery, self-contained luminaires) from the single line diagram.","method":"D","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"E-03","sec":"E","req":"Horizontal illuminance at floor level on the centreline of escape routes is not less than 10 lumen/m2 (10 lux) under emergency lighting.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.1(d)]","type":"Mandatory (shall)","app":"All","guide":"Measure with a calibrated lux meter with normal lighting switched off. For routes up to 2 m wide, 50 percent of the width shall have at least 5 lux. In auditoria and theatres, exit access illumination may be reduced to not less than 2 lux during performances.","method":"M","sev":4,"rule":[],"area":"LGT","weight":4},{"id":"E-04","sec":"E","req":"Failure of any single lighting unit does not leave any area of the escape route in darkness.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.1(e)]","type":"Mandatory (shall)","app":"All","guide":"Check luminaire spacing and circuiting.","method":"V, D","sev":3,"rule":[],"area":"LGT","weight":3},{"id":"E-05","sec":"E","req":"Emergency lighting comes on within 5 s of failure of the normal supply and maintains the required illumination for not less than 90 min.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.1(f)]","type":"Mandatory (shall)","app":"All","guide":"Simulate mains failure on a sample circuit and time the changeover. For duration, review the last full-duration discharge test record or witness a test.","method":"T, D","sev":4,"rule":[],"area":"LGT","weight":4},{"id":"E-06","sec":"E","req":"Battery pack emergency lighting is not used in lieu of a diesel engine driven emergency power supply.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.1(g)]","type":"Mandatory (shall)","app":"All","guide":"Under Cl. 3.4.7.2 the alternative supply for exit passageway and staircase lighting may be a battery continuously trickle charged from the mains; read the two clauses together and record the arrangement found.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"E-07","sec":"E","req":"Escape lighting luminaires are located near corridor intersections, exits and exit doors, changes of direction and level, each staircase flight, final exits, fire alarm call points and firefighting equipment, and are mounted at least 2 m above floor level.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.1(h), (j)]","type":"Recommended (should)","app":"All","guide":"Locations are a recommendation ('should'); the 2 m mounting height is mandatory. 'Near' means within 2 m horizontally (Note to the clause).","method":"V","sev":3,"rule":[],"area":"LGT","weight":3},{"id":"E-08","sec":"E","req":"Exit passageway (at ground) and staircase lighting is connected to an alternative supply.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.2]","type":"Mandatory (shall)","app":"All","guide":"Verify by switching off the normal supply.","method":"T","sev":4,"rule":[],"area":"LGT","weight":4},{"id":"E-09","sec":"E","req":"Double throw switches prevent staircase and corridor lighting from being connected to two sources of supply simultaneously.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.3]","type":"Mandatory (shall)","app":"All","guide":"Check in the service room where the standby supply terminates.","method":"V, D","sev":2,"rule":[],"area":"LGT","weight":2},{"id":"E-10","sec":"E","req":"The emergency lighting system is maintained by periodical inspections and tests.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.3]","type":"Mandatory (shall)","app":"All","guide":"'Periodical' is not quantified. Auditor benchmark: monthly functional test and annual full-duration (90 min) test, with records.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"E-11","sec":"E","req":"No point in an exit access is more than 30 m from a visible exit directional sign, and a directional sign is provided at every change in direction.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.4]","type":"Mandatory (shall)","app":"All (not applicable to A-2 and A-4 below 15 m)","guide":"Walk the routes from the most remote points.","method":"V, M","sev":4,"rule":[],"area":"LGT","weight":4},{"id":"E-12","sec":"E","req":"Exit signs are green, illuminated, and wired to an independent circuit on an alternative source of supply.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.4 [IS 9457, IS 12349, IS 12407]]","type":"Mandatory (shall)","app":"All (not applicable to A-2 and A-4 below 15 m)","guide":"Sizes and colours follow good practice [4(7)], which is not in the project files. Check signs stay lit on mains failure. Signs should be installed so that furniture or equipment movement cannot damage them.","method":"V, T","sev":4,"rule":[],"area":"LGT","weight":4},{"id":"E-13","sec":"E","req":"Photoluminescent markings are provided at internal hydrant boxes, and firefighting equipment is marked by luminous signs.","ref":"[NBC 2016, Part 4, Cl. 3.4.7.4, 5.1.7]","type":"Mandatory (shall)","app":"All","guide":"Visual check with lights off where practicable.","method":"V","sev":2,"rule":[],"area":"LGT","weight":2},{"id":"E-14","sec":"E","req":"Each stairway and lift bank is identified by a letter sign, and stair re-entry signs are posted on each floor within each stairway.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-4.3, D-4.4]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Re-entry sign lettering at least 12.5 mm, fixed approximately 1.5 m above floor level.","method":"V","sev":2,"rule":["h15"],"area":"LGT","weight":2},{"id":"F-01","sec":"F","req":"Staircases and lift lobbies are pressurized or naturally/cross ventilated as required by Table 6 for the building height.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.5(b), Table 6]","type":"Mandatory (shall)","app":"All","guide":"Internal staircase without external wall: pressurized at all heights (except A-2 and A-4 below 15 m). Staircase with external wall: natural ventilation or pressurization (cross ventilation or pressurization above 30 m). Lift lobby: not required below 15 m at ground and above, but segregation and pressurization are required for lifts travelling from ground to basement. Enclosed staircases serving more than one basement shall be pressurized (Note 2).","method":"D, V","sev":5,"rule":[],"area":"HVC","weight":5},{"id":"F-02","sec":"F","req":"Pressure difference is 50 Pa for staircases and between 25 Pa and 30 Pa for lobbies or corridors.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.5(b), Table 6]","type":"Mandatory (shall)","app":"Where pressurization is provided","guide":"Witness a test with fans running and all doors closed; measure with a calibrated differential pressure gauge at top, middle and bottom. Review commissioning and periodic test reports. Where no lift lobby can be provided, the lift hoistway is pressurized at 50 Pa.","method":"T, M","sev":4,"rule":["prs"],"area":"HVC","weight":4},{"id":"F-03","sec":"F","req":"Naturally ventilated staircases have an opening of 0.5 m2 in the external wall at each landing; cross ventilated staircases have two such openings in opposite or adjacent walls.","ref":"[NBC 2016, Part 4, Table 6, Note 1]","type":"Mandatory (shall)","app":"Naturally ventilated staircases","guide":"Measure openings; check they are not glazed shut, boarded or blocked.","method":"M","sev":3,"rule":[],"area":"HVC","weight":3},{"id":"F-04","sec":"F","req":"Stair pressurization is initiated by a signal from the fire alarm panel and is integrated with and supervised by the fire alarm system.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.5(e), (f)]","type":"Mandatory (shall)","app":"Where pressurization is provided","guide":"Simulate an alarm and confirm automatic fan start and status indication at the fire command centre.","method":"T","sev":4,"rule":["prs"],"area":"HVC","weight":4},{"id":"F-05","sec":"F","req":"When pressurization operates, air recirculation stops, exhaust air is vented to atmosphere and air supply to spaces other than exits stops.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.5(d)]","type":"Mandatory (shall)","app":"Air conditioned buildings with pressurization","guide":"Verify the cause and effect matrix and witness a test.","method":"D, T","sev":3,"rule":["prs"],"area":"HVC","weight":3},{"id":"F-06","sec":"F","req":"Pressurized staircases are segregated from unpressurized areas by 120 min fire resistant walls, and the fresh air intake is at least 4 m from any exhaust outlet.","ref":"[NBC 2016, Part 4, Cl. 4.4.2.5(g), (h)]","type":"Mandatory (shall)","app":"Where pressurization is provided","guide":"Measure the intake to exhaust separation at roof or plant level.","method":"V, M","sev":2,"rule":["prs"],"area":"HVC","weight":2},{"id":"F-07","sec":"F","req":"In buildings greater than 60 m, pressurization is evaluated so that the force to set a stair door leaf in motion does not exceed 133 N.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-2]","type":"Advisory (may / desirable)","app":"Height greater than 60 m","guide":"Recommendation ('it is recommended'). Measure door opening force with a force gauge while fans are running.","method":"T, M","sev":3,"rule":["h60"],"area":"HVC","weight":3},{"id":"F-08","sec":"F","req":"Exit access corridors of guest rooms, indoor patient areas and sleeping accommodation have 60 min fire resistant walls and 20 min self-closing fire doors, with a smoke exhaust or pressurization system.","ref":"[NBC 2016, Part 4, Cl. 4.6.1]","type":"Mandatory (shall)","app":"Hotels, hospitals, apartments, custodial, penal and mental institutions","guide":"Not required for naturally cross ventilated corridors or corridors with operable windows. Smoke exhaust is also required for theatres/auditoria and large lobbies.","method":"V, D","sev":4,"rule":[],"area":"HVC","weight":4},{"id":"F-09","sec":"F","req":"Exit passageways from exit to exit discharge are pressurized or naturally ventilated, with 120 min fire doors; mechanical pressurization is automatic with additional manual controls.","ref":"[NBC 2016, Part 4, Cl. 4.6.1]","type":"Mandatory (shall)","app":"Where exit passageways exist","guide":"Check doors, integrity of the passageway and controls.","method":"V, T","sev":4,"rule":[],"area":"HVC","weight":4},{"id":"F-10","sec":"F","req":"Smoke exhaust systems provide a minimum of 12 air changes per hour, and smoke exhaust fans are rated 250 deg C for 120 min.","ref":"[NBC 2016, Part 4, Cl. 4.6.1, 4.6.2]","type":"Mandatory (shall)","app":"Where smoke exhaust is provided","guide":"Check fan nameplates/certificates and the air balance report (design flow / volume served).","method":"D","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"F-11","sec":"F","req":"Each basement is separately ventilated, by vents of aggregate area not less than 2.5 percent of floor area spread around the perimeter, or by mechanical ventilation giving 12 air changes per hour in fire.","ref":"[NBC 2016, Part 4, Cl. 4.6.2]","type":"Mandatory (shall)","app":"Buildings with basements","guide":"In multi-level basements, supply and exhaust fans are in 120 min fire resisting rooms and exhaust fans have back draft dampers to the common shaft.","method":"D, V","sev":4,"rule":["bas"],"area":"CAR","weight":4},{"id":"F-12","sec":"F","req":"The basement smoke extraction system operates on sprinkler flow switch actuation, has local and/or remote manual start-stop control for fire fighters, and gives visual indication of fan status.","ref":"[NBC 2016, Part 4, Cl. 4.6.2]","type":"Mandatory (shall)","app":"Mechanically ventilated basements","guide":"Simulate flow switch operation; test the manual control.","method":"T","sev":4,"rule":["bas"],"area":"CAR","weight":4},{"id":"F-13","sec":"F","req":"Power supply panels for smoke ventilation fans are in a fire safe zone and cabling meets circuit integrity requirements.","ref":"[NBC 2016, Part 4, Cl. 4.6.2 [IS 16246]]","type":"Mandatory (shall)","app":"Mechanically ventilated basements","guide":"Check cable type marking and routing. IS 16246 is not in the project files.","method":"D, V","sev":3,"rule":["bas"],"area":"HVC","weight":3},{"id":"F-14","sec":"F","req":"Smoke ventilation systems do not cross transformer areas, electrical switchboards, electrical rooms or exits; supply air intake is not less than 5 m from exhaust discharge; inlets and outlets at ground are marked 'AIR INLET' / 'SMOKE OUTLET'.","ref":"[NBC 2016, Part 4, Cl. 4.6.2]","type":"Mandatory (shall)","app":"Buildings with basements","guide":"Marking of stall board and pavement lights is a recommendation ('should').","method":"V, M","sev":2,"rule":["bas"],"area":"HVC","weight":2},{"id":"F-15","sec":"F","req":"Separate air handling units serve each floor, and air ducts of one floor do not interconnect with ducts of any other floor.","ref":"[NBC 2016, Part 4, Cl. 3.4.8.2.1]","type":"Mandatory (shall)","app":"Centrally air conditioned buildings","guide":"A separate AHU for each compartment within a floor is desirable (advisory).","method":"D, V","sev":4,"rule":["cac"],"area":"HVC","weight":4},{"id":"F-16","sec":"F","req":"Air handling units have smoke sensitive devices that prevent circulation of smoke through the system.","ref":"[NBC 2016, Part 4, Cl. 3.4.8.2.1 [IS 11360]]","type":"Mandatory (shall)","app":"Centrally air conditioned buildings","guide":"Test AHU trip on duct/return air smoke detector actuation or fire alarm signal.","method":"T","sev":4,"rule":["cac"],"area":"HVC","weight":4},{"id":"F-17","sec":"F","req":"AHU air filters are of non-combustible material and AHU rooms are not used to store combustible material.","ref":"[NBC 2016, Part 4, Cl. 3.4.8.2.3, 3.4.8.2.4]","type":"Mandatory (shall)","app":"Centrally air conditioned buildings","guide":"Inspect each AHU room.","method":"V","sev":3,"rule":["cac"],"area":"HVC","weight":3},{"id":"F-18","sec":"F","req":"Air ducts do not pass through exits, exit passageways or exit enclosures, and exits and lift lobbies are not used as return air passages.","ref":"[NBC 2016, Part 4, Cl. 3.4.8.3.1]","type":"Mandatory (shall)","app":"Centrally air conditioned buildings","guide":"Check above ceilings at stair and lobby walls.","method":"V","sev":4,"rule":["cac"],"area":"HVC","weight":4},{"id":"F-19","sec":"F","req":"Fire or fire/smoke dampers are provided where ducts cross fire separation walls and floors and enter vertical shafts, and openings around ducts are sealed to the rating of the compartment.","ref":"[NBC 2016, Part 4, Cl. 3.4.8.3.3, 3.4.8.4.1]","type":"Mandatory (shall)","app":"Centrally air conditioned buildings","guide":"Dampers may be omitted only in ducts required for fire safety operation, which shall then have 120 min integrity. Ducts within a compartment need a minimum 30 min rating (Cl. 3.4.8.3.4).","method":"V, D","sev":4,"rule":["cac"],"area":"HVC","weight":4},{"id":"F-20","sec":"F","req":"Dampers are motorized or fusible link type, accessible for maintenance and testing, integrated with the fire alarm panel, and have manual operation facilities.","ref":"[NBC 2016, Part 4, Cl. 3.4.8.4.2]","type":"Mandatory (shall)","app":"Centrally air conditioned buildings","guide":"Operate a sample of dampers from the panel and manually; check access panels (Cl. 3.4.8.3.6).","method":"T","sev":4,"rule":["cac"],"area":"HVC","weight":4},{"id":"F-21","sec":"F","req":"Duct insulation, inside or outside, is non-combustible and not wrapped or secured with combustible material.","ref":"[NBC 2016, Part 4, Cl. 3.4.8.3.5]","type":"Mandatory (shall)","app":"Centrally air conditioned buildings","guide":"Check material certificates and inspect samples.","method":"D, V","sev":3,"rule":["cac"],"area":"HVC","weight":3},{"id":"F-22","sec":"F","req":"Smoke extraction fans, pressurization fans and fire dampers are periodically run and tested and kept maintained.","ref":"[NBC 2016, Part 12, Cl. 15.3, 15.4]","type":"Mandatory (shall)","app":"Where provided","guide":"The clause says at least a fortnightly check is desirable. Review run/test logs for the last three months.","method":"D","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"G-01","sec":"G","req":"The electrical installation follows good practice for fire safety and Part 8 Section 2 of the Code.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.1 [IS 1646]]","type":"Advisory (may / desirable)","app":"All","guide":"The clause says 'reference may be made'. Cross-refer to the electrical safety audit. Flame retardant wiring is described as desirable. IS 1646 is not in the project files.","method":"D","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"G-02","sec":"G","req":"Medium and low voltage wiring in shafts and within false ceilings runs in metal conduit, and 230 V wiring above false ceilings has 660 V grade insulation.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.1, 3.4.5.4]","type":"Mandatory (shall)","app":"All","guide":"Open ceiling tiles at sample locations. Record loose wiring, PVC conduit and open joints above ceilings.","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"G-03","sec":"G","req":"Electric distribution cables and wiring are in a separate shaft that is sealed at every floor with fire stop material of the same fire resistance as the floor.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.1; CEA Safety Regs 2023, Reg. 38(3)(iii)]","type":"Mandatory (shall)","app":"All","guide":"Inspect electrical shafts on sample floors. CEA Reg. 38(3)(iii) requires a fire barrier at each floor crossing of every power cable and service duct in buildings above 15 m and public buildings.","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"G-04","sec":"G","req":"Water mains, gas pipes, telephone, intercom or any other service lines are not laid in the duct for electrical cables.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.1; CEA Safety Regs 2023, Reg. 38(3)(iii)]","type":"Mandatory (shall)","app":"All","guide":"Use of bus ducts or solid rising mains instead of cables is preferred (advisory). CEA Reg. 38(3)(iii) also prohibits other service pipes and cables in power cable ducts.","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"G-05","sec":"G","req":"High, medium and low voltage wiring in shafts and false ceilings runs in separate shafts or conduits.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.1]","type":"Mandatory (shall)","app":"All","guide":"Visual check.","method":"V","sev":3,"rule":[],"area":"ELR","weight":3},{"id":"G-06","sec":"G","req":"Cables for fire alarm and public address systems are in metal conduit or armoured, segregated from power cables.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.1]","type":"Mandatory (shall)","app":"All","guide":"Visual check in shafts and above ceilings.","method":"V","sev":3,"rule":[],"area":"ELR","weight":3},{"i
