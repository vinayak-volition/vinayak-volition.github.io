"Check nameplate; time a run from access level to the top served landing.","method":"D, T","sev":3,"rule":["h15"],"area":"LFT","weight":3},{"id":"K-05","sec":"K","req":"The fireman's lift has a two-position fireman's switch in a glass-fronted box at the evacuation floor, and operates correctly in Phase I (return to evacuation floor) and Phase II (car control only).","ref":"[NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(k)(ii), (x)]","type":"Mandatory (shall)","app":"Height more than 15 m","guide":"Witness the test with the lift maintainer: on switch ON, landing calls are cancelled, the car returns non-stop to the evacuation floor and parks with doors open; in Phase II it responds to car calls only.","method":"T","sev":4,"rule":["h15"],"area":"LFT","weight":4},{"id":"K-06","sec":"K","req":"All lifts have Phase I grounding operation, initiated by switch or by signal from the fire alarm system.","ref":"[NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(h), (j)]","type":"Mandatory (shall)","app":"Height more than 15 m","guide":"Witness grounding of all lifts on a simulated alarm.","method":"T","sev":4,"rule":["h15"],"area":"LFT","weight":4},{"id":"K-07","sec":"K","req":"The fireman's lift has a reliable alternative power source with changeover, fire-safe wiring route, the words 'Fireman Lift' in fluorescent paint at the landing, and arrangements to keep firefighting water out of the lift shaft.","ref":"[NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(k)(vii) to (ix)]","type":"Mandatory (shall)","app":"Height more than 15 m","guide":"The alternative supply is a 'should' in the clause, but Part 4 Cl. 3.4.6.2 makes emergency power to fireman's lifts mandatory.","method":"V, T","sev":3,"rule":["h15"],"area":"LFT","weight":3},{"id":"K-08","sec":"K","req":"Lift well enclosures have a fire rating of 120 min with a vent at the top of not less than 0.2 m2 per lift, and landing doors are imperforate with minimum 60 min fire resistance.","ref":"[NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(c), (d)]","type":"Mandatory (shall)","app":"Height more than 15 m","guide":"Collapsible landing and car doors are not permitted.","method":"D, V","sev":3,"rule":["h15"],"area":"LFT","weight":3},{"id":"K-09","sec":"K","req":"Communication facilities are provided in the lift car and lift main lobby and are connected to the fire control room.","ref":"[NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(f)]","type":"Mandatory (shall)","app":"Height more than 15 m","guide":"Test the intercom from a car.","method":"T","sev":3,"rule":["h15"],"area":"LFT","weight":3},{"id":"K-10","sec":"K","req":"Refuge areas are provided and sized for the occupants of two consecutive floors at 0.3 m2 per person, plus one wheelchair space of 0.9 m2 for every 200 occupants or part thereof, with a minimum of 15 m2.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-4(d)]","type":"Mandatory (shall)","app":"Height more than 24 m","guide":"High rise apartment buildings with balconies need not have refuge areas up to 60 m; above 60 m, at 60 m and every 30 m thereafter. For D-6, Cl. 6.4.2.2 governs. Compute required area from the occupant load and measure the area provided.","method":"D, M","sev":5,"rule":["h24"],"area":"LFT","weight":5},{"id":"K-11","sec":"K","req":"Refuge areas are on the periphery of the floor, open to air on at least one side with railings, located at or immediately above 24 m and thereafter at every 15 m.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-4(d)(1), (2)]","type":"Mandatory (shall)","app":"Height more than 24 m","guide":"The clause says 'every 15 m or so'; use 15 m as the benchmark.","method":"V, M","sev":4,"rule":["h24"],"area":"LFT","weight":4},{"id":"K-12","sec":"K","req":"Refuge areas are always kept clear, with no storage of combustible materials or electrical and mechanical equipment.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-4(j); NBC 2016, Part 12, Cl. 15.15]","type":"Mandatory (shall)","app":"Height more than 24 m","guide":"Inspect every refuge area. Record enclosures, conversion to other use, storage and locked access.","method":"V","sev":5,"rule":["h24"],"area":"LFT","weight":5},{"id":"K-13","sec":"K","req":"Each refuge area is ventilated, sprinklered, and provided with first aid box, fire extinguishers, public address speaker, fireman talk-back, emergency lighting, drinking water and drainage.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-4(f), (k), (m)]","type":"Mandatory (shall)","app":"Height more than 24 m","guide":"Check each item on site.","method":"V","sev":3,"rule":["h24"],"area":"LFT","weight":3},{"id":"K-14","sec":"K","req":"A 'REFUGE AREA' sign with letters of minimum 75 mm, also showing locations of refuge areas on floors above and below, is installed at the entry and within the refuge area.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-4(e)]","type":"Mandatory (shall)","app":"Height more than 24 m","guide":"Measure letter height.","method":"V, M","sev":2,"rule":["h24"],"area":"LFT","weight":2},{"id":"K-15","sec":"K","req":"Refuge areas are approachable by an accessible means of egress and connect to the firefighting shaft without occupants having to return through the spaces they came from.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-4(g), (h)]","type":"Mandatory (shall)","app":"Height more than 24 m","guide":"Walk the route from the floor to the refuge area and on to the shaft.","method":"V","sev":4,"rule":["h24"],"area":"LFT","weight":4},{"id":"K-16","sec":"K","req":"Horizontal exits are through 120 min fire doors in fire resistant walls, openable at all times from both sides, swinging in the direction of exit travel.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-4(a) to (c), (n)]","type":"Mandatory (shall)","app":"Where horizontal exits are provided","guide":"Level differences are ramped at not steeper than 1 in 12.","method":"V, T","sev":4,"rule":[],"area":"LFT","weight":4},{"id":"K-17","sec":"K","req":"Sprinklers are fed from the main riser and an alternate/standby riser with isolation valves.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-6]","type":"Mandatory (shall)","app":"Residential above 120 m; other occupancies above 60 m","guide":"Check the riser schematic.","method":"D","sev":3,"rule":["h60"],"area":"DOC","weight":3},{"id":"K-18","sec":"K","req":"Fire water storage and pumps are provided at intermediate levels, with a fire pump room connected to the firefighting shaft.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-6]","type":"Mandatory (shall)","app":"Height exceeding 150 m to 175 m","guide":"Tanks at 160 m to 180 m and at intermediate floors above, each at least half of the Table 7 underground capacity, with one working and one standby pump of 2 850 litre/min.","method":"D, V","sev":3,"rule":["h150"],"area":"LFT","weight":3},{"id":"K-19","sec":"K","req":"Seismic bracing of firefighting installations is considered.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-6]","type":"Advisory (may / desirable)","app":"High rise (15 m and above)","guide":"The clause says bracing 'shall be considered' depending on seismic vulnerability and occupancy; treat as advisory unless the design basis commits to it.","method":"D","sev":2,"rule":["h15"],"area":"DOC","weight":2},{"id":"K-20","sec":"K","req":"A helipad is provided.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-8]","type":"Advisory (may / desirable)","app":"Height above 200 m","guide":"Recommendation only.","method":"V","sev":1,"rule":["h200"],"area":"LFT","weight":1},{"id":"L-01","sec":"L","req":"Gas pipes run in separate shafts used exclusively for the purpose, on external walls and away from staircases; distribution pipes are below the false ceiling.","ref":"[NBC 2016, Part 4, Cl. 4.7.1]","type":"Mandatory (shall)","app":"Where piped gas / LPG reticulation is installed","guide":"Trace the route from the bank or meter to the points of use.","method":"V","sev":4,"rule":["gas"],"area":"KIT","weight":4},{"id":"L-02","sec":"L","req":"Gas lines are not installed through electrical shafts, escape routes or refuge areas.","ref":"[NBC 2016, Part 4, Cl. 4.7.8]","type":"Mandatory (shall)","app":"Where gas is used","guide":"Visual check.","method":"V","sev":5,"rule":["gas"],"area":"KIT","weight":5},{"id":"L-03","sec":"L","req":"Kitchens working on LPG are not located in basements.","ref":"[NBC 2016, Part 4, Cl. 4.7.9; Annex G, Cl. G-3(f)]","type":"Mandatory (shall)","app":"All","guide":"Check all basement levels, including staff canteens and pantries.","method":"V","sev":5,"rule":[],"area":"KIT","weight":5},{"id":"L-04","sec":"L","req":"Gas cylinders and manifolds are housed in a detached, ventilated enclosure at the distances prescribed in good practice, away from air intakes, smoke exhaust openings and windows.","ref":"[NBC 2016, Part 4, Cl. 4.7.3, 4.7.4 [IS 6044]]","type":"Mandatory (shall)","app":"Where LPG cylinders / manifolds are used","guide":"Separation distances come from IS 6044, which is not in the project files. Medium velocity spray nozzles for the enclosure are desirable (advisory).","method":"V, M","sev":4,"rule":["gas"],"area":"KIT","weight":4},{"id":"L-05","sec":"L","req":"The building has an approved outside gas shut-off valve, conspicuously marked.","ref":"[NBC 2016, Part 4, Cl. 4.8(a)]","type":"Mandatory (shall)","app":"Where gas is supplied","guide":"Check it is accessible and that staff know its location.","method":"V","sev":4,"rule":["gas"],"area":"KIT","weight":4},{"id":"L-06","sec":"L","req":"Pressure regulating stations with excess flow shut-off valves are installed, and a seismic shut-off valve is provided at the main distribution point.","ref":"[NBC 2016, Part 4, Cl. 4.7.5]","type":"Mandatory (shall)","app":"Gas installations (seismic valve: D-6 and institutional above 15 m)","guide":"Check installation and test records.","method":"V, D","sev":3,"rule":["gas"],"area":"KIT","weight":3},{"id":"L-07","sec":"L","req":"Gas leak detectors are provided at usage points and monitored from the fire command centre, with circuit integrity signal cables.","ref":"[NBC 2016, Part 4, Cl. 4.7.7]","type":"Mandatory (shall)","app":"Buildings above 100 m using LPG","guide":"Test a detector with the maintainer.","method":"T","sev":3,"rule":["h100","gas"],"area":"KIT","weight":3},{"id":"L-08","sec":"L","req":"Gas meters are housed in a metal cupboard in a well-ventilated space.","ref":"[NBC 2016, Part 4, Cl. 4.7.6]","type":"Mandatory (shall)","app":"Where gas meters are installed","guide":"Ventilation position should suit the gas: LPG is heavier than air, town gas lighter.","method":"V","sev":2,"rule":["gas"],"area":"KIT","weight":2},{"id":"L-09","sec":"L","req":"Thermal detectors are installed in the fume hoods of large kitchens, with automatic tripping of the exhaust fan and shut-off of gas in case of fire.","ref":"[NBC 2016, Part 4, Cl. 4.7.2]","type":"Mandatory (shall)","app":"Large kitchens of hotels, hospitals and similar in high rise buildings","guide":"The gas valve is hand re-set type, accessible and segregated from cooking ranges.","method":"V, T","sev":4,"rule":["kit"],"area":"KIT","weight":4},{"id":"L-10","sec":"L","req":"Commercial kitchens are separated from other parts of the building by compartment walls and floors of at least 60 min, with 60 min self-closing doors to food serving areas.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-3(a), (b)]","type":"Mandatory (shall)","app":"Commercial kitchens in centrally air conditioned buildings (Annex G scope)","guide":"Open kitchens need 60 min fire rated glass or drop fire curtains (G-3(c)).","method":"V","sev":4,"rule":["kit"],"area":"KIT","weight":4},{"id":"L-11","sec":"L","req":"In a building that is not sprinkler protected, the commercial kitchen floor area does not exceed 50 m2.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-3(e)]","type":"Mandatory (shall)","app":"Commercial kitchens in unsprinklered buildings","guide":"Measure.","method":"M","sev":3,"rule":["kit"],"area":"KIT","weight":3},{"id":"L-12","sec":"L","req":"An automatic fixed fire suppression system protects all cooking equipment producing grease laden vapours, the hoods, grease removal devices and exhaust ducts.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-2(a), G-5.1(b), (c), G-5.2(a), (c)]","type":"Mandatory (shall)","app":"Commercial kitchens (Annex G scope)","guide":"Wet chemical or equivalent approved system for hoods; no sprinklers within 3 m of cooking equipment and hoods (G-5.2(b)). Check nozzles, caps, cylinder pressure, fusible links/detectors and service tags.","method":"V, D","sev":5,"rule":["kit"],"area":"KIT","weight":5},{"id":"L-13","sec":"L","req":"On actuation of the kitchen suppression system, power and gas to the equipment are cut off automatically, the supply fan stops, the exhaust fan keeps running, an alarm sounds and the fire alarm system is signalled; a manual actuating device is in the means of egress.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-5.2(c), (d)]","type":"Mandatory (shall)","app":"Commercial kitchens (Annex G scope)","guide":"Review the last functional test report; witness a simulated test where possible.","method":"D, T","sev":4,"rule":["kit"],"area":"KIT","weight":4},{"id":"L-14","sec":"L","req":"Gas leakage detectors are provided in all kitchens, linked to a gas solenoid valve for emergency shut-off and integrated with the fire alarm system.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-5.2(d)(5)]","type":"Mandatory (shall)","app":"Commercial kitchens using gas (Annex G scope)","guide":"Test with the maintainer.","method":"T","sev":4,"rule":["kit","gas"],"area":"KIT","weight":4},{"id":"L-15","sec":"L","req":"Kitchen exhaust ducts are cleaned every six months, and grease filters are accessible, removable and cleaned.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-5.3(c), G-5.4(k)]","type":"Mandatory (shall)","app":"Commercial kitchens (Annex G scope)","guide":"Ask for duct cleaning records with before/after photographs; inspect a duct access panel for grease build-up.","method":"D, V","sev":4,"rule":["kit"],"area":"KIT","weight":4},{"id":"L-16","sec":"L","req":"Fire extinguishers near cooking areas and hoods are suitable for the type of fire.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-5.2(e)]","type":"Mandatory (shall)","app":"Commercial kitchens (Annex G scope)","guide":"Suitability by class of fire comes from IS 2190 (not in project files).","method":"V","sev":3,"rule":["kit"],"area":"KIT","weight":3},{"id":"L-17","sec":"L","req":"Equipment using dry fuel (wood/charcoal) has independent exhaust ducts or approved spark arrestors.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-5.3(d)]","type":"Mandatory (shall)","app":"Kitchens with tandoors / charcoal equipment","guide":"Check spark arrestors are accessible and cleaned.","method":"V","sev":3,"rule":["kit"],"area":"KIT","weight":3},{"id":"L-18","sec":"L","req":"Kitchen exhaust terminates with at least 3 m horizontal clearance to adjacent buildings, property lines and air intakes, and 1.5 m to any combustible structure.","ref":"[NBC 2016, Part 4, Annex G, Cl. G-5.5]","type":"Mandatory (shall)","app":"Commercial kitchens (Annex G scope)","guide":"Measure at the termination.","method":"M","sev":2,"rule":["kit"],"area":"KIT","weight":2},{"id":"L-19","sec":"L","req":"Boilers and boiler rooms conform to The Boilers Act, 1923.","ref":"[NBC 2016, Part 4, Cl. 3.4.9.2.1]","type":"Mandatory (shall)","app":"Where boilers are installed","guide":"Check the boiler inspection certificate and its validity. The Act is not in the project files.","method":"D","sev":4,"rule":["boil"],"area":"DOC","weight":4},{"id":"L-20","sec":"L","req":"Boilers are in a 180 min fire resisting room with a 120 min door, dedicated ventilation not routed through electrical rooms or exits, and a dyked oil tank (10 percent extra volume, sand filled to 300 mm).","ref":"[NBC 2016, Part 4, Cl. 3.4.9.2.2]","type":"Advisory (may / desirable)","app":"Where boilers are installed","guide":"The clause introduces these as aspects that 'may be taken into account'.","method":"V, M","sev":4,"rule":["boil"],"area":"KIT","weight":4},{"id":"L-21","sec":"L","req":"Rooms containing high pressure boilers, refrigerating machinery, transformers or other equipment subject to possible explosion are not directly under or adjacent to exits, are cut off from the rest of the building and vented to outside air.","ref":"[NBC 2016, Part 4, Cl. 4.8]","type":"Mandatory (shall)","app":"Where such rooms exist","guide":"All high hazard rooms or areas shall be segregated or protected by 120 min fire resistant walls.","method":"V, D","sev":4,"rule":[],"area":"KIT","weight":4},{"id":"L-22","sec":"L","req":"Flammable liquids, gases and other hazardous materials are identified, kept to the minimum needed, and stored in designated, ventilated, segregated locations.","ref":"[Good practice; see NBC 2016, Part 4, Cl. 4.8 and Annex D, Cl. D-9.8(w)]","type":"Good practice (not an NBC clause)","app":"Where such materials are present","guide":"NBC requires segregation of high hazard areas (Cl. 4.8) and listing in the building information form. Quantities and licensing fall under the Petroleum Act and other rules not in the project files. Record paint, solvent, diesel, LPG and chemical stores.","method":"V, D","sev":4,"rule":[],"area":"KIT","weight":4},{"id":"L-23","sec":"L","req":"Commercial kitchens have Class F rated extinguishers within 10 m travel of cooking appliances, sized by cooking area per Table 3 of IS 2190 (5F per 0.03 m2, 15F per 0.05 m2, 25F per 0.08 m2, 75F per 0.25 m2 of cooking area).","ref":"[IS 2190 : 2024, Cl. 6.3.6, 7.7, Table 3]","type":"Mandatory (shall)","app":"Kitchens using cooking oils or fats","guide":"Check the Class F rating marked on the label; ABC powder or CO2 is not a substitute for a Class F rating. Hood suppression systems, where fitted, are additional.","method":"V","sev":4,"rule":["kit"],"area":"KIT","weight":4},{"id":"M-01","sec":"M","req":"Parking structures within, above, below, attached to or less than 3 m from a building used for another purpose are separated by walls and floors of not less than 120 min fire resistance.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-2(c)]","type":"Mandatory (shall)","app":"Buildings with car parking","guide":"Incidental cashier/attendant booths and toilets up to 200 m2 in total are excluded.","method":"D, V","sev":4,"rule":["park"],"area":"CAR","weight":4},{"id":"M-02","sec":"M","req":"Vehicle ramps are not counted as exits unless pedestrian facilities are provided, and means of egress from parking meet Clause 4.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-2(d), (g)]","type":"Mandatory (shall)","app":"Buildings with car parking","guide":"Check stair access from every parking level and travel distance.","method":"D, V","sev":3,"rule":["park"],"area":"CAR","weight":3},{"id":"M-03","sec":"M","req":"No fuel dispensing is carried out in the building, and any car repair facility is separated by 120 min fire resistant construction.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-2(a), (e)]","type":"Mandatory (shall)","app":"Buildings with car parking","guide":"Look for informal repair, washing with solvents and fuel storage in parking areas.","method":"V","sev":4,"rule":["park"],"area":"CAR","weight":4},{"id":"M-04","sec":"M","req":"Sprinklers in car parking are standard response type with minimum K-factor of 80 and area coverage of 9 m2.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-4(b); IS 15105 : 2002, Cl. 5.1.2, 8.1.2, 11.2.2]","type":"Mandatory (shall)","app":"Enclosed car parking","guide":"IS 15105 classes car parking within buildings or basements as moderate hazard: design density 5 l/min/m2 over 360 m2 (8.1.2), not more than 12 m2 per sprinkler and 4.0 m spacing (11.2.2). Check head markings (15 mm, K-80), spacing, and obstruction by ducts and cable trays.","method":"V, M","sev":3,"rule":["bpark/epark"],"area":"CAR","weight":3},{"id":"M-05","sec":"M","req":"Basement car parking is compartmented (3 000 m2 when sprinklered) by fire barriers, water curtain or a combination.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-4(c) to (e); Cl. 4.5.2]","type":"Mandatory (shall)","app":"Basement car parking","guide":"Water curtain: deluge system operated by sprinkler flow switch, fed by an independent electric pump, with water for 60 min for the largest compartment perimeter in addition to existing storage.","method":"D, V","sev":4,"rule":["bpark"],"area":"CAR","weight":4},{"id":"M-06","sec":"M","req":"All fire exit doors from car parking to exits are painted green and display exit signage.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-4(g)]","type":"Mandatory (shall)","app":"Enclosed car parking","guide":"Visual check.","method":"V","sev":2,"rule":["bpark/epark"],"area":"CAR","weight":2},{"id":"M-07","sec":"M","req":"Stilt parking is sprinklered where the building is required to be sprinklered, and open-to-sky car parking in a complex with a hydrant system is covered by yard hydrants.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-3(c), (e) [IS 13039]]","type":"Mandatory (shall)","app":"Stilt and open car parking","guide":"Visual check. Yard hydrant details per IS 13039 are in I-51 to I-54.","method":"V","sev":3,"rule":["opark"],"area":"CAR","weight":3},{"id":"M-08","sec":"M","req":"Hydraulic oil tanks and pumps for car lifts located below ground have appropriate fire detection and suppression.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-2(f)]","type":"Mandatory (shall)","app":"Where car lifts are installed","guide":"Visual check.","method":"V","sev":3,"rule":["clift"],"area":"CAR","weight":3},{"id":"M-09","sec":"M","req":"Parking floors are non-combustible and slope towards drains.","ref":"[NBC 2016, Part 4, Annex H, Cl. H-2(b)]","type":"Mandatory (shall)","app":"Buildings with car parking","guide":"Check for standing water and oil.","method":"V","sev":2,"rule":["park"],"area":"CAR","weight":2},{"id":"N-01","sec":"N","req":"The atrium is in a building of Type 1 or Type 2 construction, and combustible furnishings and decorations on the atrium floor are limited and sparsely distributed.","ref":"[NBC 2016, Part 4, Annex F, Cl. F-1(a)]","type":"Mandatory (shall)","app":"Buildings with an atrium","guide":"'Limited and sparsely distributed' is not quantified; see the Ambiguities sheet. Record kiosks, exhibitions, vehicles on display and seasonal decorations.","method":"D, V","sev":3,"rule":["atr"],"area":"FAB","weight":3},{"id":"N-02","sec":"N","req":"Smoke detectors are provided on the underside of each floor protruding into the atrium, at the atrium roof and adjacent to each return air intake; beam or aspirating detectors are used within the atrium space.","ref":"[NBC 2016, Part 4, Annex F, Cl. F-1(b)]","type":"Mandatory (shall)","app":"Buildings with an atrium","guide":"Check device types and test records.","method":"V, D","sev":4,"rule":["atr"],"area":"FAB","weight":4},{"id":"N-03","sec":"N","req":"Sprinklers at 450 mm to 600 mm from the glass protect glazed areas of retail, tenant and other areas adjoining the exit access corridor and atrium, and hydrants are available at the atrium floor and adjoining upper floors.","ref":"[NBC 2016, Part 4, Annex F, Cl. F-1, Fig. 16]","type":"Mandatory (shall)","app":"Buildings with an atrium","guide":"Ceiling sprinklers are not required where the atrium ceiling is more than 17 m above the floor.","method":"V, M","sev":3,"rule":["atr"],"area":"FAB","weight":3},{"id":"N-04","sec":"N","req":"Atrium smoke extraction provides 6 air changes per hour in business occupancy and 8 in hotels and assembly occupancy, with fans capable of operating at 250 deg C for 120 min and on emergency power.","ref":"[NBC 2016, Part 4, Annex F, Cl. F-1(e), (f), (n)]","type":"Mandatory (shall)","app":"Buildings with an atrium","guide":"Air changes are calculated on the atrium volume for a height of 15 m from the top. Review the design report and test record; witness fan start on alarm.","method":"D, T","sev":4,"rule":["atr"],"area":"FAB","weight":4},{"id":"N-05","sec":"N","req":"Make-up air supply points are beneath the smoke layer at the lower levels, and make-up air velocity does not exceed 1.02 m/s where it could contact the plume.","ref":"[NBC 2016, Part 4, Annex F, Cl. F-1(g), (m)]","type":"Mandatory (shall)","app":"Buildings with an atrium","guide":"Make-up air at 85 to 95 percent of the exhaust flow rate is recommended (F-1(j)).","method":"D, M","sev":2,"rule":["atr"],"area":"FAB","weight":2},{"id":"O-01","sec":"O","req":"Combustible waste, packaging and stored goods are not allowed to accumulate in plant rooms, service shafts, under stairs, on terraces or in basements.","ref":"[Good practice; see NBC 2016, Part 4, Annex D, Cl. D-9.7(a); Cl. 3.4.6.3, 3.4.8.2.4]","type":"Good practice (not an NBC clause)","app":"All","guide":"NBC specifically prohibits storage in substations and AHU rooms and requires housekeeping inspections in the fire prevention programme. Record locations and quantities.","method":"V","sev":4,"rule":[],"area":"HSK","weight":4},{"id":"O-02","sec":"O","req":"An assembly point is designated outside the building, signed, kept clear and known to occupants.","ref":"[Good practice; see NBC 2016, Part 4, Annex D, Cl. D-9.11]","type":"Good practice (not an NBC clause)","app":"All","guide":"The Personal Fire Instruction Card format includes the assembly point. Check it is clear of fire tender routes and large enough for the occupant load.","method":"V","sev":3,"rule":[],"area":"HSK","weight":3},{"id":"O-03","sec":"O","req":"Smoking is controlled, with designated areas and safe disposal of smoking materials.","ref":"[Good practice (not an NBC clause)]","type":"Good practice (not an NBC clause)","app":"All","guide":"Check signage and evidence of smoking in stores, plant rooms, basements and staircases.","method":"V","sev":3,"rule":[],"area":"HSK","weight":3},{"id":"O-04","sec":"O","req":"Temporary wiring, overloaded socket outlets, extension boards and portable heating or cooking appliances are controlled.","ref":"[Good practice; see NBC 2016, Part 4, Cl. 3.4.6.1; CEA Safety Regs 2023, Reg. 14, 23]","type":"Good practice (not an NBC clause)","app":"All","guide":"Cross-refer to the electrical safety audit. Record locations.","method":"V","sev":4,"rule":[],"area":"HSK","weight":4},{"id":"P-01","sec":"P","req":"Every person who operates or works on electrical lines and apparatus is designated by the owner/consumer, holds a certificate of competency or electrical work permit issued by the Appropriate Government, and is entered in a record (paper or electronic) of designated persons stating the purpose of designation.","ref":"[CEA Safety Regs 2023, Reg. 3(1) to (3), 4; Sch. II Form II, item 1]","type":"Mandatory (shall)","app":"All","guide":"Ask for the register of designated persons. For each electrician / maintenance technician on the roster (in-house and AMC), check the name is in the register, the purpose is stated, and a valid competency certificate or wiring permit is on file. Record anyone working on panels who is not in the register.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"P-02","sec":"P","req":"An Electrical Safety Officer with the required qualification (degree in Electrical Engineering and 5 years O&M experience, or diploma and 10 years) is designated for the installation.","ref":"[CEA Safety Regs 2023, Reg. 5(2), (3)]","type":"Mandatory (shall)","app":"Installations (including factories) with connected load above 250 kW","guide":"Obtain the connected load from the sanction letter or bill. Above 250 kW, check the written designation of the ESO and his qualification and experience certificates. See the Ambiguities sheet on whether the 250 kW limb applies to non-factory premises.","method":"D","sev":3,"rule":["kw250"],"area":"DOC","weight":3},{"id":"P-03","sec":"P","req":"The Electrical Safety Officer inspects the installation and carries out the recommended periodic tests at intervals not exceeding one year, records them in the Schedule II forms, and keeps test reports and a register of safety recommendations acknowledged by the owner with the compliance made.","ref":"[CEA Safety Regs 2023, Reg. 5(3), proviso]","type":"Mandatory (shall)","app":"Where an Electrical Safety Officer is required","guide":"Check the last two annual inspection records (Form I / II / III / IV), the test reports and the recommendations register. Every recommendation should show owner acknowledgement, action taken and date. An interval longer than 12 months is NC.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"P-04","sec":"P","req":"The installation has a current periodic inspection: by the Electrical Inspector where above the notified voltage, or self-certified by the owner and the report submitted in the Schedule II form where at or below it; the interval is as directed by the Appropriate Government and not more than five years; defects pointed out by the Inspector are rectified within the time given.","ref":"[CEA Safety Regs 2023, Reg. 32(1) to (3), (7); Reg. 45(1)]","type":"Mandatory (shall)","app":"All","guide":"Obtain the last Electrical Inspector certificate or self-certification report with its acknowledgement (deemed received if not acknowledged within 3 working days). Confirm the state's notified voltage and inspection periodicity (not in project files). Check every defect listed has been closed.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"P-05","sec":"P","req":"Installation work (other than like-for-like replacement of lamps, fans, fuses, switches and fittings at 250 V or less) is done only by a State-licensed electrical contractor under a certificate-of-competency holder; additions and alterations are not energised until approved by the Electrical Inspector or self-certified; supply is not recommenced after six months' disconnection without testing.","ref":"[CEA Safety Regs 2023, Reg. 31(1), (2); Reg. 33(1); Reg. 45(1), (6)]","type":"Mandatory (shall)","app":"All","guide":"Review work orders for fit-out, re-layout and panel changes since the last audit. Check the contractor licence number and supervisor's competency certificate, and the self-certification / approval for each alteration. Unrecorded new circuits or DBs found on site are NC.","method":"D","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"P-06","sec":"P","req":"Electric supply lines and apparatus are of adequate rating for power, insulation and fault current, conform to the relevant standards, show no sign of overloading, and are maintained and operated free from danger as recommended by the manufacturer.","ref":"[CEA Safety Regs 2023, Reg. 14(1), (3); Reg. 32(8); Reg. 48(7); Sch. II Form I/II, item on Reg. 14]","type":"Mandatory (shall)","app":"All","guide":"Look for discoloured or melted insulation, hot or humming breakers, oversized fuses or breakers on undersized cables, and non-ISI devices. Cross-refer to thermography (hotspots), load current against breaker rating and cable size. Record overloaded circuits with readings.","method":"V, M","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-07","sec":"P","req":"All electrical equipment is installed above the highest flood level, or protected so that there is no water seepage, leakage or logging at the equipment.","ref":"[CEA Safety Regs 2023, Reg. 14(4)]","type":"Mandatory (shall)","app":"All","guide":"Check panel rooms, UPS and battery rooms, basements and areas below AC units, pipes and drains. Record any water stains, drips from AHU / FCU lines over or near panels, and equipment on the floor in areas that flood.","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-08","sec":"P","req":"There is no unauthorised temporary installation; flexible cables for portable or transportable apparatus are insulated for the working voltage, protected against mechanical damage, three-core (single phase) or four-core (three phase) with an identifiable earth core, and any metallic covering is earthed.","ref":"[CEA Safety Regs 2023, Reg. 23; Sch. II Form I/II, item on Reg. 14(iv)]","type":"Mandatory (shall)","app":"All","guide":"Walk the floor, back-of-house and display areas. Record two-core flex on metal-bodied equipment, joints taped in flexible cords, temporary or plastic cables used for CT / metering / PA supply, and cables run across floors without protection. See also O-04.","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-09","sec":"P","req":"The supplier's service line, meter and cut-out / circuit breaker on the premises are in a safe condition, housed in an enclosed fire-proof receptacle in an accessible position, and not interfered with by the consumer.","ref":"[CEA Safety Regs 2023, Reg. 15(3), (4); Reg. 16(1); Reg. 37(8)]","type":"Mandatory (shall)","app":"All","guide":"Inspect the incoming service, meter box and supplier's cut-out. Record broken covers, open enclosures, combustible boxes housing the cut-out, storage against it, or signs of tampering.","method":"V","sev":3,"rule":[],"area":"ELR","weight":3},{"id":"P-10","sec":"P","req":"A linked switch, switch-fuse unit or circuit breaker (circuit breaker where supply is 11 kV and above) of adequate capacity is installed as near as possible to the point of commencement of supply, readily accessible and able to isolate the whole installation.","ref":"[CEA Safety Regs 2023, Reg. 16(2); Reg. 37(2); Sch. II Form II, item 17(i)]","type":"Mandatory (shall)","app":"All","guide":"Locate the main incomer. Check it isolates all phases, is labelled, is reachable without moving goods or unlocking third-party rooms, and that staff on each shift know where it is.","method":"V, T","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-11","sec":"P","req":"Every distinct circuit is protected by a fuse or circuit breaker of adequate breaking capacity that will not cause danger from overheating, arcing or scattering of hot metal; each motor or apparatus has an adjacent, readily accessible linked switch, circuit breaker or emergency trip with manual reset.","ref":"[CEA Safety Regs 2023, Reg. 37(4), (5); Sch. II Form II, item 17(ii), (iii)]","type":"Mandatory (shall)","app":"All","guide":"Check DB schedules against the breakers fitted. Record rewired or bridged fuses, breakers of breaking capacity below the prospective fault level, and motors (AHU, pumps, compressors) with no local isolator.","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-12","sec":"P","req":"The earthed neutral conductor is permanently identified (IS colour code) and distinguishable from live conductors; switches are on the live conductors; no fuse, link, switch or breaker is inserted in the neutral other than a linked device that operates simultaneously on neutral and phases.","ref":"[CEA Safety Regs 2023, Reg. 17; Sch. II Form II, item 5]","type":"Mandatory (shall)","app":"All","guide":"Open DBs (with a designated person). Check colours of phase, neutral and earth conductors, single-pole switching in the neutral, and neutral links. Socket polarity tests showing phase-neutral reversal, and TPN / DP devices with a damaged neutral pole, are NC.","method":"V, T","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-13","sec":"P","req":"A suitable earthed terminal is provided at the point of commencement of supply; where the installation exceeds 250 V the consumer also has an independent earthing system with its own electrode, interlinked with the supplier's earthed terminal through a link; both are protected against mechanical damage.","ref":"[CEA Safety Regs 2023, Reg. 18(1), (2); Sch. II Form II, item 6]","type":"Mandatory (shall)","app":"All (own electrode: installations above 250 V)","guide":"Trace the main earth terminal at the incomer and the consumer's own earth electrode(s) and link. In multi-tenant buildings, confirm which earth pits serve the tenant and obtain their test reports.","method":"V, D","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-14","sec":"P","req":"Bare conductors in the building are inaccessible to the public with readily accessible switches to make them dead, and no live parts are exposed so as to cause danger.","ref":"[CEA Safety Regs 2023, Reg. 19; Reg. 37(7); Sch. II Form II, items 7, 17(iv)]","type":"Mandatory (shall)","app":"All","guide":"Look for open DB doors with exposed busbars, missing blanking plates, missing panel covers or screws, exposed connectors on displays, and damaged sockets or switches. Any live part reachable by the public is a Critical finding.","method":"V","sev":5,"rule":[],"area":"ELR","weight":5},{"id":"P-15","sec":"P","req":"A permanent danger notice in Hindi or English and the local language, with the skull and bones sign to the relevant standard, is fixed on every motor, generator, transformer and other electrical plant and its control apparatus (or on its enclosure).","ref":"[CEA Safety Regs 2023, Reg. 20; Sch. II Form II, item 8]","type":"Mandatory (shall)","app":"Installations above 250 V","guide":"Check main LT panel, DBs, UPS, DG, transformer and motor starters. Record missing, faded or English-only notices where the local language is not English. Design benchmark: IS 2551 (not in project files).","method":"V","sev":3,"rule":[],"area":"SUB","weight":3},{"id":"P-16","sec":"P","req":"All non-current-carrying metal parts of switchgear and control panels are earthed; insulating mats or floors of the appropriate voltage grade are provided in front of and behind panels where operation, maintenance or testing is done; every panel is identified by painted description at front and rear.","ref":"[CEA Safety Regs 2023, Reg. 21(5), (6); Sch. II Form II, item 9]","type":"Mandatory (shall)","app":"All","guide":"Check panel body earthing, mats (ISI marked, voltage class marked, not cracked, covering the full working area front and rear) and panel name painted or permanently labelled on both faces. Benchmark for mats: IS 15652 (not in project files).","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-17","sec":"P","req":"Persons working on electric supply lines or apparatus are provided with PPE, tools and devices suitable for the working voltage (rubber gloves, safety footwear, helmet, voltage detector / line tester, earthing devices, insulated hand tools and arc-flash protection), conforming to standards and kept in sound condition.","ref":"[CEA Safety Regs 2023, Reg. 21(2)]","type":"Mandatory (shall)","app":"All","guide":"Inspect the PPE kit at the panel room. Check glove voltage class and test date, footwear, face shield, voltage detector function and insulated tools. A kit with gloves only is PC; no kit is NC.","method":"V, D","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-18","sec":"P","req":"Before work on any conductor or apparatus it is isolated from all sources, proved dead, discharged and earthed, and protected against re-energisation (permit-to-work and lock-out / tag-out); hazards are identified and the team briefed; no lone working; the supervisor stays at the work spot.","ref":"[CEA Safety Regs 2023, Reg. 21(1), (3); Sch. I, Part II]","type":"Mandatory (shall)","app":"All","guide":"Ask for the written isolation / permit-to-work procedure, locks and tags, and recent permits. Ask a technician to describe an isolation. No procedure or no LOTO devices is NC.","method":"D, V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-19","sec":"P","req":"Circuits at different voltages, or at the same voltage, are readily distinguishable by permanent indication; installations with more than one feed (mains, DG, UPS, solar) are permanently marked so each source is identifiable.","ref":"[CEA Safety Regs 2023, Reg. 26; Reg. 27; Sch. II Form II, item 12]","type":"Mandatory (shall)","app":"All","guide":"Check labels on DBs and outgoing feeders (raw power, UPS power, DG backed, solar) and on sockets. Record unlabelled feeders and DB ways.","method":"V","sev":3,"rule":[],"area":"DGS","weight":3},{"id":"P-20","sec":"P","req":"Circuits and apparatus are arranged so that no part can become accidentally charged above its intended voltage; AC and DC circuits on the same box or support are segregated; where two supplies are not meant to run in parallel (mains / DG / solar / UPS bypass), the changeover is interlocked against paralleling and back-feed.","ref":"[CEA Safety Regs 2023, Reg. 28; Reg. 47(1)(iii); Sch. II Form II, items 13, 21]","type":"Mandatory (shall)","app":"Where more than one source of supply exists","guide":"Check the changeover (AMF / ATS / manual) for mechanical and electrical interlock; test with the facility team where safe. Check DC battery and AC cabling segregation in UPS rooms.","method":"T, V","sev":4,"rule":[],"area":"DGS","weight":4},{"id":"P-21","sec":"P","req":"Fire buckets filled with clean dry sand, conspicuously marked, are kept with suitable fire extinguishers; extinguishers are installed, maintained, inspected and tested with records; marked first-aid boxes are kept under the charge of a trained first-aider; locations of these are displayed in the control room / operator cabin.","ref":"[CEA Safety Regs 2023, Reg. 29(1) to (3), (5)]","type":"Mandatory (shall)","app":"Generating stations (including captive DG installations), enclosed substations and enclosed switching stations","guide":"Check sand buckets (full, dry, marked), CO2 / clean agent extinguishers suited to electrical fires, first-aid box contents and the named first-aider for each shift. Extinguisher maintenance detail: see I-41 to I-45.","method":"V, D","sev":3,"rule":["dg/sub"],"area":"ELR","weight":3},{"id":"P-22","sec":"P","req":"At least two gas masks are provided in accessible, conspicuous places for use in fire or smoke.","ref":"[CEA Safety Regs 2023, Reg. 29(4)]","type":"Mandatory (shall)","app":"Generating stations of 5 MW and above; enclosed substations of 5 MVA and above","guide":"Check number, location, condition and expiry of canisters or breathing apparatus.","method":"V","sev":2,"rule":[],"area":"ELR","weight":2},{"id":"P-23","sec":"P","req":"The address and telephone number of the nearest doctor, a hospital with facilities for electric shock and burn treatment, ambulance and fire service are displayed near the electric shock treatment chart in the control room and operator cabin.","ref":"[CEA Safety Regs 2023, Reg. 29(6)]","type":"Mandatory (shall)","app":"Generating stations, substations and switching stations (good practice at main panel rooms elsewhere)","guide":"Check the display is current (call one number) and legible.","method":"V","sev":2,"rule":[],"area":"ELR","weight":2},{"id":"P-24","sec":"P","req":"Instructions for resuscitation of persons suffering electric shock, in English or Hindi and the local language (English and Hindi where Hindi is the local language), are displayed conspicuously, and designated persons are competent to apply them.","ref":"[CEA Safety Regs 2023, Reg. 30(1), (2); Sch. II Form II, item 15]","type":"Mandatory (shall)","app":"Generating stations, enclosed substations, factories, and other premises where directed by the Electrical Inspector (good practice at all main panel rooms)","guide":"Check the chart at the main panel / substation. Ask designated persons for CPR / first-aid training records and to describe the response to an electric shock.","method":"V, D","sev":3,"rule":[],"area":"ELR","weight":3},{"id":"P-25","sec":"P","req":"Insulation resistance between conductors and earth is measured and recorded in megohms; a line disconnected for addition, alteration or repair is not reconnected until the insulation resistance test is done.","ref":"[CEA Safety Regs 2023, Reg. 35(1); Reg. 36; Reg. 42; Sch. II Form I/II]","type":"Mandatory (shall)","app":"All","guide":"Obtain the latest IR test results for main feeders and DBs. Benchmark (auditor's, from IS 732 practice): not less than 1 megohm at 500 V DC for LV circuits; record lower values as findings. Check IR tests were done after recent alterations.","method":"M, D","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-26","sec":"P","req":"Test instruments used for installation testing are calibrated by a Government-authorised or NABL-accredited laboratory at the periodicity they specify.","ref":"[CEA Safety Regs 2023, Reg. 33(3)]","type":"Mandatory (shall)","app":"All","guide":"Check calibration certificates of the earth tester, insulation tester, loop impedance / RCD tester and clamp meter used by the maintenance team or contractor (and the audit team's own instruments).","method":"D","sev":2,"rule":[],"area":"DOC","weight":2},{"id":"P-27","sec":"P","req":"An isolating device with cut-out or breaker on all phases (except neutral) is provided at the point of commencement of supply, in a conspicuous position not more than 1.70 m above ground, to isolate the whole building in an emergency.","ref":"[CEA Safety Regs 2023, Reg. 38(3)(i)]","type":"Mandatory (shall)","app":"Buildings above 15 m; airports, hospitals, hotels, places of entertainment and worship, cultural centres, stadia, academic buildings, test labs, industrial installations, premises with explosive or flammable material, railway / metro stations and other public buildings","guide":"Measure the operating height of the emergency isolator, check it is signed and unobstructed, and that it isolates all phases. Ask the facility team when it was last operated.","method":"V, M, T","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-28","sec":"P","req":"Fire Retardant Low Smoke and Low Halogen (FRLS) power cables are used; Halogen Free Flame Retardant cables are used in airports, hospitals and hotels irrespective of height.","ref":"[CEA Safety Regs 2023, Reg. 38(3)(iv)]","type":"Mandatory (shall)","app":"Buildings above 15 m (HFFR: airports, hospitals and hotels of any height)","guide":"Read the cable sheath printing on risers, main feeders and recent extensions; check purchase records. Record non-FRLS cable runs with locations.","method":"V, D","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-29","sec":"P","req":"Distribution of electricity to the floors is by bus bar trunking.","ref":"[CEA Safety Regs 2023, Reg. 38(3)(v)]","type":"Mandatory (shall)","app":"Buildings above 15 m and other premises listed in Reg. 38(3)","guide":"Check the rising mains. Existing cable risers installed before June 2023 should be reported as an observation with the date of installation.","method":"V","sev":2,"rule":[],"area":"ELR","weight":2},{"id":"P-30","sec":"P","req":"Lightning protection of the building is provided as per the relevant standards, and its down conductors and earth terminations are inspected and tested.","ref":"[CEA Safety Regs 2023, Reg. 38(3)(vi)]","type":"Mandatory (shall)","app":"Buildings above 15 m and other premises listed in Reg. 38(3)","guide":"Check air terminals, down conductors, test joints and earth pits; obtain the last test report. Benchmark: IS/IEC 62305 (not in project files). Routing of down conductors: see G-20.","method":"V, D, M","sev":4,"rule":[],"area":"EXT","weight":4},{"id":"P-31","sec":"P","req":"Electrical wiring of the building has been verified as per the relevant standards, and not less than 30 days' notice was given to the Electrical Inspector before supply was commenced or recommenced after six months.","ref":"[CEA Safety Regs 2023, Reg. 38(2), (3)(vii)]","type":"Mandatory (shall)","app":"Buildings above 15 m and other premises listed in Reg. 38(3)","guide":"Obtain the wiring verification / test report (initial or periodic) and the Inspector's approval or notice. Benchmark: IS 732 verification (not in project files).","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"P-32","sec":"P","req":"Conductors (other than overhead lines) are enclosed in mechanically strong, electrically continuous, earthed metal casing or covering (non-metallic conduit to standard permitted up to 650 V), unless accessible only to designated persons; all metal work enclosing or supporting the installation is earthed.","ref":"[CEA Safety Regs 2023, Reg. 39(i), (ii); Sch. II Form II, item 11]","type":"Mandatory (shall)","app":"Installations above 250 V","guide":"Check cable trays, conduits, trunking and glands. Record broken conduits, open cable entries without glands, unsupported cables and cable trays laid on the floor.","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-33","sec":"P","req":"A clear space of not less than 1 m is kept in front of every switchboard; the space behind is either less than 20 cm or more than 75 cm, and where more than 75 cm there is a passage from either end clear to a height of 1.8 m.","ref":"[CEA Safety Regs 2023, Reg. 39(iii); Sch. II Form II, item 18]","type":"Mandatory (shall)","app":"Installations above 250 V","guide":"Measure with a tape. Record goods, furniture, TVs, cartons or cleaning equipment that reduce the 1 m front clearance, and rear spaces between 20 and 75 cm.","method":"M","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-34","sec":"P","req":"Where flammable materials (gases, liquids, chemicals) are produced, handled or stored, electrical equipment is flameproof, dust-tight, totally enclosed or otherwise suitable for the hazardous zone as per the relevant standards.","ref":"[CEA Safety Regs 2023, Reg. 39(iv)]","type":"Mandatory (shall)","app":"Where flammable materials are present (fuel stores, DG day tank rooms, paint / aerosol / gas stores)","guide":"Obtain the hazardous area classification, if any. Check fittings, switches and sockets in these areas for Ex marking. Ordinary fittings in a classified zone are NC.","method":"V, D","sev":5,"rule":[],"area":"ELR","weight":5},{"id":"P-35","sec":"P","req":"The neutral of every three-phase four-wire system is earthed; the neutral of every generator and transformer is earthed by not less than two separate and distinct connections; frames of generators, motors, transformers and other apparatus above 250 V are earthed by two separate and distinct connections.","ref":"[CEA Safety Regs 2023, Reg. 43(i), (vii), (xiii); Sch. II Form II, item 19(i)]","type":"Mandatory (shall)","app":"All","guide":"Check DG, transformer and motor frames for two independent earth leads to the earth bar / pits. A single earth lead is NC.","method":"V, M","sev":4,"rule":[],"area":"SUB","weight":4},{"id":"P-36","sec":"P","req":"All metal casings and coverings of cables and apparatus are earthed and bonded across junction boxes; every building has protective equipotential bonding of exposed and extraneous conductive parts.","ref":"[CEA Safety Regs 2023, Reg. 43(v), (viii); Sch. II Form II, item 19(ii), (vi)]","type":"Mandatory (shall)","app":"All","guide":"Check gland earthing (copper, tight), conduit and tray bonding, and bonding of water, gas and structural metalwork at entry. Request the bonding test record.","method":"V, T","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-37","sec":"P","req":"In new or renovated installations, all plug sockets are three-pin and the third pin is permanently and effectively earthed.","ref":"[CEA Safety Regs 2023, Reg. 43(viii), second proviso; Sch. II Form I, item 5(ii)]","type":"Mandatory (shall)","app":"Installations at 250 V or less that are new or renovated","guide":"Test a sample of sockets with a socket / earth continuity tester (all sockets in panel, UPS, staff and display areas). Record each failed socket by location and DB way.","method":"T","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-38","sec":"P","req":"Earthing systems use bonding conductors able to carry the prospective earth fault current, are mechanically strong and corrosion resistant, keep continuity through the life of the installation, and were tested for effective bonding before energisation.","ref":"[CEA Safety Regs 2023, Reg. 43(ix); Sch. II Form II, item 19(iv)]","type":"Mandatory (shall)","app":"All","guide":"Inspect earth pits, strips and main earth bar. Record rusted strips, loose or bolted-only joints, earth wires that are damaged or undersized (for example a 10 mm2 cable used in place of an earth strip).","method":"V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-39","sec":"P","req":"Earth fault loop impedance is tested at the origin of the installation, for each circuit and for all sources, and is low enough for the protective device to disconnect before touch voltage becomes harmful; results are recorded.","ref":"[CEA Safety Regs 2023, Reg. 43(x) to (xii); Sch. II Form II, item 19(vii) to (ix)]","type":"Mandatory (shall)","app":"All","guide":"Obtain loop impedance test results. Compare each value with the maximum permitted for the protective device type and rating (IS 732 tables, not in project files). Absence of any loop impedance test is NC.","method":"M, D","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-40","sec":"P","req":"Earth resistance of each earth electrode is tested on a dry day in the dry season at least once a year, and the results are recorded and kept.","ref":"[CEA Safety Regs 2023, Reg. 43(x); Reg. 50(8); Sch. II Form I/II, item 19(iii), (v)]","type":"Mandatory (shall)","app":"All (annual test is explicit for supplier systems and for installations above 650 V; for LV consumers the Schedule II forms require the tested value and records)","guide":"Obtain the last test report for every pit serving the premises, with date and value. CEA sets no ohmic limit; see the Ambiguities sheet for the benchmark. In multi-tenant buildings, obtain the landlord's report.","method":"M, D","sev":3,"rule":[],"area":"EXT","weight":3},{"id":"P-41","sec":"P","req":"Use of electricity is controlled by a residual current device of rated residual current and operating time as per the relevant standards (not more than 30 mA in domestic installations), and RCDs are tested periodically.","ref":"[CEA Safety Regs 2023, Reg. 44; Sch. II Form II, item 20]","type":"Mandatory (shall)","app":"All","guide":"Check RCD / RCCB / ELCB presence at the incomer and on socket and lighting circuits; note ratings. Press the test button with the facility team and record trip / no-trip. See the Ambiguities sheet for the non-domestic rating benchmark.","method":"V, T","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"P-42","sec":"P","req":"Installations above the notified voltage are inspected and approved in writing by the Electrical Inspector before commencement (or recommencement after six months); those at or below the notified voltage but above 650 V are self-certified; manufacturer's test certificates and site tests per standards are available for new or reconnected apparatus.","ref":"[CEA Safety Regs 2023, Reg. 45(1) to (6); Reg. 48(1) to (4)]","type":"Mandatory (shall)","app":"Where the premises own HV (above 650 V) installations","guide":"Obtain the Inspector's approval letter / self-certification for the substation and each later addition, routine test certificates of transformers and switchgear, and site commissioning test reports.","method":"D","sev":4,"rule":["hv"],"area":"DOC","weight":4},{"id":"P-43","sec":"P","req":"HV apparatus, cables and supply lines are kept healthy with periodic tests as per the relevant standards, and records of all tests, trippings, maintenance and repairs are kept so that they can be compared with past records.","ref":"[CEA Safety Regs 2023, Reg. 48(5) to (7); Reg. 46(2)(vii)(d)]","type":"Mandatory (shall)","app":"Where the premises own HV (above 650 V) installations","guide":"Check transformer oil BDV / DGA (where oil filled), IR and tan-delta records, breaker maintenance, relay testing and the tripping register. Trend the results across at least two cycles.","method":"D","sev":3,"rule":["hv"],"area":"DOC","weight":3},{"id":"P-44","sec":"P","req":"HV conductors and apparatus are inaccessible except to designated persons; the supplier's apparatus and metering are in a separate locked, weather-proof and fire-proof enclosure or segregated; live parts within reach are protected; safety clearances allow easy operation and maintenance and ventilation; there is no encroachment below the installation.","ref":"[CEA Safety Regs 2023, Reg. 46(1)(a), (b); Reg. 46(2)(i), (ii), (iv)]","type":"Mandatory (shall)","app":"Where the premises own HV (above 650 V) installations","guide":"Inspect the HT room / yard: locks, signage, barriers, clearance around RMU / VCB / transformer, and storage or occupation beneath or around the installation.","method":"V","sev":4,"rule":["hv"],"area":"SUB","weight":4},{"id":"P-45","sec":"P","req":"A substation in a basement has its transformer room in the first basement at the periphery, with direct access from outside, surrounding walls of 4 h fire rating, 2 h fire doors kept closed with a notice to that effect, a curb at the entrance against oil flow, cable openings sealed to at least 2 h at all floors and walls, and FRLS cables.","ref":"[CEA Safety Regs 2023, Reg. 46(2)(x)]","type":"Mandatory (shall)","app":"Where a substation or switching station is located in a basement","guide":"Check walls and doors (fire rating certificates), door closer and notice, curb height, cable sealing and cable type. CEA requires 4 h walls where NBC Cl. 3.4.6.3.2 (G-17) requires 120 min; apply the stricter value (see Ambiguities).","method":"V, D","sev":5,"rule":["sub","bas"],"area":"SUB","weight":5},{"id":"P-46","sec":"P","req":"Oil-filled installations: no substation with apparatus holding more than 2 000 litre of oil is in a basement without proper oil draining; above 2 000 litre, fire barrier walls and an oil soak pit are provided (drainage where any tank exceeds 9 000 litre); spare oil is not stored near oil-filled equipment; oil-filled transformers indoors in other than residential or commercial buildings are on the ground floor or not below the first basement.","ref":"[CEA Safety Regs 2023, Reg. 46(2)(vi), (vii), (xi)]","type":"Mandatory (shall)","app":"Where oil-filled transformers, switchgear or capacitors are installed","guide":"Obtain oil quantities from nameplates. Check soak pit (clean, with stone fill), drain, barrier walls and storage of oil drums. Separation distances and 10 MVA spray protection: see G-16.","method":"V, D","sev":4,"rule":["oil"],"area":"SUB","weight":4},{"id":"P-47","sec":"P","req":"Only dry type transformers are used inside residential and commercial buildings.","ref":"[CEA Safety Regs 2023, Reg. 46(2)(xii)]","type":"Mandatory (shall)","app":"Residential and commercial buildings with transformers inside the building","guide":"Check transformer nameplates. An oil-filled transformer inside a residential or commercial building is NC (see also G-17).","method":"V","sev":5,"rule":["tin"],"area":"SUB","weight":5},{"id":"P-48","sec":"P","req":"HV substations have adequate fire detection and protection arrangements; cable trenches are filled with sand, pebbles or similar non-inflammable material or fully covered with non-inflammable slabs; underground substations have ventilation and drainage; spaces housing switchgear are not used for storage.","ref":"[CEA Safety Regs 2023, Reg. 46(2)(viii), (xiii); Reg. 51(i)]","type":"Mandatory (shall)","app":"Where the premises own HV (above 650 V) installations","guide":"Inspect detection, extinguishers / suppression, trench covers and fill, ventilation, drainage and housekeeping. Storage in the switch room: see also G-12.","method":"V","sev":4,"rule":["hv"],"area":"SUB","weight":4},{"id":"P-49","sec":"P","req":"HV interlocks are provided and working: isolator with its circuit breaker; earth switch with its isolator; breakers of supplies not meant to run in parallel; secondary breaker tripping with primary breaker of paralleled transformers; doors giving access to live parts.","ref":"[CEA Safety Regs 2023, Reg. 47(1)]","type":"Mandatory (shall)","app":"Where the premises own HV (above 650 V) installations","guide":"Witness interlock checks during a planned shutdown or review the last interlock test record. A defeated interlock is a Critical finding.","method":"T, D","sev":5,"rule":["hv"],"area":"SUB","weight":5},{"id":"P-50","sec":"P","req":"Protection is provided: over-current and earth fault on all circuits; a circuit breaker on the transformer primary for 1 000 kVA and above and on every transformer secondary; Buchholz, pressure relief and winding / oil temperature alarm and trip on transformers of 1 000 kVA and above; differential protection at 10 MVA and above; earth fault protection on generators of 100 kVA and above; REF or differential on generators of 1 000 kVA and above.","ref":"[CEA Safety Regs 2023, Reg. 37(3); Reg. 47(2)]","type":"Mandatory (shall)","app":"Where the premises own transformers or generators of the ratings stated","guide":"Check relay schedules, settings and last secondary-injection test reports. Check DG earth fault (and REF where 1 000 kVA and above) in the AMF / DG panel.","method":"D, T","sev":4,"rule":["hv/dg"],"area":"SUB","weight":4},{"id":"P-51","sec":"P","req":"The HV earthing system or mat limits touch and step potential and earth potential rise to tolerable values and keeps earth resistance low enough for protection to operate; transformer and generator neutrals are earthed by two separate connections; earth resistance is tested annually on a dry day and recorded.","ref":"[CEA Safety Regs 2023, Reg. 50(1), (2), (8)]","type":"Mandatory (shall)","app":"Where the premises own HV (above 650 V) installations","guide":"Obtain the earth mat design / test report and annual earth resistance records. Check two neutral earth leads per transformer and DG.","method":"M, D","sev":4,"rule":["hv"],"area":"SUB","weight":4},{"id":"P-52","sec":"P","req":"Outdoor substations (other than pole-type, or apparatus fully metal-enclosed with armoured cable connections) are fenced to not less than 1.8 m, and the fence is earthed.","ref":"[CEA Safety Regs 2023, Reg. 51(ii)(a); Reg. 52]","type":"Mandatory (shall)","app":"Where an outdoor substation is provided","guide":"Measure fence height, check gate locks, signage and fence earthing. Pole-type platforms: handrail, earthed if metal.","method":"V, M","sev":4,"rule":["sub"],"area":"SUB","weight":4},{"id":"P-53","sec":"P","req":"Every static capacitor (including APFC panels) has an arrangement for its immediate automatic or manual discharge on disconnection of supply.","ref":"[CEA Safety Regs 2023, Reg. 53]","type":"Mandatory (shall)","app":"Where static capacitors / APFC panels are installed","guide":"Check discharge resistors or reactors are fitted and the warning on the panel. Ask for the capacitor maintenance record.","method":"V, D","sev":3,"rule":[],"area":"SUB","weight":3},{"id":"P-54","sec":"P","req":"Luminous tube sign installations above 650 V: live parts screened and inaccessible; secondary earthed at the transformer and transformer cores earthed; dedicated primary sub-circuit; ELCB on the LV side; external signs have a conspicuous fire-proof linked emergency switch not more than 1.70 m above ground; a caution notice on every enclosure; 14 days' notice to the Electrical Inspector before use.","ref":"[CEA Safety Regs 2023, Reg. 54(1), (2)]","type":"Mandatory (shall)","app":"Where neon / luminous tube signs above 650 V are installed","guide":"Check external signage transformers, the fireman's switch location and height, enclosures and notices. Not applicable to LED signage at low voltage.","method":"V, D","sev":4,"rule":[],"area":"SUB","weight":4},{"id":"P-55","sec":"P","req":"Rooftop and ground solar PV: clear pathways of at least 75 cm with handrails for roof access and emergency exit and walkways between rows; DC disconnectors in combiner boxes readily accessible; a manual AC isolation switch outside the AC combiner box; AC phases and DC positive / negative colour coded; inverter at the building periphery near the panels; DC cables UV protected; ground-mounted arrays fenced to 1.8 m.","ref":"[CEA Safety Regs 2023, Reg. 121(1)]","type":"Mandatory (shall)","app":"Where a solar PV installation serves the premises","guide":"Walk the roof. Measure pathway widths, check handrails, isolators, labels and cable protection. Record DC cables lying loose on the roof.","method":"V, M","sev":3,"rule":["solar"],"area":"ROF","weight":3},{"id":"P-56","sec":"P","req":"Solar PV protection and earthing: inverter frame earthed to the earth bus by flexible braided copper; all array structures, enclosures and equipment earthed, with earth strips welded (not bolted) and interconnected earth pits; lightning arresters; surge protective devices with arc-extinguishing capability in every combiner box; over-current protection on combiner inputs and isolation on outputs; earth fault and insulation monitoring; fire detection and automatic suppression per standards.","ref":"[CEA Safety Regs 2023, Reg. 121(2) to (4)]","type":"Mandatory (shall)","app":"Where a solar PV installation serves the premises","guide":"Inspect earthing and SPDs; obtain the solar commissioning and earth test reports. Rusted or bolted earth strips are NC.","method":"V, D","sev":4,"rule":["solar"],"area":"EXT","weight":4},{"id":"P-57","sec":"P","req":"EV charging: each charging point on a dedicated sub-circuit with over-current protection in a switchboard; separate overload protection of input and output; socket-outlets at least 800 mm above finished ground; no extension leads, adaptors or portable socket-outlets; cable not more than 5 m to the vehicle; lightning protection; protection against reverse power flow; four-core cable for three-phase charging points; underground cables at least 1 m deep under vehicle passages.","ref":"[CEA Safety Regs 2023, Reg. 124; Reg. 125(1), (2)]","type":"Mandatory (shall)","app":"Where EV charging points are installed","guide":"Inspect each charger and its feeder. Measure socket height and cable length; check the DB for a dedicated breaker and RCD per charger.","method":"V, M","sev":4,"rule":["ev"],"area":"ROF","weight":4},{"id":"P-58","sec":"P","req":"EV charging: earth continuity monitoring that disconnects supply if the vehicle earth connection fails; protective earth conductor to the vehicle; charging lead with earthed metal shielding; enclosure of fire-retardant, self-extinguishing, halogen-free material; fire detection and alarm; RCD and charger tests as per the manufacturer; records of design, test certificates and inspections kept for at least seven years.","ref":"[CEA Safety Regs 2023, Reg. 125(3) to (5); Reg. 126; Reg. 127; Reg. 128]","type":"Mandatory (shall)","app":"Where EV charging points are installed","guide":"Check the charger data sheet for earth continuity monitoring, the RCD test record, fire detection coverage of the charging bay and the records file.","method":"D, T","sev":4,"rule":["ev"],"area":"ROF","weight":4}],"profile":[{"label":"Building / premises name","example":"Orchid Business Park, Tower B","why":"Report identification"},{"label":"Address","example":"Plot 14, Sector 62, Noida","why":"Report identification"},{"label":"Owner / occupier","example":"Orchid Realty Pvt Ltd","why":"Report identification"},{"label":"Audit date(s)","example":"12 to 14 Jan 2027","why":"Report identification"},{"label":"Lead auditor and team","example":"S. Kumar (Lead), R. Iyer","why":"Report identification"},{"label":"Client representative(s)","example":"A. Sharma, Facility Manager","why":"Report identification"},{"label":"Occupancy group and subdivision","example":"Group E, Subdivision E-1 (offices)","why":"Cl. 3.1; sets Table 3, 4, 5 and 7 values, stair width, compartment size"},{"label":"Mixed occupancy? (list groups)","example":"Yes: E-1 with F-1 retail at ground","why":"Cl. 3.1.11: most restrictive provisions and 240 min separation"},{"label":"Building height (m)","example":"42","why":"High rise at 15 m and above; refuge area above 24 m; Table 6 bands at 15 m and 30 m; Fire Officer thresholds (Cl. 4.10.1)"},{"label":"Number of floors above ground","example":"11","why":"Staircase and riser checks"},{"label":"Number of basements and their use","example":"2 (car parking, plant rooms)","why":"Cl. 4.2.19, 4.6.2; Table 7 Notes 4 to 6; Annex H"},{"label":"Largest floor area (m2)","example":"2400","why":"Applicability under Cl. 1.2 (500 m2); compartmentation (Cl. 4.5.2); Table 7 rows"},{"label":"Total covered area (m2)","example"   help() {
    return `<div class="card prose"><h3>Workflow</h3><ol><li><b>Audit Administrator</b> imports or selects a checklist version and creates the audit, naming the lead auditor and team.</li><li><b>Auditor</b> fills the building profile, then answers each question: response (C, PC, NC, N/A, NV), observation, severity and likelihood, recommendation, photographs.</li><li>The dashboard recalculates compliance, rating and risk profile after every answer.</li><li>Auditor submits. Responses lock. A <b>Reviewer</b> may approve or return the audit; approval is not needed to generate reports.</li><li>Word and Excel audit reports are downloaded from the Reports tab.</li><li>After submission, corrective actions are tracked under Closure and verified; closure reports are downloaded in Word and Excel.</li></ol>
      <h3>Sign-in</h3><p>The audit application is for Audit Administrators, Auditors, Reviewers and Management. The <b>Admin console</b> ("Administrator sign-in" on the sign-in page, or <code>Admin_Console.html</code>) is for the System Administrator and Audit Administrators: dashboard of all audits, users, checklists, scoring settings and backup. Sessions end after ${IDLE_MIN} minutes without activity.</p><h3>Audit programmes and the walk-through</h3><p>Each audit uses a <b>programme</b>: a client's own KPI set (for example the Decathlon sample, which links each KPI to library requirements) or the full requirement library (NBC 2016, IS standards and CEA 2023). After creating an audit, answer the <b>scoping</b> questions about the building; requirements that cannot apply are set aside as N/A with the reason. The <b>walk-through</b> groups questions by site area, so the auditor answers what is in front of them; switch to KPI group or section at any time. Tap C on a card to record compliance in one step; other answers open the full question. <b>Measurement</b> questions take readings and set the status from the benchmark.</p><h3>Two separate measures</h3><p><b>Compliance score</b> = Σ(credit × question weight) ÷ Σ(weight) over questions marked C, PC or NC. N/A and Not verified questions are outside it. The overall rating comes from this score alone.</p><p><b>Risk score</b> = Severity × Likelihood for every applicable question, whatever its compliance response. Severity is pre-filled from the checklist and can be changed; likelihood is the auditor's judgement. A compliant question can carry a high risk rating, and a non-compliant one a low rating. Action timelines apply only to findings (NC or PC).</p>
      <h3>Pilot limits</h3><ul><li>Data stays in this browser on this device. There is no server and no automatic backup; the System Administrator takes backups in the Admin console.</li><li>Sign-in controls who can do what in the application. The stored data is not encrypted, so protect the device itself with a screen lock.</li><li>Several auditors work on separate devices and combine their work with the audit package export and merge.</li></ul></div>`;
  }
};
