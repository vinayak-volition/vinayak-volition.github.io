/* ---------- actions ---------- */
Object.assign(ACT, {
  login() {
    if (S.lockUntil && Date.now() < S.lockUntil) { S.loginErr = 'Too many failed attempts. Try again in ' + Math.ceil((S.lockUntil - Date.now()) / 1000) + ' seconds.'; return rerender(); }
    S.loginUser = $v('li-user').trim(); const un = S.loginUser.toLowerCase(), pw = $v('li-pw'), u = S.users.find(x => (x.username || '').toLowerCase() === un), ok = checkPw(u, pw);
    if (!ok || u.active === false) {
      if (!ok) { S.fails = (S.fails || 0) + 1; if (S.fails >= 5) { S.fails = 0; S.lockUntil = Date.now() + 60000; } }
      S.loginErr = ok ? 'This account is deactivated. Contact the System Administrator.' : 'Incorrect username or password.'; return rerender();
    }
    if (!roleAllowed(u, S.mode)) { S.loginErr = S.mode === 'admin' ? 'Your role (' + ROLES[u.role] + ') signs in to the audit application, not the Admin console.' : 'System Administrators sign in to the Admin console. Use "Administrator sign-in" below.'; return rerender(); }
    signIn(u);
  },
  async setup() {
    if (!needsSetup()) return signOut(true);
    const name = $v('su-name').trim(), un = $v('su-user').trim(), p1 = $v('su-pw'), p2 = $v('su-pw2');
    let u = S.users.find(x => x.role === 'sysadmin' && !x.hash);
    const err = !name || !un ? 'Enter your full name and a username.' : /\s/.test(un) ? 'The username cannot contain spaces.' : S.users.some(x => x !== u && x.username.toLowerCase() === un.toLowerCase()) ? 'That username is already in use.' : pwProblem(p1) || (p1 !== p2 ? 'The two passwords do not match.' : '');
    if (err) { S.loginErr = err; S.setupDraft = { name, un }; return rerender(); }
    if (!u) { u = { id: uid(), role: 'sysadmin', createdAt: new Date().toISOString() }; S.users.push(u); }
    Object.assign(u, { name, username: un, active: true, mustChange: false }); setPassword(u, p1); S.setupDraft = null;
    await saveUsers(); S.user = u; await actLog('System Administrator account created', un); signIn(u);
  },
  async changePw() {
    const u = S.user, cur = $v('pc-cur'), p1 = $v('pc-new'), p2 = $v('pc-new2');
    const err = !checkPw(u, cur) ? 'The current password is not correct.' : pwProblem(p1) || (p1 !== p2 ? 'The two new passwords do not match.' : '') || (p1 === cur ? 'Choose a password different from the current one.' : '');
    if (err) { S.loginErr = err; return rerender(); }
    setPassword(u, p1); u.mustChange = false; await saveUsers(); await actLog('Password changed'); toast('Password changed'); go({ v: homeView() }, true);
  },
  signOut() { signOut(); },
  switchMode() { const target = S.mode === 'admin' ? '' : 'admin'; signOut(); location.hash = target; },
  newUser() { S.form = { kind: 'user', id: null, name: '', username: '', role: 'auditor', active: true, pw: '', mustChange: true }; go({ v: 'user' }); },
  editUser(d) { const u = S.users.find(x => x.id === d.id); if (!u) return; S.form = { kind: 'user', id: u.id, name: u.name, username: u.username, role: u.role, active: u.active !== false, pw: '', mustChange: !!u.mustChange }; go({ v: 'user', id: u.id }); },
  async saveUser() {
    if (!can('users')) return;
    const f = S.form, isNew = !f.id, un = String(f.username || '').trim(), name = String(f.name || '').trim(), old = isNew ? null : S.users.find(x => x.id === f.id);
    let err = !name || !un ? 'Enter the full name and a username.' : /\s/.test(un) ? 'The username cannot contain spaces.'
      : S.users.some(u => u.id !== f.id && u.username.toLowerCase() === un.toLowerCase()) ? 'That username is already in use.'
        : S.users.some(u => u.id !== f.id && u.name.trim().toLowerCase() === name.toLowerCase()) ? 'Another user already has this name. Names must be unique because audits are assigned by name.'
          : (isNew || f.pw) ? pwProblem(f.pw) : '';
    if (!err && old && old.role === 'sysadmin' && old.hash && old.active !== false && (f.role !== 'sysadmin' || !f.active) && activeAdmins() <= 1) err = 'At least one active System Administrator is needed.';
    if (err) { S.loginErr = err; return rerender(); }
    const u = old || { id: uid(), createdAt: new Date().toISOString(), createdBy: S.user.name }, renamed = old && old.name !== name;
    Object.assign(u, { name, username: un, role: f.role, active: !!f.active, mustChange: !!f.mustChange }); if (f.pw) setPassword(u, f.pw);
    if (isNew) S.users.push(u);
    await saveUsers(); await actLog(isNew ? 'User created' : 'User updated', name + ' (' + un + '), ' + ROLES[u.role] + (f.pw && !isNew ? '; password reset' : '') + (u.active ? '' : '; deactivated') + (renamed ? '; renamed from ' + old.name : ''));
    S.form = null; toast(isNew ? 'User created' : 'Changes saved'); go({ v: 'users' }, true);
  },
  delUser(d) {
    const u = S.users.find(x => x.id === d.id); if (!u || u.id === S.user.id) return;
    const n = S.audits.filter(a => a.lead === u.name || (a.team || []).includes(u.name)).length;
    if (n) return toast(u.name + ' is named on ' + n + ' audit(s). Deactivate the account instead of deleting it.');
    if (u.role === 'sysadmin' && u.hash && u.active !== false && activeAdmins() <= 1) return toast('At least one active System Administrator is needed.');
    ask({ title: 'Delete user ' + u.name + '?', msg: 'The account is removed. This cannot be undone.', okLabel: 'Delete', danger: 1, ok: async () => { S.users = S.users.filter(x => x.id !== u.id); await saveUsers(); await actLog('User deleted', u.name + ' (' + u.username + ')'); S.form = null; go({ v: 'users' }, true); } });
  },
  regFilter(d) { S.reg.f = d.f; rerender(); },
  async regReport(d) { const a = S.audits.find(x => x.id === d.id); if (!a) return; try { await reportFor(a, d.k); toast('Report downloaded'); } catch (e) { console.error(e); toast('Report failed: ' + e.message); } },
  regExport() { download(registerXlsx(regList()), 'Audit_Register_' + todayISO() + '.xlsx', MIME_XLSX); }
});

/* ---------- v0.3: library + programmes, scoping, site walk-through, quick answer, measurements ---------- */
let AREAS = [], AREA_NAME = {};
const FACTS = [
  ['Building', [['height', 'Building height (m)', 'num'], ['basements', 'Number of basements', 'num'], ['atr', 'Atrium'], ['glass', 'Glass facade / curtain wall'], ['park', 'Car parking'], ['bpark', 'Basement car parking'], ['epark', 'Enclosed (above-ground) car parking'], ['opark', 'Stilt / open car parking'], ['clift', 'Car lifts']]],
  ['Fire protection systems', [['spk', 'Sprinklers (full or partial)'], ['fa', 'Automatic fire alarm / detection'], ['hyd', 'Internal hydrants, wet risers or hose reels'], ['yard', 'Yard (external) hydrants'], ['pump', 'Fire pumps on the premises'], ['dpump', 'Diesel fire pump'], ['tank', 'Fire water tank on the premises'], ['prs', 'Staircase / lobby pressurization'], ['fcc', 'Fire command centre']]],
  ['Building services', [['ac', 'Air-conditioned premises (any system)'], ['cac', 'Central air conditioning (AHUs / ducted)'], ['lift', 'Passenger lifts'], ['esc', 'Escalators / moving walks'], ['kit', 'Commercial kitchen'], ['gas', 'Piped gas or LPG'], ['boil', 'Boilers']]],
  ['Electrical supply', [['kw', 'Connected load (kW)', 'num'], ['dg', 'DG set(s) serving the premises'], ['sub', 'Substation / HT switch room on the premises'], ['tin', 'Transformer(s) inside the building'], ['hv', 'HV (above 650 V) installation owned by the occupier'], ['oil', 'Oil-filled transformer / switchgear'], ['ups', 'UPS, battery bank or IT loads'], ['solar', 'Solar PV'], ['ev', 'EV charging points']]]
];
const FACT = {}; FACTS.forEach(g => g[1].forEach(f => FACT[f[0]] = { k: f[0], label: f[1], num: f[2] === 'num' }));
function factOf(key) { const m = /^h(\d+)$/.exec(key); return m ? 'height' : key === 'bas' ? 'basements' : key === 'kw250' ? 'kw' : key; }
function evalKey(key, F) {
  if (key.includes('/')) { const r = key.split('/').map(k => evalKey(k, F)); return r.some(x => x.ok === true) ? { ok: true } : r.every(x => x.ok === false) ? { ok: false, why: r.map(x => x.why).join(' and ') } : { ok: null }; }
  const m = /^h(\d+)$/.exec(key), num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
  if (m) { const h = num(F.height); return h == null ? { ok: null } : h >= +m[1] ? { ok: true } : { ok: false, why: 'building height ' + h + ' m is below ' + m[1] + ' m' }; }
  if (key === 'bas') { const b = num(F.basements); return b == null ? { ok: null } : b > 0 ? { ok: true } : { ok: false, why: 'no basement' }; }
  if (key === 'kw250') { const k = num(F.kw); return k == null ? { ok: null } : k > 250 ? { ok: true } : { ok: false, why: 'connected load ' + k + ' kW is not above 250 kW' }; }
  const v = F[key]; if (v === 'Y') return { ok: true }; if (v === 'N') return { ok: false, why: 'no ' + ((FACT[key] || {}).label || key).toLowerCase() }; return { ok: null };
}
function scopeOf(it, F) { if (!it.rule || !it.rule.length || !F) return { ok: true }; const why = []; for (const k of it.rule) { const r = evalKey(k, F); if (r.ok === false) why.push(r.why); } return why.length ? { ok: false, why: why.join('; ') } : { ok: true }; }
function applyScope(a, tpl) {
  let out = 0, back = 0; const at = new Date().toISOString();
  tpl.items.forEach(it => {
    const s = scopeOf(it, a.facts), r = a.resp[it.id];
    if (!s.ok) { if (!r || !r.st || r.scoped) { a.resp[it.id] = { st: 'NA', naJust: 'Out of scope (building profile): ' + s.why + '.', scoped: true, by: S.user.name, at }; out++; } }
    else if (r && r.scoped) { delete a.resp[it.id]; back++; }
  });
  a.scopedAt = at; return { out, back };
}
function scopedCount(a, tpl) { return tpl.items.filter(it => (a.resp[it.id] || {}).scoped).length; }
function factUse(tpl) { const u = {}; tpl.items.forEach(it => (it.rule || []).forEach(k => k.split('/').forEach(x => { const f = factOf(x); u[f] = (u[f] || 0) + 1; }))); return u; }

/* measurements */
function measOne(m, v) {
  if (v === '' || v == null || isNaN(+v)) return null; v = +v;
  const has = x => x != null && x !== '';
  if (!has(m.lo) && !has(m.hi)) return null;
  if ((!has(m.lo) || v >= +m.lo) && (!has(m.hi) || v <= +m.hi)) return 'C';
  if ((has(m.pcLo) || has(m.pcHi)) && (!has(m.pcLo) || v >= +m.pcLo) && (!has(m.pcHi) || v <= +m.pcHi)) return 'PC';
  return 'NC';
}
function measResult(it, r) { if (!it.meas) return null; const res = (r.vals || []).map(x => measOne(it.meas, x.v)).filter(Boolean); if (!res.length) return null; return res.includes('NC') ? 'NC' : res.includes('PC') ? 'PC' : 'C'; }
function valsText(it, r) { if (!it.meas || !r || !(r.vals || []).length) return ''; return r.vals.filter(x => x.v !== '' && x.v != null).map(x => (x.l ? x.l + ': ' : '') + x.v + (it.meas.unit ? ' ' + it.meas.unit : '')).join('; '); }
function measSync(it, r) {
  const st = measResult(it, r); if (!st || r.stManual) return;
  r.st = st; delete r.scoped; delete r.naJust;
  if (st === 'C' && !r.lik) { r.lik = S.audit.cfg.quickLik || 1; r.likAuto = true; }
}

/* grouping by site area or by section / KPI group */
function areaOf(it) { return it.area && AREA_NAME[it.area] ? it.area : 'OTH'; }
function groupList(tpl, by) {
  if (by === 'area') { const used = new Set(tpl.items.map(areaOf)); return AREAS.filter(x => used.has(x.id)).concat(used.has('OTH') ? [{ id: 'OTH', name: 'Other / not assigned' }] : []); }
  return tpl.sections;
}
function inGroup(it, by, g) { return by === 'area' ? areaOf(it) === g : it.sec === g; }
function groupStats(a, tpl, k, by) {
  return groupList(tpl, by).map(g => {
    const its = tpl.items.filter(it => inGroup(it, by, g.id)), o = { id: g.id, name: g.name, items: its.length, scoped: 0, live: 0, answered: 0, find: 0, num: 0, den: 0, counts: { C: 0, PC: 0, NC: 0, NA: 0, NV: 0, none: 0 } };
    its.forEach(it => { const r = a.resp[it.id] || {}, p = k.per[it.id]; o.counts[r.st || 'none']++; if (r.scoped) { o.scoped++; return; } o.live++; if (r.st) o.answered++; if (r.st === 'NC' || r.st === 'PC') o.find++; if (p.credit != null) { o.num += p.weighted; o.den += p.weight; } });
    o.score = o.den ? o.num / o.den * 100 : null; return o;
  });
}
const byLabel = tpl => tpl.client ? 'KPI group' : 'Section';

function walkIndex() {

  const base = _tqView(r), t = S.templates.find(x => x.id === r.t), it = t && t.items.find(x => x.id === r.q); if (!it) return base;
  const ed = !tplUsed(t.id), m = it.meas, a = (s, f, extra) => `data-scope="${s}" data-t="${t.id}" data-q="${esc(it.id)}" data-f="${f}" ${extra || ''}${dis(ed)}`;
  const extra = `<div class="card"><h3>Walk-through and scoping</h3>${it.libRef ? `<p class="small">Library requirement: <b>${esc(it.libRef)}</b></p>` : ''}${it.kpi ? `<p class="small">Client KPI: ${esc(it.kpi)}</p>` : ''}
    ${fld('Site area', `<select ${a('tq', 'area')}>${AREAS.map(x => `<option value="${x.id}"${it.area === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>`)}
    ${fld('Applies when (scoping codes, joined with +)', `<input ${a('tqr', 'rule')} value="${esc((it.rule || []).join(' + '))}">`, 'Blank = always applies. Codes: h15, h24, h60, bas, kw250, ' + Object.values(FACT).filter(f => !f.num).map(f => f.k).join(', ') + '.')}
    <label class="check"><input type="checkbox" ${a('tqm', 'on', 'data-rr')}${m ? ' checked' : ''}> Measurement question (numeric reading)</label>
    ${m ? `<div class="two">${fld('Unit', `<input ${a('tqm', 'unit')} value="${esc(m.unit)}">`)}<label class="check"><input type="checkbox" ${a('tqm', 'multi')}${m.multi ? ' checked' : ''}> Several readings</label></div><div class="two">${fld('Compliant min', `<input type="number" step="any" ${a('tqm', 'lo')} value="${m.lo ?? ''}">`)}${fld('Compliant max', `<input type="number" step="any" ${a('tqm', 'hi')} value="${m.hi ?? ''}">`)}</div><div class="two">${fld('Partially compliant min', `<input type="number" step="any" ${a('tqm', 'pcLo')} value="${m.pcLo ?? ''}">`)}${fld('Partially compliant max', `<input type="number" step="any" ${a('tqm', 'pcHi')} value="${m.pcHi ?? ''}">`)}</div>${fld('Benchmark text', `<input ${a('tqm', 'bench')} value="${esc(m.bench)}">`)}` : ''}</div>`;
  return base.replace(/(<button class="btn danger" data-act="tqDel"[^>]*>Delete question<\/button>)?<\/div>$/, (mm, del) => '</div>' + extra + (del ? `<button class="btn danger wide" data-act="tqDel" data-t="${t.id}" data-q="${esc(it.id)}">Delete question</button>` : ''));
};
Object.assign(ACT, {
  newProg() { S.form = { kind: 'prog', name: '', client: '', version: 'P1', secs: [], rows: null, fileName: '' }; go({ v: 'pnew' }); },
  kpiTemplate() { download(kpiTemplateXlsx(), 'Client_KPI_Template.xlsx', MIME_XLSX); },
  async createProg() {
    const f = S.form, lib = libTpl(); if (!f.name.trim()) { S.loginErr = 'Enter a programme name.'; return rerender(); }
    if (!(f.rows && f.rows.length) && !f.secs.length) { S.loginErr = 'Choose a client KPI file, library sections, or both.'; return rerender(); }
    const { tpl, warn } = buildProgramme(lib, f.rows || [], { name: f.name.trim(), client: f.client.trim(), version: f.version.trim() || 'P1', source: (f.fileName ? f.fileName + ' + ' : '') + 'library ' + lib.version }, f.secs);
    tpl.active = false; S.templates.push(tpl); await DB.put('templates', tpl); await actLog('Programme created', tpl.name + ': ' + tpl.items.length + ' questions');
    S.form = null; go({ v: 'tpl', t: tpl.id }, true); toast(tpl.items.length + ' questions in ' + tpl.sections.length + ' groups' + (warn.length ? '. Unknown library refs ignored: ' + warn.join(', ') : '') + '. Review, then activate.');
  }
});
async function onKpiFile(file) {
  const rows = kpiRowsFromSheets(await readXlsx(new Uint8Array(await readFile(file))));
  S.form.rows = rows; S.form.fileName = file.name; if (!S.form.name) S.form.name = file.name.replace(/\.xlsx$/i, '').replace(/_/g, ' '); rerender();
}


boot(JSON.parse(document.getElementById('tpl-data').textContent)).catch(function(e){console.error(e);document.getElementById('app').innerHTML='<p style="padding:24px">The application could not start: '+String(e&&e.message||e)+'</p>';});
</script>
