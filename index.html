d":"G-07","sec":"G","req":"All metallic items such as steel structural members are bonded to the earthing system.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.1]","type":"Mandatory (shall)","app":"All","guide":"Cross-refer to the electrical safety audit (earth continuity tests).","method":"V, T","sev":3,"rule":[],"area":"ELR","weight":3},{"id":"G-08","sec":"G","req":"Emergency system circuits are protected at origin by an automatic circuit breaker with its no-volt coil removed, and master switches controlling essential service circuits are clearly labelled.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.1]","type":"Mandatory (shall)","app":"All","guide":"Check at the main and emergency panels.","method":"V","sev":3,"rule":[],"area":"ELR","weight":3},{"id":"G-09","sec":"G","req":"Normal and emergency (standby generator) power with changeover is provided to: fire pumps; pressurization and smoke venting; fireman's lifts (including all lifts); exit signage; emergency lighting; fire alarm; PA system; magnetic door hold-open devices; fire command centre and security room lighting.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.2]","type":"Mandatory (shall)","app":"Where these systems are provided","guide":"Trace each system on the single line diagram. Witness a changeover test where possible. The generator may be waived by the Authority where a parallel supply from a separate substation on a different grid is provided.","method":"D, T","sev":5,"rule":[],"area":"ELR","weight":5},{"id":"G-10","sec":"G","req":"The generator is capable of taking the starting current of all fire and life safety systems and equipment.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.2]","type":"Mandatory (shall)","app":"Where a standby generator is provided","guide":"Review the load calculation; check loads added since design.","method":"D","sev":4,"rule":["dg"],"area":"DOC","weight":4},{"id":"G-11","sec":"G","req":"Power to fire and life safety panels is through fire proof enclosures, circuit integrity cables or an alternate route through the adjoining fire compartment, and the panels are in a fire safe zone.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.2]","type":"Mandatory (shall)","app":"Where these systems are provided","guide":"Check cable type and routing from the essential panel to the fire pump, lift, pressurization and alarm panels.","method":"D, V","sev":4,"rule":[],"area":"ELR","weight":4},{"id":"G-12","sec":"G","req":"Substation areas are not used for storage or any other utility purpose.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.3; CEA Safety Regs 2023, Reg. 51(i)]","type":"Mandatory (shall)","app":"Where a substation is provided","guide":"The substation should be adequately ventilated (recommendation).","method":"V","sev":3,"rule":["sub"],"area":"SUB","weight":3},{"id":"G-13","sec":"G","req":"An independent ventilated or air conditioned MV panel room is provided at ground level or first basement, with access from outside and 120 min fire resistant walls and doors.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.3]","type":"Mandatory (shall)","app":"Where an MV panel room is provided","guide":"Visual check; door label.","method":"V","sev":3,"rule":[],"area":"ELR","weight":3},{"id":"G-14","sec":"G","req":"Electrical MV main distribution panel and lift panels have CO2/inert gas flooding for all panel compartments, with a cylinder beside the panel.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.3]","type":"Mandatory (shall)","app":"All","guide":"Check cylinder pressure/weight, discharge tubing into each compartment and service tags.","method":"V","sev":3,"rule":[],"area":"ELR","weight":3},{"id":"G-15","sec":"G","req":"Meter rooms on upper floors do not open into staircase enclosures.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.3; CEA Safety Regs 2023, Reg. 38(3)(viii)]","type":"Mandatory (shall)","app":"Where meter rooms are on upper floors","guide":"They should be ventilated directly to open air or located in an electrical room with 120 min walls (recommendation). CEA Reg. 38(3)(viii) adds that the electricity meter is not installed in the passage of a staircase.","method":"V","sev":3,"rule":[],"area":"ELR","weight":3},{"id":"G-16","sec":"G","req":"Oil filled substation equipment is in a utility building or outdoors, at least 7 m from adjoining buildings; equipment exceeding 2 000 litre oil has 240 min baffle walls; transformers exceeding 10 MVA have high velocity water spray or nitrogen injection.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.3.1, 5.1.4 [IS 15325; CEA Safety Regs 2023, Reg. 46(2)(vi), (vii), (ix)]","type":"Mandatory (shall)","app":"Where oil filled equipment is installed","guide":"Baffle walls extend at least 600 mm above the equipment (including conservator) and 300 mm beyond each side. Measure.","method":"V, M","sev":4,"rule":["oil"],"area":"SUB","weight":4},{"id":"G-17","sec":"G","req":"Transformers inside the building are dry type, in a substation/switch room with 120 min fire resistance to walls, ceiling, floor and doors, with access from the nearest fire exit or exit staircase.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.3.2; CEA Safety Regs 2023, Reg. 46(2)(x), (xii)]","type":"Mandatory (shall)","app":"Where transformers are inside the building","guide":"Check nameplate and enclosure. CEA Reg. 46(2)(xii) also requires dry type transformers only inside residential and commercial buildings; for basement substations CEA Reg. 46(2)(x) requires 4 h walls (see P-45 and Ambiguities).","method":"V","sev":4,"rule":["tin"],"area":"SUB","weight":4},{"id":"G-18","sec":"G","req":"Diesel generator sets are installed only at ground floor or first basement, in a room separated by 120 min fire rated walls and doors, with ventilation and exhaust planned.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.4]","type":"Mandatory (shall)","app":"Where DG sets are provided","guide":"Visual check; door label; exhaust routing.","method":"V","sev":4,"rule":["dg"],"area":"DGS","weight":4},{"id":"G-19","sec":"G","req":"The DG oil tank (if not in the base of the DG) has a dyked enclosure of at least 10 percent more than the tank volume, filled with sand to a height of 300 mm.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.4]","type":"Mandatory (shall)","app":"Where a separate DG fuel tank is provided","guide":"Measure the dyke; check for stored oil drums outside the dyke. The Petroleum Act, 1934 and Rules (not in project files) apply to petroleum storage.","method":"V, M","sev":3,"rule":["dg"],"area":"DGS","weight":3},{"id":"G-20","sec":"G","req":"Lightning protection down conductors are not routed through electrical or other service shafts.","ref":"[NBC 2016, Part 4, Cl. 3.4.6.5]","type":"Mandatory (shall)","app":"All","guide":"Trace down conductors from roof to earth pits.","method":"V","sev":3,"rule":[],"area":"EXT","weight":3},{"id":"G-21","sec":"G","req":"Where transformers are at higher floors, HT cables are routed through a separate shaft with its own 120 min fire resistance rating.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-5]","type":"Mandatory (shall)","app":"High rise (15 m and above) with transformers at upper floors","guide":"E-5 also requires compliance with Part 8 Section 2 and Section 7 of the National Electrical Code 2011 (NEC is not in the project files).","method":"D, V","sev":3,"rule":["h15","tin"],"area":"SUB","weight":3},{"id":"H-01","sec":"H","req":"Manually operated electronic fire alarm and automatic detection and alarm systems are provided as required by Table 7 for the occupancy, height and area.","ref":"[NBC 2016, Part 4, Cl. 4.9(a), 5.1.1, Table 7 (cols 9 and 10)]","type":"Mandatory (shall)","app":"As per Table 7","guide":"Identify the applicable row of Table 7 for the building and record 'R' / 'NR' for each system in the report. Check coverage on every floor, including plant rooms, stores and above deep false ceilings.","method":"D, V","sev":5,"rule":[],"area":"FAA","weight":5},{"id":"H-02","sec":"H","req":"The fire detection system is in accordance with accepted standards, and detector selection, installation and maintenance follow good practice.","ref":"[NBC 2016, Part 4, Cl. 4.9(g); IS 2189 : 2008; IS 2175, IS 11360, IS/ISO 7240]","type":"Mandatory (shall)","app":"Where detection is provided","guide":"Verify detector selection, zoning, siting, wiring and maintenance against IS 2189 : 2008 using items H-14 to H-25. Review the design, as-built drawings and commissioning certificate; every detector is to be tested after installation (IS 2189, Cl. 7.2).","method":"D","sev":4,"rule":["fa"],"area":"DOC","weight":4},{"id":"H-03","sec":"H","req":"The alarm system includes talk-back and public address systems where required.","ref":"[NBC 2016, Part 4, Table 7, Note 1]","type":"Mandatory (shall)","app":"Occupancies listed in Note 1; all buildings 15 m and above (24 m and above for A-3 and A-4); car parking over 300 m2 and multi-level car parking","guide":"Test talk-back from a sample of floors to the fire command centre, and PA audibility on each floor.","method":"T","sev":4,"rule":[],"area":"FAA","weight":4},{"id":"H-04","sec":"H","req":"Voice evacuation uses pre-recorded messages in Hindi, English and the vernacular language and is integrated with the fire alarm panels to alert the fire zone and surrounding zones.","ref":"[NBC 2016, Part 4, Cl. 4.9(c)]","type":"Mandatory (shall)","app":"Where voice evacuation is provided","guide":"Trigger a test message; check intelligibility and zoning.","method":"T","sev":3,"rule":[],"area":"FAA","weight":3},{"id":"H-05","sec":"H","req":"Visual strobes/beacons are provided for persons with hearing impairment.","ref":"[NBC 2016, Part 4, Cl. 4.9(d)]","type":"Advisory (may / desirable)","app":"Public buildings","guide":"Advisory ('may be considered'). Record where provided and working.","method":"V","sev":2,"rule":[],"area":"FAA","weight":2},{"id":"H-06","sec":"H","req":"Detectors are provided inside electrical shafts and lift machine rooms in addition to occupancy areas.","ref":"[NBC 2016, Part 4, Cl. 4.9(e)]","type":"Mandatory (shall)","app":"Assembly and institutional buildings; all buildings above 30 m with fire alarm per Table 7","guide":"Open sample shafts and check.","method":"V","sev":3,"rule":[],"area":"LFT","weight":3},{"id":"H-07","sec":"H","req":"Fire alarm panels are connected in a peer to peer network or by redundant cables run in different shafts, and each panel can work in standalone mode.","ref":"[NBC 2016, Part 4, Cl. 4.9(f)]","type":"Mandatory (shall)","app":"Multi-panel systems","guide":"Review the network architecture drawing; simulate a network break if the maintainer agrees.","method":"D, T","sev":3,"rule":[],"area":"FAA","weight":3},{"id":"H-08","sec":"H","req":"The fire alarm panel monitors water level in all tanks, hydrant and sprinkler pressures, pump ON/OFF status and all isolation valves fitted with supervisory switches.","ref":"[NBC 2016, Part 4, Cl. 4.9(h)]","type":"Mandatory (shall)","app":"Buildings with automatic fire alarm","guide":"Check each signal on the panel or graphics; operate a supervised valve and confirm the signal.","method":"T","sev":4,"rule":["fa"],"area":"FAA","weight":4},{"id":"H-09","sec":"H","req":"The fire alarm system operates the interfaced systems: air handling units, pressurization, smoke management, fire dampers, release of hold-open fire doors, access control release and lift grounding.","ref":"[NBC 2016, Part 4, Cl. 4.9(b), 4.4.2.4.1(g); NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(h), (j)]","type":"Mandatory (shall)","app":"Where these systems are provided","guide":"Obtain the cause and effect matrix and witness a test of each interface. Cl. 4.9(b) says the systems 'may include' these items; individual interfaces are mandatory under their own clauses.","method":"D, T","sev":4,"rule":[],"area":"LFT","weight":4},{"id":"H-10","sec":"H","req":"The fire panel is checked every day for normal operation, faults are logged with corrective action, and the control panel is manned regularly.","ref":"[NBC 2016, Part 12, Cl. 15.8]","type":"Mandatory (shall)","app":"Where a fire alarm panel is provided","guide":"Look at the panel now: record standing faults, disabled zones or devices and silenced sounders. Review the daily log for the last month.","method":"V, D","sev":4,"rule":["fa"],"area":"FAA","weight":4},{"id":"H-11","sec":"H","req":"Fire detection systems are maintained in accordance with good practice, and no detector is painted, covered or altered during fit-out or refurbishment.","ref":"[NBC 2016, Part 12, Cl. 15.6; IS 2189 : 2008, Cl. 6.3.2, 7.4.5(f), 7.6]","type":"Mandatory (shall)","app":"Where detection is provided","guide":"Look for painted detectors, dust covers left on, detectors removed for interior work, and detectors blocked by partitions or storage. IS 2189 prohibits painting or altering detectors and requires a clear space of 500 mm below each detector (Cl. 6.3.2); the quarterly check uses a 750 mm radius (Cl. 7.4.5(f)); see Ambiguities. Heavily painted detectors are to be replaced.","method":"V, D","sev":3,"rule":["fa"],"area":"FAA","weight":3},{"id":"H-12","sec":"H","req":"A log book records all alarms (genuine, test or false), faults, service tests, routine inspections and periods of disconnection.","ref":"[NBC 2016, Part 12, Cl. 15.7]","type":"Recommended (should)","app":"Where a fire alarm system is provided","guide":"Recommendation ('should'). Review false alarm frequency and causes.","method":"D","sev":2,"rule":["fa"],"area":"DOC","weight":2},{"id":"H-13","sec":"H","req":"In car parking areas, detection is provided in electrical rooms, cabins and other areas even where not required in the parking area itself.","ref":"[NBC 2016, Part 4, Table 7, Note 2]","type":"Mandatory (shall)","app":"Buildings with car parking","guide":"Visual check.","method":"V","sev":3,"rule":["park"],"area":"FAA","weight":3},{"id":"H-14","sec":"H","req":"Manual call points are located so that no person travels more than 30 m (45 m outside the building) to reach one, preferably near staircase entries on each level, at 1.4 m above floor, conspicuous, well lit and unobstructed.","ref":"[NBC 2016, Part 4, Cl. 4.9(a); IS 2189 : 2008, Cl. 6.3.8]","type":"Mandatory (shall)","app":"Where a fire alarm system is provided","guide":"Measure travel to the nearest call point on sampled floors; reduce the distance where access is difficult or the risk is high. In long corridors call points are surface or semi-recessed to show a side profile of at least 750 mm2. Break-glass: glass area at least 30 cm2, not more than 2 mm thick, in a dust and moisture-proof enclosure. Operate a sample (auditor benchmark: at least one per zone on sampled floors); the alarm must sound on the floor and at the panel and stay latched until reset. Sounder levels: see H-15.","method":"M, V, T","sev":4,"rule":["fa"],"area":"FAA","weight":4},{"id":"H-15","sec":"H","req":"Alarm sounders produce at least 65 dB(A), or 5 dB(A) above any background noise likely to persist for more than 30 s, whichever is greater, at every occupiable point; at least 75 dB(A) at the bed-head (doors shut) where occupants sleep; and at least one sounder is provided in each fire compartment.","ref":"[NBC 2016, Part 4, Cl. 4.9(g); IS 2189 : 2008, Cl. 4.3]","type":"Recommended (should)","app":"Where a fire alarm system is provided","guide":"Measure with a sound level meter during the alarm test at worst-case points (rooms behind doors, plant rooms, toilets, noisy work areas). Sounder frequency 500 to 1 000 Hz, signal continuous. A single door attenuates more than 20 dB, so a room separated from the nearest sounder by more than one wall or door is unlikely to be satisfactory. Levels above 120 dB(A) in occupied areas may damage hearing. Many quieter sounders are preferred to a few very loud ones.","method":"M, T","sev":4,"rule":["fa"],"area":"FAA","weight":4},{"id":"H-16","sec":"H","req":"Detection zones allow a fire to be located quickly: zone floor area not more than 2 000 m2; each zone confined to one floor where the building exceeds 300 m2; search distance within a zone not more than 30 m; and zone boundaries follow fire compartment boundaries.","ref":"[NBC 2016, Part 4, Cl. 4.9(g); IS 2189 : 2008, Cl. 4.2.1, 4.2.2]","type":"Mandatory (shall)","app":"Where automatic detection is provided (zone indication is needed even on addressable systems, Cl. 4.2.1(b))","guide":"Compare the zone chart at the panel with the floor plans. Also check: detectors in enclosed stairwells, lift wells and shafts form separate zones; call points on stair landings belong to the zone of the adjoining floor; no zone covers more than one occupancy in multi-tenant buildings; no zone extends into parts of two compartments (Cl. 4.2.2, Note 2). Special risks within a large area are separate zones. Conventional zones: not more than 20 detectors per zone (Cl. 4.1.2).","method":"D, V","sev":3,"rule":["fa"],"area":"FAA","weight":3},{"id":"H-17","sec":"H","req":"Point detectors are sited so that, under flat ceilings, no point is more than 7.5 m from the nearest smoke detector or 5.3 m from the nearest heat detector, with spacing reduced for ceiling height and high air movement, and detectors kept clear of walls, beams and air inlets.","ref":"[NBC 2016, Part 4, Cl. 4.9(g); IS 2189 : 2008, Cl. 6.2, 6.3.2, 6.3.3, Tables 1 and 2]","type":"Mandatory (shall)","app":"Where automatic detection is provided","guide":"Height (Cl. 6.3.3(a)): smoke detectors at 7.5 m apply up to 7 m ceiling height, 5 m for 7 to 10 m, beam or aspirating detection only above 10 m; heat detectors at 5.3 m up to 5 m height, 3.5 m for 5 to 7 m, not permitted above 7 m. Reduce spacing per Table 2 where air changes exceed 7.5 per hour. Cross-check: at least one smoke detector per 100 m2 or heat detector per 50 m2. Siting: not within 500 mm of walls or of beams/ducts deeper than 250 mm; not within 1 m of air inlets and 1.5 m of supply diffusers; beams deeper than 10 percent of ceiling height, and racks or partitions within 300 mm of the ceiling, create separate enclosures. Sensing element 25 to 600 mm below ceiling for smoke, 25 to 150 mm for heat (Cl. 6.2).","method":"M, D","sev":4,"rule":["fa"],"area":"FAA","weight":4},{"id":"H-18","sec":"H","req":"Detectors are provided in every room and cabin (at ceiling level and in the false ceiling void where required), at the top of every stairwell, lift shaft and utility shaft, in lift machine rooms, at each main landing of unenclosed stairs, and in cable tunnels, ducts, false floors, AC and AHU rooms, long return-air ducts and distribution boards.","ref":"[NBC 2016, Part 4, Cl. 4.9(e); IS 2189 : 2008, Cl. 6.3.2]","type":"Mandatory (shall)","app":"Where automatic detection is provided","guide":"False ceiling or floor voids deeper than 800 mm need detectors at normal spacing; shallower voids only where fire products can spread between rooms through the void. Toilets and WCs need not be covered. Where a floor has several enclosed rooms, and for concealed detectors in voids, shafts and tunnels, remote response indicators are required at the entrance. A detector on the protected side 1.5 m from any opening into an unprotected area.","method":"V","sev":4,"rule":["fa"],"area":"LFT","weight":4},{"id":"H-19","sec":"H","req":"Detector types suit the risk and environment: smoke detection on escape routes and in air-conditioned, slow-burning or life-safety areas; heat detectors limited to areas where smoke, steam or dust occur in normal use (for example kitchens, pantries, DG and boiler rooms).","ref":"[IS 2189 : 2008, Cl. 5.2, 5.2.1, 5.2.2, Annex A]","type":"Mandatory (shall)","app":"Where automatic detection is provided","guide":"Cl. 5.2: the system shall have detectors suited to the conditions that give the earliest reliable warning. Cl. 5.2.1.1: heat detectors are not suitable in slow-burning or air-conditioned premises where escape routes may be smoke-logged first. EDP and computer rooms: smoke detection (5.2.2.1); archives and museums: combined heat, smoke and flame (5.2.2.2). Ionisation detectors are discouraged (Note to Cl. 3.45). Annex A is guidance. Record heat detectors on corridors, lobbies and other escape routes as a finding.","method":"V, D","sev":4,"rule":["fa"],"area":"FAA","weight":4},{"id":"H-20","sec":"H","req":"Fire alarm cables and equipment are independent of all other systems; addressable loops are wired Class A (return loop) with short-circuit isolators, and loops are not loaded beyond about 90 percent of their capacity.","ref":"[IS 2189 : 2008, Cl. 4.1, 4.2.2, 4.2.4]","type":"Mandatory (shall)","app":"Where a fire alarm system is provided","guide":"Cl. 4.2.4: loop length not more than 3 000 m with conductor of at least 1.5 mm2 (or the manufacturer's limits); not more than 8 fire zones per loop; at least two isolators per zone, preferably a pair for every 20 to 30 devices; Class B spurs only as tapping from the loop. Check riser and loop diagrams, and that no other service shares the fire alarm cables. Circuit-integrity cable requirements come from NBC (see References, IS 16246).","method":"D, V","sev":3,"rule":["fa"],"area":"FAA","weight":3},{"id":"H-21","sec":"H","req":"The control and indicating equipment is at a control centre (preferably on the ground floor) with a mimic or zone chart; a repeater or annunciator panel is provided near the main entrance where the panel is elsewhere; and every detector has an identification number recorded at the control centre.","ref":"[IS 2189 : 2008, Cl. 4.4, 4.5, 6.1]","type":"Recommended (should)","app":"Where a fire alarm system is provided","guide":"Example ID from Cl. 6.1: Z1/SDI/20 = zone 1, smoke detector (ionisation), 20th detector. Check that panel device text matches the labels on site for a sample. NBC fire command centre requirements are in Section J.","method":"V, D","sev":2,"rule":["fa"],"area":"FAA","weight":2},{"id":"H-22","sec":"H","req":"Where beam, aspirating or duct smoke detectors are used: beam paths are clear and mounted on rigid structure; aspirating air transport time from the farthest sampling point is not more than 120 s with an airflow fault signal; duct detectors are in straight runs at least three duct widths from bends or junctions.","ref":"[IS 2189 : 2008, Cl. 6.3.4, 6.3.5, 6.3.10]","type":"Mandatory (shall)","app":"Atria, warehouses, high spaces and ducts where these detectors are used","guide":"Beam detectors: no point more than 7.5 m from the beam (8.5 m under pitched roofs); supplementary beams in high spaces such as atria protect a width each side equal to 12.5 percent of beam height; beam coverage must stay within one zone. For aspirating systems, check commissioning records for transport time and the manufacturer's airflow band.","method":"D, V","sev":3,"rule":[],"area":"FAA","weight":3},{"id":"H-23","sec":"H","req":"Routine user tests are carried out and logged: daily panel check; weekly operation of at least one trigger device so that every zone is tested within 13 weeks (a different device each time); weekly visual check of batteries; quarterly inspection with fault simulation, test of alarm and ancillary functions, and a walk-round for changes affecting detector siting.","ref":"[NBC 2016, Part 12, Cl. 15.7, 15.8; IS 2189 : 2008, Cl. 7.4.2 to 7.4.5]","type":"Recommended (should)","app":"Where a fire alarm system is provided","guide":"Review the log book for the last 3 months: device used in each weekly test, zone rotation, battery remarks and follow-up of defects. The quarterly walk-round (7.4.5(f)) confirms call points unobstructed and conspicuous and a clear space of at least 750 mm radius below detectors (see Ambiguities on 500 mm versus 750 mm). Occupants to be told before tests that sound the alarm (7.4.2).","method":"D","sev":3,"rule":["fa"],"area":"DOC","weight":3},{"id":"H-24","sec":"H","req":"At each annual inspection at least 20 percent of detectors are functionally tested so that every detector is tested within 5 years; smoke detector sensitivity is checked by a calibrated method; detectors are cleaned at intervals not exceeding 3 months (or as conditions require); and the electrical installation is tested at least every 3 years.","ref":"[IS 2189 : 2008, Cl. 7.2.2 to 7.2.7, 7.4.6, 7.6, 7.7]","type":"Recommended (should)","app":"Where automatic detection is provided","guide":"Ask for the detector-wise test matrix showing which detectors were tested each year. Sensitivity cannot be measured with an unmeasured aerosol spray (Note to 7.2.7); spray tests only prove smoke entry. Detectors outside their sensitivity range are replaced (7.2.7.1). After an alarm or fire, exposed detectors are tested as for the annual inspection (7.7).","method":"D","sev":3,"rule":["fa"],"area":"DOC","weight":3},{"id":"H-25","sec":"H","req":"Servicing is arranged through a contract with a competent contractor (or a specially trained employee); hospitals, hotels and homes for the elderly have an engineer on call with emergency attendance within 24 h; and replacement detectors are fitted whenever detectors are removed for servicing.","ref":"[IS 2189 : 2008, Cl. 7.3, 7.8, 7.9]","type":"Recommended (should)","app":"Where a fire alarm system is provided","guide":"Check the maintenance contract scope, response-time clause and call-out records. Spares on site: call point covers or glasses, fuses and other essential spares (7.9).","method":"D","sev":2,"rule":["fa"],"area":"DOC","weight":2},{"id":"I-01","sec":"I","req":"Fire extinguishers are provided as required by Table 7 and good practice, mounted at a convenient height for quick access.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(a), (b), Table 7 (col 3); IS 2190 : 2024]","type":"Mandatory (shall)","app":"All","guide":"Detailed IS 2190 : 2024 checks are in I-38 to I-45 (selection, distribution, installation, inspection, maintenance, life, register). Check each extinguisher: correct type for the risk, in place, visible, unobstructed, pressure in range, seal and pin intact. Mounting height: the IS 2190 clauses on height are not legible in the copy supplied; see Ambiguities.","method":"V","sev":4,"rule":[],"area":"FFS","weight":4},{"id":"I-02","sec":"I","req":"Extinguishers are inspected, tested and refilled by competent persons, with records including hydraulic pressure tests.","ref":"[NBC 2016, Part 12, Cl. 15.6, 15.11; IS 2190 : 2024, Cl. 8, 11, Annexes E and F]","type":"Mandatory (shall)","app":"All","guide":"IS 2190 : 2024 schedule: inspection at about 90 days (8.3), maintenance yearly (8.4), refill and HPT per Annexes E and F; see I-41 to I-43. Check service tags and dates on a sample and the records.","method":"D, V","sev":3,"rule":[],"area":"FFS","weight":3},{"id":"I-03","sec":"I","req":"First-aid hose reels are installed on all floors where required, connected directly to the riser/down-comer main, with hose diameter not less than 19 mm.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(d), Table 7 (col 4) [IS 884]]","type":"Mandatory (shall)","app":"As per Table 7","guide":"Run out a sample hose reel fully and open the nozzle: check reach, flow, leaks and that the valve is not seized. IS 3844, Cl. 6.5: no part of the floor more than 6 m from the nozzle with the hose fully run out; annual run-out and flow of at least 30 l/min (Cl. 9.7). See I-47.","method":"V, T","sev":4,"rule":[],"area":"FFS","weight":4},{"id":"I-04","sec":"I","req":"Wet riser, down-comer and yard hydrant systems are provided as required by Table 7, with mains sized as per Table 8.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(a), Table 7 (cols 5 to 7), Table 8]","type":"Mandatory (shall)","app":"As per Table 7","guide":"Table 8: 100 mm mains with single outlet landing valves for the buildings and heights listed in its first group; 150 mm for hotels and business buildings above 45 m, starred hotels, institutional above 30 m, industrial above 15 m, storage and hazardous buildings up to 15 m. A dry riser may be used in hilly or industrial areas if the local authority requires (Table 7, Note 24).","method":"D, V","sev":5,"rule":[],"area":"FFS","weight":5},{"id":"I-05","sec":"I","req":"Wet risers are interconnected at terrace level to form a ring, with a cut-off for each connection.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(e)]","type":"Mandatory (shall)","app":"Where more than one wet riser is provided","guide":"Inspect at terrace.","method":"V","sev":3,"rule":["hyd"],"area":"FFS","weight":3},{"id":"I-06","sec":"I","req":"Pressure at the hydraulically remote hydrant and at the highest hydrant is not less than 3.5 bar, and pressure at any hydrant does not exceed 7.0 bar.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(f)]","type":"Mandatory (shall)","app":"Where hydrant systems are provided","guide":"Witness a flow test at the highest/most remote landing valve with a calibrated gauge. Check lower levels for orifice plates or pressure reducing valves. IS 3844: static pressure in any hose line with the nozzle shut not more than 7 kgf/cm2 (Cl. 7.7); orifice or other device where lower floors exceed 4 kgf/cm2 (Cl. 7.8).","method":"T, M","sev":5,"rule":["hyd"],"area":"FFS","weight":5},{"id":"I-07","sec":"I","req":"Hydrants and hose reels are located in the firefighting shaft lobby; hydrants near exit stairs are within 5 m of the exit door; cabinets are marked 'FIRE HOSE CABINET'; and their locations are shown on a floor plan displayed in the stair landing.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(g)]","type":"Mandatory (shall)","app":"Where internal hydrants are provided","guide":"Cabinet lettering 75 mm high and 12 mm wide, with a glass panel for visibility. IS 3844, Cl. 5.9: landing valve control 1.0 to 1.2 m above floor (see I-46).","method":"V, M","sev":3,"rule":["hyd"],"area":"FFS","weight":3},{"id":"I-08","sec":"I","req":"Valves in fixed firefighting installations have supervisory switches signalling to the fire alarm panel, or are chained and padlocked with label and serial-numbered tamper-proof tag, and are kept in the open position.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(c)]","type":"Mandatory (shall)","app":"All fixed installations","guide":"Trace the system from pump to risers and check every isolation valve. Record any closed or partly closed valve as a critical finding.","method":"V","sev":5,"rule":[],"area":"FFS","weight":5},{"id":"I-09","sec":"I","req":"External hydrants, internal hydrants, hose reels, hoses, branch pipes and couplings are complete, checked periodically and maintained.","ref":"[NBC 2016, Part 12, Cl. 15.10; NBC 2016, Part 4, Cl. 5.1.1(b), 5.3; IS 3844 : 1989, Cl. 9; IS 13039 : 2014, Cl. 12]","type":"Mandatory (shall)","app":"Where provided","guide":"Intervals: internal hydrants and hose reels per IS 3844, Cl. 9 (six-monthly inspection, annual hose reel test; see I-50); yard hydrants per IS 13039, Cl. 12 (weekly hydrant and hose box checks, fortnightly mains test; see I-54). Open sample hose boxes: hose, branch pipe and key present; hose condition; landing valve operable; no leaks.","method":"V, T","sev":4,"rule":[],"area":"FFS","weight":4},{"id":"I-10","sec":"I","req":"Static water storage (underground and terrace tanks) of the capacity given in Table 7 is always available, with arrangements for replenishment.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.1, Table 7 (cols 11 and 12)]","type":"Mandatory (shall)","app":"As per Table 7","guide":"Compute actual effective capacity above the top of the pump casing from tank dimensions and compare with Table 7 (add the values in parentheses where basement area exceeds 200 m2, Note 6).","method":"D, M","sev":5,"rule":[],"area":"PMP","weight":5},{"id":"I-11","sec":"I","req":"Fire water is stored in two or more interconnected compartments of equal size.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.1]","type":"Mandatory (shall)","app":"Where a static tank is provided","guide":"Allows cleaning without interrupting water availability.","method":"V, D","sev":3,"rule":["tank"],"area":"FFS","weight":3},{"id":"I-12","sec":"I","req":"Domestic water is drawn only by overflow from the fire tank, or the domestic suction is at a level that always retains the Table 7 fire reserve.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.1]","type":"Mandatory (shall)","app":"Where fire and domestic storage are combined","guide":"Check the suction arrangement on drawings and at site.","method":"D, V","sev":4,"rule":[],"area":"PMP","weight":4},{"id":"I-13","sec":"I","req":"The static tank is accessible to fire engines, has manholes for inspection and suction hose, is not more than 7 m deep from the draw-out level, and the draw-out connection is not more than 5 m from the tank wall.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.1]","type":"Mandatory (shall)","app":"Where an underground static tank is provided","guide":"Check that manhole covers can be opened and are not built over or parked on.","method":"V, M","sev":3,"rule":["tank"],"area":"PMP","weight":3},{"id":"I-14","sec":"I","req":"The tank has a fire brigade collecting head with four 63 mm instantaneous male inlets (two for pumps of 1 400 litre/min) connected by pipe of not less than 150 mm, and a fire brigade draw-out connection.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.1]","type":"Mandatory (shall)","app":"Where a static tank is provided","guide":"Check that inlets are at street level, in a valve box, capped, identified and unobstructed. Draw-out: 63 mm outlet on 100 mm pipe with foot valve.","method":"V","sev":4,"rule":["tank"],"area":"PMP","weight":4},{"id":"I-15","sec":"I","req":"Where the tank slab forms part of a driveway, it is designed for a vehicular load of 45 t.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.1]","type":"Mandatory (shall)","app":"Tanks under driveways","guide":"Check the structural drawing or designer's certificate.","method":"D","sev":2,"rule":[],"area":"DOC","weight":2},{"id":"I-16","sec":"I","req":"Fire water tanks are kept full and free from foreign material; water level is recorded weekly; tanks are cleaned at least once a year.","ref":"[NBC 2016, Part 12, Cl. 15.11]","type":"Mandatory (shall)","app":"Where fire tanks are provided","guide":"Look into the tank or check the level indicator; review weekly level records and the last cleaning record. IS 15105, Cl. 7.7 allows sprinkler reservoirs to be cleaned once in two years; the NBC annual requirement is stricter and governs.","method":"V, D","sev":4,"rule":["tank"],"area":"PMP","weight":4},{"id":"I-17","sec":"I","req":"Fire pump sets (electric, diesel standby and jockey) of the capacity and number given in Table 7 and its Notes are installed.","ref":"[NBC 2016, Part 4, Table 7 (cols 13 and 14), Notes 10 to 14, 21 to 23]","type":"Mandatory (shall)","app":"As per Table 7","guide":"Notes 10 to 12 and 14 give pump set make-up (main pumps of 1 620, 2 280 or 2 850 litre/min with 180 litre/min jockey pumps). One set per 100 hydrants or part thereof, maximum two sets, interconnected at delivery headers (Note 22). Compare nameplate duty with the requirement. Jockey pump: 3 to 10 percent of installed capacity, minimum 180 l/min (IS 15301, Cl. 6.5); see I-69.","method":"D, V","sev":5,"rule":[],"area":"PMP","weight":5},{"id":"I-18","sec":"I","req":"The pump house is directly accessible from ground level, is not lower than the second basement, and when in a basement has a staircase with direct access from the ground.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.2(a), (b)]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"Installing at ground level is preferable (advisory). Access shall not pass through other occupancies in the basement.","method":"V","sev":4,"rule":["pump"],"area":"PMP","weight":4},{"id":"I-19","sec":"I","req":"The pump house is separated by fire walls all around with 120 min fire doors.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.2(c)]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"Check door label and that the door is kept closed. IS 15301, Cl. 4.5 and IS 3844, Cl. 4.2.1 accept a 1 h door; the NBC 120 min requirement governs.","method":"V","sev":4,"rule":["pump"],"area":"PMP","weight":4},{"id":"I-20","sec":"I","req":"The pump house is well ventilated, free of water stagnation, large enough for all pumps and accessories, and contains no other utility equipment.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.2(d), (e), (h)]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"'Well ventilated' is not quantified in NBC. IS 15301, Cl. 4.1 and 4.5 call for natural ventilation through protected windows and forced mechanical ventilation for basement pump rooms; IS 15105, Cl. 9.3.1 limits the rise to 10 deg C above ambient with the diesel engine on full load. Record domestic pumps, stores or other equipment in the room.","method":"V","sev":3,"rule":["pump"],"area":"PMP","weight":3},{"id":"I-21","sec":"I","req":"Negative suction arrangements and submersible pumps are not used for fire pumps.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.2(g)]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"Confirm flooded suction: tank low level above the pump casing.","method":"V, D","sev":4,"rule":["pump"],"area":"PMP","weight":4},{"id":"I-22","sec":"I","req":"The diesel engine fire pump battery has a separate charger from the emergency power supply circuit, and the exhaust pipe is insulated and taken to a safe location at ground level.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.2(j), (k)]","type":"Mandatory (shall)","app":"Where a diesel fire pump is provided","guide":"Check battery condition, charger and fuel level. IS 15105, Cl. 9.3.8, 9.3.9: battery capacity for ten consecutive cold starts and a 2-rate trickle charger; see I-67.","method":"V","sev":3,"rule":["dpump"],"area":"PMP","weight":3},{"id":"I-23","sec":"I","req":"Fire pumps have a soft starter or variable frequency drive starter.","ref":"[NBC 2016, Part 4, Cl. 5.1.2.2(m)]","type":"Mandatory (shall)","app":"Where electric fire pumps are provided","guide":"Check the starter panel.","method":"V","sev":2,"rule":["pump"],"area":"PMP","weight":2},{"id":"I-24","sec":"I","req":"Fire pumps are maintained in accordance with good practice, jockey pumps are checked daily, and adequate diesel stock is kept for the design duration.","ref":"[NBC 2016, Part 12, Cl. 15.9; IS 15301 : 2003, Cl. 7]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"Selector switches shall be found in AUTO. Witness automatic start of jockey, main and diesel pumps by pressure drop (open a test valve). Record cut-in pressures. IS 15301 details are in I-63 to I-69; fuel duration is in I-67 and the Ambiguities sheet.","method":"T, D","sev":5,"rule":["pump"],"area":"PMP","weight":5},{"id":"I-25","sec":"I","req":"Automatic sprinklers are installed throughout the building wherever required by Table 7, in accordance with good practice.","ref":"[NBC 2016, Part 4, Cl. 5.1.3(a), (b), Table 7 (col 8) [IS 15105]]","type":"Mandatory (shall)","app":"As per Table 7","guide":"Selective sprinklering is a recognised danger (Cl. 5.1.3(b)). Sprinklers may be excluded in substation and DG areas (d) and may be avoided in spaces 17 m or more in height such as atria (e). Record all unsprinklered areas. IS 15105, Cl. 6.2.2: no sprinklers where water discharge is hazardous (e.g. over salt baths, metal melt pans, frying ranges); Cl. 6.2.3: stairs, toilets and switchgear rooms may be left unsprinklered only if separated by 225 mm brick or 100 mm RCC walls with 1 h fire doors.","method":"D, V","sev":5,"rule":[],"area":"FFS","weight":5},{"id":"I-26","sec":"I","req":"Sprinklers are installed in basements where required.","ref":"[NBC 2016, Part 4, Table 7, Notes 4 and 5]","type":"Mandatory (shall)","app":"Basement area exceeding 200 m2","guide":"Visual check of every basement level, including stores and plant rooms.","method":"V","sev":4,"rule":["bas"],"area":"CAR","weight":4},{"id":"I-27","sec":"I","req":"Sprinklers are installed in false ceiling voids exceeding 800 mm in height.","ref":"[NBC 2016, Part 4, Cl. 5.1.3(c)]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Measure void depth at sample locations. IS 15105, Cl. 11.8: roof and ceiling voids more than 0.8 m deep, and floor or ceiling voids that are combustible or contain combustibles, are to be sprinklered.","method":"M, V","sev":3,"rule":["spk"],"area":"FFS","weight":3},{"id":"I-28","sec":"I","req":"Pressure in the sprinkler system does not exceed 12 bar, unless high pressure sprinklers are installed.","ref":"[NBC 2016, Part 4, Cl. 5.1.3(f)]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Read gauges at the lowest level installation control valve.","method":"M","sev":3,"rule":["spk"],"area":"FFS","weight":3},{"id":"I-29","sec":"I","req":"The floor area on any one floor protected by one sprinkler riser from an installation control valve does not exceed 4 500 m2.","ref":"[NBC 2016, Part 4, Cl. 5.1.3(g)]","type":"Mandatory (shall)","app":"Sprinklered buildings (industrial and hazardous: as advised by Authorities)","guide":"Check against the sprinkler layout.","method":"D","sev":3,"rule":["spk"],"area":"DOC","weight":3},{"id":"I-30","sec":"I","req":"Sprinkler installation control valves are inside the fire pump room, and sprinkler flow switches are monitored by the fire alarm panel.","ref":"[NBC 2016, Part 4, Cl. 5.1.3(h), (k)]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Open a floor test/drain valve and confirm the flow signal at the panel and the correct zone.","method":"V, T","sev":4,"rule":["spk"],"area":"PMP","weight":4},{"id":"I-31","sec":"I","req":"Ramps at all levels are protected with sprinklers, and provisions prevent sprinkler/hydrant water entering lifts and electrical rooms.","ref":"[NBC 2016, Part 4, Cl. 5.1.3(m), (n)]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Check sills, slopes or drains at lift lobbies and electrical room doors.","method":"V","sev":3,"rule":["spk"],"area":"FFS","weight":3},{"id":"I-32","sec":"I","req":"Sprinklers are fed from both the underground static tank and the terrace tank.","ref":"[NBC 2016, Part 4, Table 7, Note 9]","type":"Mandatory (shall)","app":"Where Note 9 applies to the Table 7 row","guide":"Check piping schematic.","method":"D","sev":3,"rule":[],"area":"DOC","weight":3},{"id":"I-33","sec":"I","req":"Sprinkler heads are unobstructed, undamaged, free of paint and corrosion, and of the correct temperature rating; spare heads are kept.","ref":"[NBC 2016, Part 12, Cl. 15.10; IS 15105 : 2002, Cl. 11.3, 15.1, 15.4 to 15.6, 17.6.4.8]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Clear space of 0.5 m below deflectors (1 m for high-piled combustible storage and above open-cell ceilings) (11.3). Sprinklers are not painted except for identification, coated, altered, reconditioned or repaired; used or damaged heads are replaced with new ones (15.1.2, 15.1.3). Temperature rating at least 30 deg C above the highest expected ambient (15.5.1.1); bulb colours 57 orange, 68 red, 79 yellow, 93 green, 141 blue, 182 mauve (Table 37). Metal guards where heads may be struck (15.6.1). Record storage stacked close to heads, heads blocked by partitions, ducts or signage, and painted, corroded or missing heads. Spare stock: see I-60.","method":"V","sev":4,"rule":["spk"],"area":"FFS","weight":4},{"id":"I-34","sec":"I","req":"Automatic high velocity water spray or emulsifying systems protect oil-cooled transformers, and medium velocity water spray protects cable galleries and similar risks, where applicable.","ref":"[NBC 2016, Part 4, Cl. 5.1.4 [IS 15325]]","type":"Mandatory (shall)","app":"Where such risks exist","guide":"Check deluge valve, detection, nozzle condition and test records.","method":"V, D","sev":4,"rule":[],"area":"FFS","weight":4},{"id":"I-35","sec":"I","req":"A fixed foam system protects the boiler oil storage area and ancillary furnace oil storage in the basement.","ref":"[NBC 2016, Part 4, Cl. 5.1.5 [IS 12835]]","type":"Mandatory (shall)","app":"Where oil storage for boilers is in the basement","guide":"Check foam concentrate quantity, expiry and test records.","method":"V, D","sev":3,"rule":["boil","bas"],"area":"CAR","weight":3},{"id":"I-36","sec":"I","req":"Gas based or clean agent suppression is provided where water or foam cannot be used, in accordance with good practice.","ref":"[NBC 2016, Part 4, Cl. 5.1.6, 5.1.9 [IS 15528, IS 15493]]","type":"Mandatory (shall)","app":"Server rooms, control rooms and similar special risks","guide":"Check cylinder pressure/weight, room integrity (sealed openings, door closers), abort/manual release, warning signs and service records.","method":"V, D","sev":3,"rule":[],"area":"FFS","weight":3},{"id":"I-37","sec":"I","req":"Fixed firefighting installations are maintained in accordance with good practice and Part 12, and commissioning test records are available.","ref":"[NBC 2016, Part 4, Cl. 5.3; NBC 2016, Part 12, Cl. 15.3, 15.10]","type":"Mandatory (shall)","app":"All","guide":"Review the maintenance contract scope, service reports for the last 12 months and open defects. Commissioning benchmarks: internal hydrant system held at 7 kgf/cm2 for 30 min with a drop of not more than 0.5 kgf/cm2, then a flow test (IS 3844, 8.1, 8.2); sprinkler and hydrant pipework held at 150 percent of maximum working pressure for 2 h (IS 15105, 10.1.6; IS 13039, 7.6); each sprinkler installation valve tested with automatic pump start (IS 15105, 18.3).","method":"D","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"I-38","sec":"I","req":"Fire extinguishers are ISI-marked and of types suited to the classes of fire present: Class A for building protection; Class B / C where flammable liquids or gases are present; Class F for cooking oils and fats; Class D for combustible metals; and types tested and marked for energized electrical equipment.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(b); IS 2190 : 2024, Cl. 6.1 to 6.4, 7.1]","type":"Mandatory (shall)","app":"All","guide":"IS 2190 : 2024 applies only to ISI-marked extinguishers to IS 15683 and IS 16018 (Foreword). Energized electrical equipment: CO2, powder, clean agent or water-mist types marked as suitable; CO2 with metal horns is not safe on live equipment (6.3.7). Clean agent types only where a clean medium is needed (6.2). AFFF / FFFP not for water-soluble (polar) liquids unless the nameplate says so (6.4.3). Extinguishers in one building should operate alike (Foreword). Fire buckets do not count in lieu of extinguishers.","method":"V","sev":4,"rule":[],"area":"FFS","weight":4},{"id":"I-39","sec":"I","req":"Extinguishers are distributed per the hazard: Class A rating, travel distance and area per extinguisher as Table 1 (light 2A, 20 m, 300 m2; moderate 3A, 20 m, 150 m2; high 4A, 15 m, 100 m2); Class B / C as Table 2 (55B, 144B, 233B; 15 m); and at least two per floor (one where the floor is under 100 m2).","ref":"[NBC 2016, Part 4, Table 7 (col 3); IS 2190 : 2024, Cl. 7.1, 7.2, 7.3, Tables 1 and 2]","type":"Mandatory (shall)","app":"All","guide":"Classify each area as light, moderate or high hazard (Cl. 3.6; Annex B, Table 6 gives example criteria, e.g. building over 15 m or more than 250 occupants = high). Measure walking distance, not straight line. Other limits: Class B liquids in depth over 6 mm per 7.4 (travel not more than 15 m); Class D within 20 m (7.6.2); Class F within 10 m, sized by cooking area per Table 3 (7.7, see L-23). Two adjacent 2A water extinguishers may count as one 3A or 4A (Table 1 footnote).","method":"M, D","sev":4,"rule":[],"area":"FFS","weight":4},{"id":"I-40","sec":"I","req":"Extinguishers are kept in their designated places, conspicuous and unobstructed along normal paths of travel, with location signs where not directly visible, mounted on hangers, brackets or in unlocked cabinets, and not exposed to temperatures outside the range marked on them.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(a); IS 2190 : 2024, Cl. 5.1 to 5.5, 5.10, 5.11]","type":"Mandatory (shall)","app":"All","guide":"Floor stands only where wall mounting is not possible (5.5). Locked cabinets only where vandalism occurs, with means of emergency access (5.3). Outdoor or hot-location cabinets need ventilation openings, a drain and insect mesh (5.10). Service and HPT labels must not obscure operating instructions. Mounting height: NBC says 'convenient height'; the IS 2190 clauses on mounting height and impact protection are not legible in the copy supplied, so confirm from the printed standard (see Ambiguities).","method":"V","sev":3,"rule":[],"area":"FFS","weight":3},{"id":"I-41","sec":"I","req":"Every extinguisher is inspected when placed in service and at about 90-day intervals: in its place, unobstructed, instructions legible and facing out, seals and tamper indicators intact, full (weighed or hefted), no damage, corrosion, leakage or blocked nozzle, gauge in the operable range, bracket secure, tags intact; and deficiencies are corrected at once.","ref":"[IS 2190 : 2024, Cl. 8.3.1 to 8.3.6]","type":"Mandatory (shall)","app":"All","guide":"The 90-day interval is worded 'should'; the check points are 'shall'. The 2024 revision dropped the monthly inspection (Foreword). Check a sample on site against these points and the last quarterly record. Non-rechargeable units with damage, low pressure or broken seals are removed from service (8.3.5, 8.3.6).","method":"V, D","sev":3,"rule":[],"area":"FFS","weight":3},{"id":"I-42","sec":"I","req":"All extinguishers receive maintenance once a year (not less than six months apart) by competent persons; each carries a tag showing the month and year of service and the person who did it; and units removed for service are replaced at once by spares of the same type and at least equal rating.","ref":"[NBC 2016, Part 12, Cl. 15.11; IS 2190 : 2024, Cl. 8.2, 8.4.1, 10.1 to 10.7, Annex C]","type":"Mandatory (shall)","app":"All","guide":"Competent person (Annex C): at least 3 months practical experience plus a course of at least 32 h with an examination supervised by an independent body, and a 4 h refresher every 5 years; ask for certificates. Service labels not on the front of the extinguisher (10.4); unique ID number per extinguisher (10.5); gauges replaced or calibrated at HPT (10.6); rupture disc replaced at each HPT or every 5 years (10.7).","method":"D, V","sev":3,"rule":[],"area":"FFS","weight":3},{"id":"I-43","sec":"I","req":"Extinguishers are discharged and refilled, and hydrostatically pressure tested, at the intervals in Annexes E and F: water, foam and cartridge-type powder refilled every 3 years; stored-pressure powder, CO2 and clean agent every 5 years; HPT every 3 years for water and foam and every 5 years for powder, CO2 and clean agent; CO2 cylinders pressure tested before every refill.","ref":"[NBC 2016, Part 12, Cl. 15.11; IS 2190 : 2024, Cl. 8.4.2.5, 10.8, 11, Annexes E and F]","type":"Mandatory (shall)","app":"All","guide":"HPT test pressures (Annex F): 35 kg/cm2 for water, foam, powder and clean agent (held 150 s); 225 kg/cm2 for CO2 (held 30 s). Check HPT dates on a sample against the date of manufacture. Corrosive environments: discharge tests at half the interval are desirable (Annex E, Note 1). Condemn units that fail HPT or show weld or solder repairs, pitting, damaged threads, fire exposure or dents beyond the limits of 11.1.3.","method":"D, V","sev":3,"rule":[],"area":"FFS","weight":3},{"id":"I-44","sec":"I","req":"No extinguisher is beyond its service life from date of manufacture (10 years for water, foam, powder and clean agent; 15 years for CO2), and obsolete types (soda-acid, chemical foam, inverting, CTC or CBM, copper or brass shells joined by soft solder or rivets, and non-rechargeable units more than 5 years old) have been removed.","ref":"[IS 2190 : 2024, Annex D, Annex G, Cl. 8.4.2.5, 13]","type":"Mandatory (shall)","app":"All","guide":"Read the year of manufacture on a sample. Rejected extinguishers are to be cut across the body before disposal and the rejection and disposal recorded in the register (Cl. 13).","method":"V","sev":3,"rule":[],"area":"FFS","weight":3},{"id":"I-45","sec":"I","req":"A register of fire extinguishers is kept in the Annex H format, recording for each unit: type, capacity, year of manufacture, make, location, quarterly and annual inspection dates, pressure test date, discharge date, refill date and next due date.","ref":"[NBC 2016, Part 12, Cl. 15.6; IS 2190 : 2024, Cl. 10, 12, Annex H]","type":"Mandatory (shall)","app":"All","guide":"Cross-check three units picked on site against the register.","method":"D","sev":2,"rule":[],"area":"DOC","weight":2},{"id":"I-46","sec":"I","req":"Internal hydrant landing valves are provided on every floor (and on an accessible roof) in the staircase lobby or enclosure without reducing the escape width, with the outlet 1.0 to 1.2 m above floor, housed in glass-fronted hose boxes with hose and branch pipe, and with clearance to connect and operate the hose.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(g); IS 3844 : 1989, Cl. 5.8, 5.9, 5.10, 5.12, 5.14]","type":"Recommended (should)","app":"Where internal hydrants are provided","guide":"Each single-headed hydrant: not less than 30 m of 63 mm hose (IS 636, Type A) in two 15 m lengths with couplings, and a branch pipe (5.12). Hose box of at least 2 mm MS plate with glass front, sized for the valve, hoses and branch pipes (5.14). Basements are to be covered by hydrants and hose reels (5.10). Note: IS 3844 Tables 1 and 2 (system type by building) are superseded by NBC Tables 7 and 8.","method":"V, M","sev":4,"rule":["hyd"],"area":"FFS","weight":4},{"id":"I-47","sec":"I","req":"Hose reels are sited on each floor near exits, staircases or lobbies so that, with the hose fully run out, no part of the floor is more than 6 m from the nozzle; they are unobstructed, firmly fixed, and preferably recessed out of the escape route.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(d); IS 3844 : 1989, Cl. 6.1 to 6.7]","type":"Recommended (should)","app":"Where hose reels are provided","guide":"Walk the hose to the farthest corner of sampled rooms. Recess doors should open about 180 degrees; in open areas the inlet valve and nozzle retainer about 900 mm above floor (6.2). In warehouses, keep stacks away from hose reels, using guard rails if needed (6.4). Hose reel to IS 884, Type A (IS 884 not in project files).","method":"M, V","sev":3,"rule":["hyd"],"area":"FFS","weight":3},{"id":"I-48","sec":"I","req":"Each wet riser (or riser zone) has a fire service inlet at ground level on the street side, preferably near the main entrance, fitted with a non-return valve, in a lockable glass-fronted box marked 'FIRE SERVICE INLET', with 2 x 63 mm inlets for a 100 mm main or 4 x 63 mm for a 150 mm main; and each main has an air release valve at the top and a drain.","ref":"[IS 3844 : 1989, Cl. 5.2.3, 5.5, 7.5, 7.6]","type":"Recommended (should)","app":"Where wet risers are provided","guide":"One inlet may serve two risers within 30 m of each other (5.5.1(a)). Box: 1.6 mm MS plate, 4 mm glass front; lettering at least 75 mm high and 12 mm wide in fluorescent fire red. Check that a fire tender can reach the inlet, that it is not blocked by parking or landscaping, and that caps are present. Inlets are to be inspected every six months (9.3).","method":"V","sev":4,"rule":["hyd"],"area":"FFS","weight":4},{"id":"I-49","sec":"I","req":"Spare hoses and accessories are kept ready: at least 10 percent of hoses, landing valves, lugs and valve wheels for internal hydrants; for yard hydrants spare hose of 10 percent (minimum 30 m) and spare nozzles of 10 percent (minimum two); and spare rubber washers packed in French chalk.","ref":"[IS 3844 : 1989, Cl. 5.12; IS 13039 : 2014, Cl. 8.6, 8.8, 9.3]","type":"Mandatory (shall)","app":"Where hydrant systems are provided","guide":"IS 3844 uses 'should' for internal hydrant spares; IS 13039 uses 'shall' for yard hydrants. Spare hose in 15 m lengths with couplings attached.","method":"V","sev":2,"rule":["hyd"],"area":"FFS","weight":2},{"id":"I-50","sec":"I","req":"Internal hydrant and hose reel systems are maintained: surroundings and indicator plates checked; isolating valves locked open; inlets, landing valves, drain valves and box hinges and locks inspected every six months; hose reels fully run out and flow tested at least once a year (not less than 30 l/min; at least the highest reel on each riser); defects rectified promptly.","ref":"[NBC 2016, Part 12, Cl. 15.10; IS 3844 : 1989, Cl. 9.1 to 9.8]","type":"Recommended (should)","app":"Where internal hydrants or hose reels are provided","guide":"Review the six-monthly and annual records. A defective landing valve without a replacement should be removed and the outlet blanked so the riser stays live (9.4). The annual hose reel test also proves couplings watertight (9.7).","method":"D, T","sev":3,"rule":["hyd"],"area":"FFS","weight":3},{"id":"I-51","sec":"I","req":"Yard (external) hydrants are stand-post type with oblique 63 mm instantaneous outlets about 1 m above ground, serially numbered, easily accessible with no storage around them, guarded where vehicles may hit them, and located at least 2 m from, and within 15 m of, the building face they protect.","ref":"[NBC 2016, Part 4, Table 7 (col 7); IS 13039 : 2014, Cl. 4.1, 4.4 to 4.16]","type":"Mandatory (shall)","app":"Where yard hydrants are provided (IS 13039 covers medium and large industrial risks; apply as good practice elsewhere)","guide":"Spacing (4.12): at least one hydrant per 60 m of external wall for light hazard, 45 m for ordinary and 30 m for high hazard. High-hazard buildings: hydrants 5 to 15 m from the building face (4.16). Remote hydrants need paved approach paths (4.8). Underground hydrants only in surface boxes 750 mm square (4.1). Pressure-reducing devices where pressure exceeds 7 kg/cm2 (4.6). No connection for any other purpose from the hydrant service (4.3).","method":"V, M","sev":4,"rule":[],"area":"FFS","weight":4},{"id":"I-52","sec":"I","req":"Hose and branch pipes for yard hydrants are kept either in glass-fronted hose boxes beside each hydrant (two 15 m lengths of 63 mm hose each) or in central hose stations, shaded from the sun, with a master key for locked boxes kept at the main gate or another known location.","ref":"[IS 13039 : 2014, Cl. 8.1 to 8.4, 8.9, 8.10, 9.1]","type":"Mandatory (shall)","app":"Where yard hydrants are provided","guide":"Central hose stations: two 15 m lengths for each of the first ten hydrants plus one per additional hydrant, reducible above 55 outlets (8.2.1). Nozzles: half the number of hose lengths, 16 to 25 mm bore (32 mm for high hazard) (8.4, 9.1). Hose lengths marked and numbered (8.7, recommended).","method":"V","sev":3,"rule":["yard"],"area":"FFS","weight":3},{"id":"I-53","sec":"I","req":"Hydrant mains are laid as a ring (terminal mains only where a ring is not feasible), buried at least 1 m deep or carried above ground on masonry or RCC supports, not under buildings, with sectional isolation valves in marked surface boxes so that any section can be isolated without affecting the rest.","ref":"[IS 13039 : 2014, Cl. 7.2 to 7.4, 7.12, 7.13, 7.15, 7.16]","type":"Mandatory (shall)","app":"Where yard hydrant mains are provided","guide":"Isolation valves near loop junctions and at least every 300 m (7.15.1); right-hand valves with open/close arrows; surface box at least 1 m2 with a fire-red plate giving valve number and direction (7.16). Above-ground mains at least 6 m (15 m for high hazard) from buildings and storage, supported at not more than 6 m (3 m below 150 mm), not on pipe racks (7.3). Terminal mains: 80 mm feeds 1 hydrant, 100 mm 2, 125 mm 3, 150 mm 5 (7.13). Butterfly valves above 150 mm gear operated (7.15.5).","method":"D, V","sev":3,"rule":["yard"],"area":"FFS","weight":3},{"id":"I-54","sec":"I","req":"External hydrant systems are maintained to the IS 13039 schedule: hydrants examined weekly; hose boxes inspected weekly and cleaned monthly; mains tested fortnightly with a pump at maximum pressure and two 30 m hose lines running; cut-off valves operated monthly and overhauled annually; a hose register kept.","ref":"[NBC 2016, Part 12, Cl. 15.10; IS 13039 : 2014, Cl. 12.2 to 12.4]","type":"Mandatory (shall)","app":"Where yard hydrants are provided","guide":"Hose cut back to less than 90 percent of its original length, or unserviceable for any reason, is discarded (12.4.2, 12.4.4). Fire hose not used for any purpose other than fire protection and drills (12.4.5). Spare washers for hydrant valve seats (12.3.2).","method":"D, T","sev":3,"rule":["yard"],"area":"PMP","weight":3},{"id":"I-55","sec":"I","req":"When any part of a hydrant or sprinkler system is out of service, only the affected section is isolated (blank flanges rather than valves left shut overnight), only one tank compartment is emptied at a time, compensatory measures are applied, the fire service and occupants are informed, and a notice is displayed.","ref":"[IS 3844 : 1989, Cl. 9.9; IS 13039 : 2014, Cl. 13.1 to 13.4; IS 15105 : 2002, Cl. 17.2 to 17.4]","type":"Mandatory (shall)","app":"All water-based fire systems","guide":"Compensatory measures (IS 15105, 17.2.2): close fire doors and shutters, alert security and safety staff, add first-aid appliances. Patrol the area before shut-down (17.3.2); notify department heads in writing (17.3.3); keep authorities informed (17.3.1). If a pump is expected to be down for more than 72 h, connect an alternative supply (IS 13039, 13.3). Ask for the impairment or shut-down log for the last 12 months.","method":"D","sev":4,"rule":[],"area":"DOC","weight":4},{"id":"I-56","sec":"I","req":"Sprinkler spacing and coverage match the hazard class: light hazard not more than 21 m2 per sprinkler (17 m2 sidewall) and 4.5 m spacing; moderate hazard not more than 12 m2 (9 m2 sidewall) and 4.0 m spacing (4.6 m along ranges if staggered); high hazard not more than 9 m2 and 3.7 m spacing; not less than 2 m between sprinklers; distance to walls not more than half the spacing.","ref":"[NBC 2016, Part 4, Cl. 5.1.3(a); IS 15105 : 2002, Cl. 5.1, 11.2]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Confirm the hazard class used in design (Cl. 5.1): offices, hotels, hospitals and schools are light hazard only where rooms are 125 m2 or less and bounded by masonry walls with doors, otherwise moderate; car parks and retail stores are moderate. Distance to boundary not more than 1.5 m where walls are combustible or joists and rafters are exposed. Sidewall and staggered layouts are not permitted in high hazard (11.2.3.5). Measure spacing at sample locations and compare with the layout drawing.","method":"M, D","sev":4,"rule":["spk"],"area":"FFS","weight":4},{"id":"I-57","sec":"I","req":"Sprinkler deflectors are correctly positioned (75 to 150 mm below non-combustible ceilings; sidewall heads 100 to 150 mm below the ceiling and 50 to 150 mm from the wall), clear of beams as Table 13, and additional sprinklers are fitted below ducts, platforms and other obstructions more than 1 m wide (more than 0.8 m wide where within 150 mm of a wall).","ref":"[IS 15105 : 2002, Cl. 11.2.1.4, 11.4, 11.5, 11.9, Tables 12 and 13]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Beams or joists deeper than 300 mm (combustible ceiling) or 450 mm (non-combustible) form separate bays (11.4.1.3). A sprinkler within 0.6 m of a column needs another within 2 m on the opposite side (11.5). Check under ducts and cable trays added after commissioning, and below mezzanines, platforms and worktables with a power source. Ceiling voids: see I-27.","method":"V, M","sev":4,"rule":["spk"],"area":"FFS","weight":4},{"id":"I-58","sec":"I","req":"In storage areas goods are kept at least 1.5 m below sprinkler deflectors where possible (2 m for jute), aisles are at least 2.5 m and stacks not more than 150 m2, storage heights are within the limits of the design category, and intermediate rack sprinklers are provided where storage exceeds those limits.","ref":"[IS 15105 : 2002, Cl. 5.1.4, 8.1.4, 8.1.5, 11.13, Tables 4 and 5]","type":"Mandatory (shall)","app":"Storage occupancies and storage areas within other buildings","guide":"Compare actual goods category (I to IV, Cl. 5.1.4) and stack height with the design basis. Moderate-hazard storage limits (Table 4): 4.0 m (Cat I), 3.0 m (II), 2.0 m (III), 1.25 m (IV); above these the risk becomes high-hazard storage needing a higher design density. Exceeding the aisle or stack limits adds 2.5 l/min/m2 to the design density (8.1.5.4). Intermediate sprinklers: vertical spacing not more than 3 m, 150 mm clear above goods, metal guards and water shields (11.13, 15.6).","method":"M, V, D","sev":4,"rule":[],"area":"FFS","weight":4},{"id":"I-59","sec":"I","req":"Each installation control valve set has the main stop valve secured open by a padlocked or riveted strap and readily accessible, a 'SPRINKLER STOP VALVE' location plate and a plan of the risk showing valve positions, 'B' and 'C' pressure gauges, a numbered alarm valve matching its numbered water motor gong on an external wall, and test and drain valves.","ref":"[NBC 2016, Part 4, Cl. 5.1.1(c), 5.1.3(h); IS 15105 : 2002, Cl. 14.1.2, 14.2, 14.4, 14.7, 14.9, 14.10]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Where one risk is served by several alarm valves, the area served by each is displayed near the valves (14.7.6.3). Valves right-handed with an open/shut indicator (14.1.2). Gauge scale subdivisions not coarser than 0.2 bar up to 10 bar (14.10.1). Water motor gong not more than 6 m above the alarm valve connection, with a strainer (14.9.2). NBC requires the control valves inside the pump room (I-30); the location plate and plan still apply.","method":"V","sev":4,"rule":["spk"],"area":"FFS","weight":4},{"id":"I-60","sec":"I","req":"A stock of spare sprinklers of each type and temperature rating, with sprinkler spanners, is kept on the premises at not more than 38 deg C: 6 / 24 / 36 for light / moderate / high hazard (in or within 100 km of a state capital), or 25 / 50 / 100 elsewhere.","ref":"[IS 15105 : 2002, Cl. 15.7]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"Increase in proportion where there is more than one installation. Check that the spares match the installed types (upright, pendent, concealed, sidewall) and ratings.","method":"V","sev":2,"rule":["spk"],"area":"FFS","weight":2},{"id":"I-61","sec":"I","req":"Water storage reserved for sprinklers is not less than Table 2 of IS 15105 (light: 20 min pumping or 35 m3; moderate: 1 h or 200 m3; high: 2 h), is in two interconnected compartments where 225 m3 or more, has a level indicator, and where combined with other systems holds the total of all systems served.","ref":"[IS 15105 : 2002, Cl. 7.1 to 7.6, Table 2]","type":"Mandatory (shall)","app":"Sprinklered premises where NBC Table 7 does not fix the storage (for example industrial and storage buildings); NBC Table 7 governs where it applies","guide":"Combined reservoirs are acceptable only where all suction inlets are at the same level (7.4). Level indicator preferably graduated in m3 (7.6). Salt or brackish water is not normally allowed (7.3).","method":"D, M","sev":4,"rule":[],"area":"PMP","weight":4},{"id":"I-62","sec":"I","req":"Sprinkler installations are inspected and tested to the IS 15105 schedule: gauge readings above and below each installation valve recorded daily and weekly; alarm gong operated weekly with the time to sound recorded; installation valves serviced annually; discharge (inspector's) test at least every six months; system flushed; pressure gauges calibrated annually.","ref":"[NBC 2016, Part 12, Cl. 15.10; IS 15105 : 2002, Cl. 17.1, 17.5, 17.6, 18.6, Table 38]","type":"Mandatory (shall)","app":"Sprinklered buildings","guide":"The user keeps a log book available on demand (17.1). Gong audibility at least 85 dB above background (18.6.2); gong assembly checked every 3 months (17.6.5.3). The text and Table 38 differ on flushing and flow test intervals (see Ambiguities). After any operation, operated heads and heat-affected heads nearby are replaced with new ones (17.5, 15.1.2).","method":"D, T","sev":3,"rule":["spk"],"area":"FFS","weight":3},{"id":"I-63","sec":"I","req":"Each fire pump has a pressure gauge between the pump and its non-return valve, a nameplate giving rated head, capacity and speed, an independent suction, a test line with shut-off valve for testing without discharging into the system, and a circulation relief valve set below shut-off pressure.","ref":"[IS 15301 : 2003, Cl. 6.6, 6.8, 6.9, 6.11; IS 15105 : 2002, Cl. 9.1.8, 9.1.9; IS 13039 : 2014, Cl. 5.1.6, 5.1.10]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"No sluice or cut-off valve on the suction unless the pump is below the water level (6.8). Suction velocity not more than 1.5 m/s, or 2 m/s with flooded suction (6.9). Delivery: sluice valve upstream of the non-return valve; no butterfly valves inside the pump room on hydrant services (IS 13039, 5.1.10). Relief valve discharge about 3 to 5 percent of pump rating (6.11).","method":"V","sev":4,"rule":["pump"],"area":"PMP","weight":4},{"id":"I-64","sec":"I","req":"The pump room gives working clearance around pumps (1 m front and back and 0.75 m at sides and between pumps above 2 280 l/min; 0.75 m and 0.6 m for smaller pumps; 2.75 m headroom), has a floor sloped to a drain, normal and emergency lighting, a lifting girder, a CO2 or DCP extinguisher, and a displayed layout of pumps and fire water lines.","ref":"[IS 15301 : 2003, Cl. 4.1 to 4.4, 5.1, 6.16; IS 3844 : 1989, Cl. 4.2.1, 4.2.2]","type":"Recommended (should)","app":"Where fire pumps are provided","guide":"Basement pump rooms are desirable to be sprinklered (6.16) and need forced mechanical ventilation (4.5). IS 15301 accepts a 1 h door for a pump house inside the building; the NBC 120 min requirement governs (I-19).","method":"V, M","sev":2,"rule":["pump"],"area":"PMP","weight":2},{"id":"I-65","sec":"I","req":"Pumps start automatically on pressure drop through separate pressure switches (jockey: cut-in and cut-out; main and diesel: cut-in only), main pumps stop only by a manual push button, electric and diesel pumps are interlocked so that both do not run together, and pump starting sounds an audible alarm outside the pump house.","ref":"[IS 15301 : 2003, Cl. 5.3 to 5.5, 6.1; IS 3844 : 1989, Cl. 4.2.2; IS 13039 : 2014, Cl. 5.1.9; IS 15105 : 2002, Cl. 17.5.3]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"Record cut-in pressures of jockey, main and diesel pumps and confirm they are staggered so the jockey handles small losses and the main pumps start in sequence. Diesel panel with its own battery, charger and auto/manual changeover (5.3); air vessel with pressure switches on the delivery line (5.4). Audible pump-run alarm outside the pump house, and at the site fire station if any, is 'shall' in IS 13039. After a fire, pump stopping is manual only (IS 15105, 17.5.3). NBC also requires pump status at the fire alarm panel (H-08).","method":"T, V","sev":5,"rule":["pump"],"area":"PMP","weight":5},{"id":"I-66","sec":"I","req":"The fire pump supply is independent of all other loads (taken from the incoming side of the main LT breaker, or from the busbars), protected by a breaker without under-voltage release and set to allow emergency overload, fed by a dedicated armoured feeder not passing under buildings, with tell-tale lamps in the substation and pump room and spare fuses in a glass-fronted box in the pump house.","ref":"[IS 15301 : 2003, Cl. 6.13, 6.15; IS 15105 : 2002, Cl. 9.2.4 to 9.2.8, 9.2.19; IS 13039 : 2014, Cl. 5.2.4 to 5.2.8, 5.2.20]","type":"Mandatory (shall)","app":"Where electric fire pumps are provided","guide":"Verify on the single line diagram and at the main LT panel that switching off the building supply does not isolate the fire pumps. With two sources, changeover should not need manual switching (IS 15105, 9.2.8). Substation or DG set supplying the pumps 6 m from other buildings or separated by a 4 h wall (IS 15301, 6.13).","method":"D, V","sev":5,"rule":["pump"],"area":"PMP","weight":5},{"id":"I-67","sec":"I","req":"The diesel fire pump engine accepts full load within 15 s of the start signal, has battery capacity for ten consecutive cold starts with a 2-rate trickle charger, a gravity-feed fuel tank with level gauge and the fuel valve locked open, an hour counter, and fuel stored for the required running time.","ref":"[NBC 2016, Part 12, Cl. 15.9; IS 15105 : 2002, Cl. 9.3; IS 13039 : 2014, Cl. 5.3; IS 15301 : 2003, Cl. 7.3.2(e)]","type":"Mandatory (shall)","app":"Where a diesel fire pump is provided","guide":"Fuel duration differs between standards: IS 15105 tank for 1 / 2 / 3 h full load (light / moderate / high hazard) plus 3 h on hand; IS 13039 tank for 2 / 4 / 6 / 8 h (light / ordinary / high A / high B) plus 6 h on hand; IS 15301 at least 4 h. See Ambiguities. Separate tank and feed pipe for each engine; no soldered joints or plastic tubing. Engine room at not less than 4.5 deg C (IS 15105, 9.3.13), heated above 10 deg C in sub-zero conditions. Spare parts and tool kit on hand (filters, belts, injector nozzles, gaskets).","method":"V, D","sev":5,"rule":["dpump"],"area":"PMP","weight":5},{"id":"I-68","sec":"I","req":"Fire pumps are tested and maintained to a written schedule, recorded in a register kept in the pump house: jockey pump tested daily by pressure drop; main pumps run at least 5 minutes daily; diesel engine started on pressure drop and run regularly; weekly checks of glands, bearings, starter contacts, fuel and batteries; annual flow test.","ref":"[NBC 2016, Part 12, Cl. 15.9; IS 15301 : 2003, Cl. 7.1 to 7.3; IS 15105 : 2002, Cl. 17.6.3, Table 38; IS 13039 : 2014, Cl. 5.3.10, 12.1]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"Diesel running: weekly for 10 min per IS 15301; 5 min daily per IS 15105 and IS 13039 (see Ambiguities). Insulation resistance: weekly per IS 15301, six-monthly per IS 15105 and IS 13039. A responsible person in charge of pump maintenance (IS 15301, 7.1); trained pump operator on all shifts (IS 13039, 12.1.1.1; IS 15105, 17.6.1.5). The register should start with the commissioning test (flow at 7 kgf/cm2, flow at 4.5 kgf/cm2, and shut-off pressure not more than 120 percent of 7 kgf/cm2) for comparison with later tests (IS 15301, 7.2.1).","method":"D, T","sev":4,"rule":["pump"],"area":"PMP","weight":4},{"id":"I-69","sec":"I","req":"Main fire pumps deliver at least 150 percent of rated capacity at not less than 65 percent of rated head, with shut-off head not more than 120 percent of rated head (140 percent for vertical turbine pumps), and the jockey pump capacity is between 3 percent (minimum 180 l/min) and 10 percent of the installed pumping capacity.","ref":"[IS 15301 : 2003, Cl. 6.5, 6.7; IS 15105 : 2002, Cl. 9.1.5, 9.1.7; IS 13039 : 2014, Cl. 5.1.5, 5.1.9]","type":"Mandatory (shall)","app":"Where fire pumps are provided","guide":"Obtain pump curves and the latest flow test. IS 13039 limits the jockey to 3 to 5 percent (minimum 10.8 m3/h) on hydrant services (see Ambiguities). Motor rated for the power at 150 percent of rated discharge (IS 15105, 9.2.10); diesel engine rated for the higher of 120 percent of duty-point power and the power at 150 percent flow (9.3.2.3).","method":"D, T","sev":3,"rule":["pump"],"area":"PMP","weight":3},{"id":"J-01","sec":"J","req":"A fire command centre is provided on the entrance floor with direct access, housing the main fire alarm panel and public address communication to all floors.","ref":"[NBC 2016, Part 4, Cl. 3.4.12(a); Annex D, Cl. D-6]","type":"Mandatory (shall)","app":"High rise (15 m and above) and other buildings where required","guide":"Check that the route from the fire tender arrival point to the room is direct and signed.","method":"V","sev":4,"rule":[],"area":"FCC","weight":4},{"id":"J-02","sec":"J","req":"The fire command centre has 120 min rated walls, a fire door and emergency lighting, and interior finishes are not flammable.","ref":"[NBC 2016, Part 4, Cl. 3.4.12(b)]","type":"Mandatory (shall)","app":"Where a fire command centre is provided","guide":"Visual check; door label.","method":"V","sev":3,"rule":["fcc"],"area":"FCC","weight":3},{"id":"J-03","sec":"J","req":"All controls and monitoring of fire alarm, pressurization and smoke management systems are in the fire command centre.","ref":"[NBC 2016, Part 4, Cl. 3.4.12(b)]","type":"Mandatory (shall)","app":"Where a fire command centre is provided","guide":"BMS, CCTV and other critical monitoring may also be here (advisory).","method":"V, T","sev":4,"rule":["fcc"],"area":"FCC","weight":4},{"id":"J-04","sec":"J","req":"Two laminated and bound sets of all floor plans with details of firefighting equipment and installations are kept in the fire command centre.","ref":"[NBC 2016, Part 4, Cl. 3.4.12(c)]","type":"Mandatory (shall)","app":"Where a fire command centre is provided","guide":"Check that plans reflect the current layout.","method":"D","sev":2,"rule":["fcc"],"area":"DOC","weight":2},{"id":"J-05","sec":"J","req":"The fire command centre is staffed, and the staff in charge maintain the services and firefighting equipment in coordination with security, electrical and civil staff.","ref":"[NBC 2016, Part 4, Cl. 3.4.12(d); NBC 2016, Part 12, Cl. 15.8]","type":"Mandatory (shall)","app":"Where a fire command centre is provided","guide":"Check the 24-hour roster and operator competence (ask the operator to identify an alarm location and make a PA announcement).","method":"D, T","sev":4,"rule":["fcc"],"area":"FCC","weight":4},{"id":"J-06","sec":"J","req":"The fire command station has adequate illumination, communication to mechanical equipment rooms and lift control rooms, a copy of the Fire Safety Plan, the Building Information Form and representative floor plans.","ref":"[NBC 2016, Part 4, Annex D, Cl. D-8.10, D-9.8, D-9.9]","type":"Mandatory (shall)","app":"High rise (15 m and above) (Annex D guidelines)","guide":"Check documents are present and current.","method":"D, V","sev":2,"rule":["h15"],"area":"FCC","weight":2},{"id":"K-01","sec":"K","req":"A firefighting shaft is provided for each residential building/tower, each educational building/block, and each compartment of institutional, assembly, business and mercantile occupancies.","ref":"[NBC 2016, Part 4, Annex E, Cl. E-2; Cl. 2.24]","type":"Mandatory (shall)","app":"High rise (15 m and above)","guide":"For other occupancies the requirement is settled with the local fire authority. The shaft has 120 min protection and connects directly to exit discharge or through a 120 min exit passageway.","method":"D, V","sev":5,"rule":["h15"],"area":"LFT","weight":5},{"id":"K-02","sec":"K","req":"The firefighting shaft has a protected lobby, staircase and fireman's lift, 120 min fire doors, firemen talk-back, and a wet riser with landing valve in its lobby.","ref":"[NBC 2016, Part 4, Cl. 2.24, Fig. 2]","type":"Mandatory (shall)","app":"High rise (15 m and above)","guide":"The lobby of an enclosed shaft should display the floor plan (Note 2 to Fig. 2, recommendation). Smoke control of the staircase and lift lobby follows Cl. 4.4.2.5 and Table 6.","method":"V, T","sev":4,"rule":["h15"],"area":"LFT","weight":4},{"id":"K-03","sec":"K","req":"At least one fireman's lift is provided per building, per wing and per bank of lifts, identified on the building plan displayed in the fire command centre.","ref":"[NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(k)]","type":"Mandatory (shall)","app":"Height more than 15 m","guide":"Confirm identification on plans and at landings.","method":"D, V","sev":4,"rule":["h15"],"area":"LFT","weight":4},{"id":"K-04","sec":"K","req":"The fireman's lift has a floor area of minimum 1.43 m2, loading capacity not less than 544 kg (8 persons), power operated doors of minimum 0.8 m width, and speed sufficient to reach the top floor from the fire access level within 1 min.","ref":"[NBC 2016, Part 8, Sec 5A, Cl. 7.1.1(k)(iv) to (vi)]","type":"Mandatory (shall)","app":"Height more than 15 m","guide":
